<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Store Tasks</title>
<style>
  :root {
    --bg: #f2f3f8;
    --card: #ffffff;
    --glass: rgba(255, 255, 255, .58);
    --glass-line: rgba(255, 255, 255, .75);
    --text: #14172b;
    --muted: #6b7085;
    --line: #e3e5ee;
    --accent: #3b5bfd;
    --accent-soft: #e8ecff;
    --ok: #1fa36b;
    --ok-soft: #e2f6ec;
    --warn: #c77b12;
    --warn-soft: #fcefdc;
    --danger: #d33f49;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(20, 23, 43, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1220;
      --card: #191d31;
      --glass: rgba(25, 29, 49, .55);
      --glass-line: rgba(255, 255, 255, .10);
      --text: #eceef7;
      --muted: #9aa0b8;
      --line: #2a2f4a;
      --accent: #7d92ff;
      --accent-soft: #232a4d;
      --ok: #3ecf8e;
      --ok-soft: #163a2c;
      --warn: #e8a13c;
      --warn-soft: #3d2f14;
      --danger: #ff6b74;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100dvh;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--glass);
    -webkit-backdrop-filter: blur(22px) saturate(1.8);
    backdrop-filter: blur(22px) saturate(1.8);
    padding: calc(12px + env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--glass-line);
  }
  header h1 { font-size: 1.15rem; letter-spacing: -.01em; }
  #whoami-chip {
    font-size: .85rem; color: var(--accent); background: var(--accent-soft);
    border: none; border-radius: 999px; padding: 6px 12px; font-weight: 600;
  }
  main { padding: 14px 14px 20px; max-width: 640px; margin: 0 auto; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(20, 23, 43, .04);
  }
  .card h3 { font-size: 1.02rem; margin-bottom: 2px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: .82rem; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .spread { justify-content: space-between; }
  .field { margin-top: 10px; }
  .field label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
  select, input[type=text], input[type=date], input[type=password] {
    width: 100%; padding: 11px 12px; font-size: 1rem;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg); color: var(--text);
    -webkit-appearance: none; appearance: none;
  }
  button {
    font-family: inherit; font-size: .95rem; font-weight: 600;
    border: none; border-radius: 12px; padding: 11px 16px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.ghost { background: var(--accent-soft); color: var(--accent); }
  button.small { padding: 7px 12px; font-size: .85rem; }
  button.danger { background: transparent; color: var(--danger); padding: 7px 8px; }
  button:disabled { opacity: .5; }
  .toggle {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 999px; font-size: .85rem; font-weight: 600;
    background: var(--warn-soft); color: var(--warn); cursor: pointer; border: none;
  }
  .toggle.on { background: var(--ok-soft); color: var(--ok); }
  .badge {
    font-size: .75rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    background: var(--warn-soft); color: var(--warn);
  }
  .badge.done { background: var(--ok-soft); color: var(--ok); }
  .dd-summary { cursor: pointer; }
  .role-tag {
    font-size: .7rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .04em; cursor: pointer; border: none;
    background: var(--accent-soft); color: var(--accent);
  }
  .role-tag.pro { background: rgba(168, 85, 247, .16); color: #8b3fd4; }
  .aud-tag {
    font-size: .68rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
    background: rgba(16, 185, 129, .16); color: #0d9668;
    border: none; cursor: pointer;
  }
  .aud-tag.pz { background: rgba(245, 158, 11, .18); color: #b8730a; }
  @media (prefers-color-scheme: dark) {
    .role-tag.pro { color: #c78dff; }
    .aud-tag { color: #34d399; }
    .aud-tag.pz { color: #fbbf24; }
  }
  .manager-line {
    margin-top: 10px; font-size: .85rem; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .date-head {
    margin: 18px 4px 8px; font-size: .82rem; font-weight: 700;
    color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
  }
  .date-head.today { color: var(--accent); }
  .mini {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 11px 14px; margin-bottom: 8px;
  }
  .mini .sub { flex: 1; }
  details.past { margin-top: 18px; }
  details.past summary {
    cursor: pointer; color: var(--muted); font-size: .85rem; font-weight: 600;
    padding: 8px 2px; list-style: none;
  }
  nav {
    position: fixed; z-index: 10;
    left: max(12px, env(safe-area-inset-left));
    right: max(12px, env(safe-area-inset-right));
    bottom: calc(12px + env(safe-area-inset-bottom));
    display: flex;
    background: var(--glass);
    -webkit-backdrop-filter: blur(24px) saturate(1.8);
    backdrop-filter: blur(24px) saturate(1.8);
    border: 1px solid var(--glass-line);
    border-radius: 32px;
    box-shadow: var(--shadow);
    padding: 6px;
    max-width: 500px; margin: 0 auto;
  }
  nav button {
    flex: 1; background: none; color: var(--muted); border-radius: 24px;
    padding: 7px 0 6px; font-size: .68rem; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  nav button .ico {
    display: flex; align-items: center; justify-content: center;
    width: 46px; height: 28px; border-radius: 999px;
    transition: background .2s;
  }
  nav button .ico svg { width: 21px; height: 21px; }
  nav button.active { color: var(--accent); }
  nav button.active .ico { background: var(--accent-soft); }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: .9rem; }
  .empty-big { text-align: center; color: var(--muted); padding: 90px 24px 30px; }
  .empty-big .glyph { font-size: 2.6rem; margin-bottom: 12px; }
  .empty-big h2 { color: var(--text); font-size: 1.1rem; margin-bottom: 6px; }
  .section-head { display: flex; justify-content: space-between; align-items: center; margin: 6px 2px 12px; }
  .section-head h2 { font-size: 1.05rem; letter-spacing: -.01em; }
  dialog {
    border: none; border-radius: 20px; background: var(--card); color: var(--text);
    width: min(92vw, 420px); padding: 18px;
    box-shadow: var(--shadow);
  }
  dialog::backdrop {
    background: rgba(10, 12, 25, .35);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  dialog h3 { margin-bottom: 4px; }
  .dialog-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  #toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(96px + env(safe-area-inset-bottom));
    background: var(--text); color: var(--bg); padding: 10px 18px;
    border-radius: 999px; font-size: .85rem; opacity: 0; transition: opacity .25s;
    pointer-events: none; z-index: 50; max-width: 88vw; text-align: center;
  }
  #toast.show { opacity: 1; }
  .login-wrap {
    min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .login-box { width: min(92vw, 380px); text-align: center; }
  .login-box .logo { font-size: 3rem; margin-bottom: 8px; }
  .login-box h1 { margin-bottom: 4px; }
  .login-box p { color: var(--muted); font-size: .9rem; margin-bottom: 20px; }
  .login-box form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .who-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; max-height: 45dvh; overflow-y: auto; }
  .who-list button { background: var(--card); color: var(--text); border: 1px solid var(--line); text-align: left; }
  .log-item { padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: .85rem; }
  .log-item:last-child { border-bottom: none; }
  .log-item .sub { margin-top: 2px; }
  /* ── Validation ── */
  .seg {
    display: flex; gap: 4px; padding: 4px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 13px; margin-bottom: 14px;
  }
  .fchip {
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    border-radius: 999px; padding: 7px 14px; font-size: .82rem; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .progress { height: 7px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--ok); border-radius: 999px; transition: width .3s; }
  .seg button {
    flex: 1; border: none; background: none; padding: 9px 6px; border-radius: 10px;
    font-size: .9rem; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.13); }
  .wave-head {
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 18px 4px 8px;
  }
  .wave-head:first-child { margin-top: 2px; }
  .wave-head .wn { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
  .wave-head .wm { font-size: .78rem; color: var(--muted); }
  .dots { display: flex; gap: 5px; }
  .dot { width: 22px; height: 7px; border-radius: 999px; background: var(--line); }
  .dot.s1 { background: var(--warn); }
  .dot.s2 { background: var(--ok); }
  .dot.na { background: transparent; border: 1px dashed var(--muted); }
  .area-head {
    display: flex; align-items: center; gap: 10px; margin: 16px 4px 7px;
    font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  }
  .area-head .ac { margin-left: auto; font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .comp-row {
    width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
    display: flex; gap: 12px; align-items: flex-start; font-family: inherit; color: var(--text);
  }
  .comp-row.sub { margin-left: 14px; }
  .mark {
    width: 25px; height: 25px; min-width: 25px; border-radius: 8px; display: grid; place-items: center;
    font-size: .8rem; font-weight: 700; background: var(--line); color: var(--muted);
  }
  .mark.s1 { background: var(--warn-soft); color: var(--warn); }
  .mark.s2 { background: var(--ok); color: #fff; }
  .mark.na { background: transparent; border: 1px dashed var(--muted); }
  .comp-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .comp-name { font-size: .97rem; font-weight: 600; }
  .comp-row.sub .comp-name { font-weight: 500; }
  .comp-state { font-size: .78rem; color: var(--muted); }
  .comp-note { font-size: .78rem; color: var(--muted); font-style: italic; }
  .backlink {
    background: none; border: none; color: var(--accent); font-size: .95rem; font-weight: 600;
    padding: 2px 0 12px; cursor: pointer; font-family: inherit;
  }
  .hist { margin-top: 18px; }
  .hist-i { display: flex; gap: 9px; padding: 8px 2px; font-size: .84rem; color: var(--muted); }
  .hist-i b { color: var(--text); font-weight: 600; }
  .hist-dot { width: 8px; height: 8px; border-radius: 99px; margin-top: 7px; flex: none; }
  .att-row {
    display: flex; align-items: center; gap: 12px; padding: 11px 14px;
    border-bottom: 1px solid var(--line);
  }
  .att-row:last-child { border-bottom: none; }
  .att-name { flex: 0 0 40%; font-size: .9rem; font-weight: 600; }
  .att-name em { display: block; font-style: normal; font-size: .72rem; color: var(--muted); font-weight: 400; }
  .att-bar { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; display: flex; }
  .att-bar i { display: block; height: 100%; }
  .att-bar i.v { background: var(--ok); }
  .att-bar i.o { background: var(--warn); }
  .att-num { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; min-width: 46px; text-align: right; }
  .att-flag { font-size: .7rem; font-weight: 700; color: var(--danger); flex: none; }
  .t-row {
    display: flex; align-items: center; gap: 10px; padding: 11px 13px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px;
  }
  .t-row.tap { cursor: pointer; }
  .t-txt { flex: 1; min-width: 0; }
  .t-name { font-size: .96rem; font-weight: 600; display: block; }
  .t-meta { font-size: .75rem; color: var(--muted); display: block; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="view-login" class="login-wrap hidden">
  <div class="login-box">
    <div class="logo">🏬</div>
    <h1>Store Tasks</h1>
    <p>Inserisci la password del team per entrare.</p>
    <form id="login-form">
      <input type="password" id="login-password" placeholder="Password del team" autocomplete="current-password" required>
      <button type="submit" id="login-btn">Entra</button>

</div>

<div id="view-whoami" class="login-wrap hidden">
  <div class="login-box">

</div>

<div id="view-app" class="hidden">
  <header>
    <h1 id="tab-title">Daily Download</h1>
    <button id="whoami-chip" title="Cambia utente"></button>
  </header>
  <main id="main"></main>
  <nav>
    <button data-tab="dd" class="active">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="4.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
      DD</button>
    <button data-tab="validation">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.4l2.4 2.4 4.6-5"/></svg></span>
      Validation</button>
    <button data-tab="team">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.4"/><path d="M3.2 19.3c.8-3.1 3.1-4.7 5.8-4.7s5 1.6 5.8 4.7"/><circle cx="16.8" cy="9.8" r="2.6"/><path d="M15.6 14.7c2.3.2 4.2 1.6 4.9 4"/></svg></span>

      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3.2 2"/></svg></span>
      Storico</button>
  </nav>
</div>

<div id="toast"></div>

<dialog id="dlg">
  <form method="dialog" id="dlg-form"></form>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// ── Configurazione ──────────────────────────────────────────
const SUPABASE_URL = "https://nrxnmucuwucfecnphrtf.supabase.co";
const SUPABASE_KEY = "sb_publishable_OJnekj88Hcc4zCXVo8k9Uw_oSlwAmXm";
const SHARED_EMAIL = "marcocasati+storetasks@gmail.com"; // utente condiviso in Supabase Auth

const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// ── Stato ───────────────────────────────────────────────────
let people = [], downloads = [], logRows = [];
let comps = [], fweList = [], events = [];
let tab = "dd";
let me = JSON.parse(localStorage.getItem("whoami") || "null");
let openDD = new Set(); // schede DD espanse
let hasAudience = false; // il tag destinatari appare solo se la colonna esiste
let hasValidation = false; // il tab Validation si attiva quando il database è pronto
let vSeg = "persone", vFilter = "tutti", openFweId = null, vEditor = false;
let teamSeg = "key";
let stateMap = {}, pairHist = {};

const $ = (s) => document.querySelector(s);
const views = { login: $("#view-login"), whoami: $("#view-whoami"), app: $("#view-app") };
function show(name) {
  Object.entries(views).forEach(([k, el]) => el.classList.toggle("hidden", k !== name));
}
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
}
const esc = (s) => (s ?? "").toString().replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const fmtDate = (d) => d ? new Date(d + "T00:00:00").toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" }) : "—";
const fmtDateShort = (d) => d ? new Date(d + "T00:00:00").toLocaleDateString("it-IT", { day: "numeric", month: "short" }) : "—";
const fmtTs = (ts) => new Date(ts).toLocaleString("it-IT", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const personName = (id) => people.find(p => p.id === id)?.name || "—";
const ddLabel = (d) => d.title || `DD del ${fmtDateShort(d.date)}`;
const audienceLabel = (a) => a === "pz" ? "PZ solo" : "All team";

// Evento .ics per aggiungere il DD al proprio calendario (promemoria ore 9:00)
function ddToICS(d) {
  const icsEsc = (s) => (s ?? "").toString()
    .replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  const day = d.date.replace(/-/g, "");
  const next = new Date(d.date + "T00:00:00");
  next.setDate(next.getDate() + 1);
  const dayEnd = `${next.getFullYear()}${String(next.getMonth()+1).padStart(2,"0")}${String(next.getDate()).padStart(2,"0")}`;
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const details = [
    hasAudience ? `Destinatari: ${audienceLabel(d.audience)}` : null,
    d.preparer_id ? `Prepara: ${personName(d.preparer_id)}` : null,
    d.presenter_id ? `Facilita: ${personName(d.presenter_id)}` : null,
    d.manager ? `Manager presente: ${d.manager}` : null,
    d.notes ? `Note: ${d.notes}` : null,
  ].filter(Boolean).join("\n");
  return [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Store Tasks//IT",
    "BEGIN:VEVENT",
    `UID:dd-${d.id}@store-tasks`,
    `DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${day}`,
    `DTEND;VALUE=DATE:${dayEnd}`,
    `SUMMARY:${icsEsc("DD: " + ddLabel(d))}`,
    details ? `DESCRIPTION:${icsEsc(details)}` : null,
    "BEGIN:VALARM",
    "ACTION:DISPLAY",
    `DESCRIPTION:${icsEsc("Tra 5 giorni DD: " + ddLabel(d))}`,
    "TRIGGER;RELATED=START:-P4DT15H",
    "END:VALARM",
    "END:VEVENT",
    "END:VCALENDAR",
  ].filter(Boolean).join("\r\n");
}

function downloadICS(d) {
  const blob = new Blob([ddToICS(d)], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `dd-${d.date}.ics`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  toast("Evento creato: aprilo per salvarlo in Calendario");
}

// ── Login ───────────────────────────────────────────────────
$("#login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("#login-btn");

// ── Dati ────────────────────────────────────────────────────
async function detectSchema() {
  const [a, v] = await Promise.all([
    db.from("downloads").select("audience").limit(1),
    db.from("fwe_events").select("id").limit(1),
  ]);
  hasAudience = !a.error;
  hasValidation = !v.error;
}

async function loadAll() {
  const base = [
    db.from("people").select("*").order("name"),
    db.from("downloads").select("*").order("date"),
    db.from("activity_log").select("*").order("id", { ascending: false }).limit(80),
  ];
  if (hasValidation) base.push(
    db.from("competencies").select("*").order("position"),
    db.from("fwe").select("*").order("name"),
    db.from("fwe_events").select("*").order("id"),
  );
  const r = await Promise.all(base);
  people = r[0].data || []; downloads = r[1].data || []; logRows = r[2].data || [];
  if (hasValidation) {
    comps = r[3].data || []; fweList = r[4].data || []; events = r[5].data || [];
    buildState();
  }
}

// Lo stato di una competenza è il suo ultimo evento; un livello 1 che segue
// un livello 2 è un passo indietro, non un'osservazione.
function buildState() {
  stateMap = {}; pairHist = {};
  events.forEach(e => {
    const k = e.fwe_id + "|" + e.competency_id;
    const arr = pairHist[k] || (pairHist[k] = []);
    const prev = arr[arr.length - 1];
    e.isRevert = e.level === 1 && prev && prev.level === 2;
    arr.push(e);
    stateMap[k] = e;
  });
}

const areaList = () => comps.filter(c => !c.parent_id && c.active).sort((a, b) => a.position - b.position);
const kidsOf = (a) => comps.filter(c => c.parent_id === a.id && c.active).sort((x, y) => x.position - y.position);
const leavesOf = (a) => { const k = kidsOf(a); return k.length ? k : [a]; };
const allLeaves = () => areaList().flatMap(leavesOf);
const evOf = (fweId, leafId) => stateMap[fweId + "|" + leafId] || null;
const stOf = (fweId, leafId) => { const e = evOf(fweId, leafId); return e ? e.level : 0; };

function areaState(fweId, a) {
  const v = leavesOf(a).map(l => stOf(fweId, l.id)).filter(x => x !== -1);
  if (!v.length) return -1;
  if (v.every(x => x === 2)) return 2;
  if (v.every(x => x === 0)) return 0;
  return 1;
}
const reqAreas = (f) => areaList().filter(a => areaState(f.id, a) !== -1);
const doneAreas = (f) => reqAreas(f).filter(a => areaState(f.id, a) === 2).length;
const totAreas = (f) => reqAreas(f).length;
const isComplete = (f) => totAreas(f) > 0 && doneAreas(f) === totAreas(f);

function lastTouch(f) {
  const mine = events.filter(e => e.fwe_id === f.id);
  return mine.length ? mine[mine.length - 1].created_at : f.created_at;
}
function idleDays(f) {
  return Math.floor((Date.now() - new Date(lastTouch(f)).getTime()) / 86400000);
}
const isStuck = (f) => idleDays(f) > 14 && !isComplete(f);

// I quattro occhi: chi ha osservato non valida mai quella competenza.
function myObservation(fweId, leafId) {
  const h = pairHist[fweId + "|" + leafId] || [];
  return h.find(e => e.level === 1 && !e.isRevert && e.actor_name === me?.name) || null;
}
const canValidate = (fweId, leafId) => !myObservation(fweId, leafId);

async function log(action) {
  await db.from("activity_log").insert({ actor: me?.name || "?", action });
}

let rtChannel = null, reloadTimer = null;
function subscribeRealtime() {
  if (rtChannel) return;
  rtChannel = db.channel("db-changes")
    .on("postgres_changes", { event: "*", schema: "public" }, () => {
      clearTimeout(reloadTimer);
      reloadTimer = setTimeout(async () => { await loadAll(); render(); }, 400);
    })
    .subscribe();
}

function renderDD(main) {
  const today = todayStr();
  const upcoming = downloads.filter(d => d.date >= today);
  const past = downloads.filter(d => d.date < today).reverse();

  const groups = [];
  for (const d of upcoming) {
    const g = groups[groups.length - 1];
    if (g && g.date === d.date) g.items.push(d);
    else groups.push({ date: d.date, items: [d] });
  }
  const calendar = groups.map(g => `
    <div class="date-head ${g.date === today ? "today" : ""}">
      ${g.date === today ? "Oggi · " : ""}${fmtDate(g.date)}</div>
    ${g.items.map(ddCard).join("")}`).join("");

  const pastHtml = past.length ? `
    <details class="past"><summary>Giorni passati (${past.length}) ▾</summary>
      ${past.map(d => `
        <div class="mini">
          <span class="badge ${d.uploaded ? "done" : ""}">${d.uploaded ? "✓" : "✗"}</span>
          <span class="sub">${fmtDateShort(d.date)} · ${esc(ddLabel(d))}</span>
          <button class="ghost small" data-act="edit-dd" data-id="${d.id}">Modifica</button>
        </div>`).join("")}
    </details>` : "";

  main.innerHTML = `
    <div class="section-head"><h2>Calendario</h2>
      <button class="small" id="add-dd">+ Nuovo DD</button></div>
    ${calendar || `<div class="empty">Nessun DD in programma.<br>Aggiungine uno con “+ Nuovo DD”.</div>`}
    ${pastHtml}`;

  $("#add-dd").onclick = () => openDialog("Nuovo DD", ddFormFields(null),
    async (fd) => {
      const row = {
        date: fd.get("date"),
        title: fd.get("title").trim(),
        ...(hasAudience ? { audience: fd.get("audience") } : {}),
        preparer_id: fd.get("preparer_id") || null,
        presenter_id: fd.get("presenter_id") || null,
        manager: fd.get("manager").trim() || null,
        notes: fd.get("notes").trim() || null,
      };
      const { error } = await db.from("downloads").insert(row);
      if (error) { toast("Errore nel salvataggio"); return; }
      await log(`ha creato il DD “${row.title}” del ${fmtDateShort(row.date)}${hasAudience ? ` (${audienceLabel(row.audience)})` : ""}`);
      await refresh();
    });

  main.querySelectorAll("[data-act=edit-dd]").forEach(b => {
    b.onclick = () => {
      const d = downloads.find(x => x.id === b.dataset.id);
      openDialog("Modifica DD", ddFormFields(d) + `
        <div class="row" style="margin-top:14px">
          <button type="button" class="danger small" id="dlg-delete">Elimina questo DD</button>
        </div>`,
        async (fd) => {
          const row = {
            date: fd.get("date"),
            title: fd.get("title").trim(),
            ...(hasAudience ? { audience: fd.get("audience") } : {}),
            preparer_id: fd.get("preparer_id") || null,
            presenter_id: fd.get("presenter_id") || null,
            manager: fd.get("manager").trim() || null,
            notes: fd.get("notes").trim() || null,
            updated_at: new Date().toISOString(),
          };
          const { error } = await db.from("downloads").update(row).eq("id", d.id);
          if (error) { toast("Errore nel salvataggio"); return; }
          await log(`ha modificato il DD “${row.title}” del ${fmtDateShort(row.date)}`);
          await refresh();
        },
        (form) => {
          form.querySelector("#dlg-delete").onclick = async () => {
            if (!confirm(`Eliminare “${ddLabel(d)}”?`)) return;
            await db.from("downloads").delete().eq("id", d.id);
            await log(`ha eliminato il DD “${ddLabel(d)}”`);
            $("#dlg").close();
            await refresh();
          };
        });
    };
  });

  main.querySelectorAll(".sel-preparer, .sel-presenter").forEach(sel => {
    sel.onchange = async () => {
      const field = sel.classList.contains("sel-preparer") ? "preparer_id" : "presenter_id";
      const d = downloads.find(x => x.id === sel.dataset.id);
      const val = sel.value || null;
      await db.from("downloads").update({ [field]: val, updated_at: new Date().toISOString() }).eq("id", d.id);
      await log(`ha assegnato ${field === "preparer_id" ? "la preparazione" : "la facilitazione"} di “${ddLabel(d)}” a ${val ? personName(val) : "nessuno"}`);
      await refresh();
    };
  });
  main.querySelectorAll("[data-dd-toggle]").forEach(el => {
    el.onclick = () => {
      const id = el.dataset.ddToggle;
      openDD.has(id) ? openDD.delete(id) : openDD.add(id);
      render();
    };
  });
  main.querySelectorAll("[data-act=toggle-aud]").forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation(); // non espandere/chiudere la scheda
      const d = downloads.find(x => x.id === b.dataset.id);
      const audience = d.audience === "pz" ? "all" : "pz";
      const { error } = await db.from("downloads").update({ audience, updated_at: new Date().toISOString() }).eq("id", d.id);
      if (error) { toast("Errore nel salvataggio"); return; }
      await log(`ha impostato “${ddLabel(d)}” per ${audienceLabel(audience)}`);
      await refresh();
    };
  });
  main.querySelectorAll("[data-act=ics]").forEach(b => {
    b.onclick = () => downloadICS(downloads.find(x => x.id === b.dataset.id));
  });
  main.querySelectorAll("[data-act=uploaded]").forEach(b => {
    b.onclick = async () => {
      const d = downloads.find(x => x.id === b.dataset.id);
      const val = !d.uploaded;
      await db.from("downloads").update({ uploaded: val, updated_at: new Date().toISOString() }).eq("id", d.id);
      await log(`ha segnato “${ddLabel(d)}” come ${val ? "caricato" : "da caricare"}`);
      await refresh();
    };
  });
}

// ── Validation ──────────────────────────────────────────────
const ST_LABEL = { "-1": "Non richiesta", 0: "Da osservare", 1: "Osservato · da validare", 2: "Validato" };

async function addEvent(fweId, leafId, level, note) {
  const { error } = await db.from("fwe_events").insert({
    fwe_id: fweId, competency_id: leafId, level,
    actor_id: me.id, actor_name: me.name, note: note || null,
  });
  if (error) { toast("Errore nel salvataggio"); return false; }
  return true;
}

function renderValidation(main) {
  if (!hasValidation) {
    main.innerHTML = `
      <div class="empty-big">
        <div class="glyph">🚧</div>
        <h2>Quasi pronto</h2>
        <p>Manca l'ultimo passaggio sul database.<br>Esegui <strong>migration-5.sql</strong> e questa sezione si accende da sola.</p>
      </div>`;
    return;
  }
  if (openFweId) return renderFweDetail(main);
  if (vEditor) return renderCompEditor(main);

  const seg = `
    <div class="seg" role="group" aria-label="Vista">
      <button type="button" data-vseg="persone" aria-pressed="${vSeg === "persone"}">Persone</button>
      <button type="button" data-vseg="competenze" aria-pressed="${vSeg === "competenze"}">Competenze</button>
    </div>`;

  if (vSeg === "competenze") { renderCompetenze(main, seg); return; }

  const nStuck = fweList.filter(isStuck).length;
  const nDone = fweList.filter(isComplete).length;
  const list = fweList.filter(f =>
    vFilter === "fermi" ? isStuck(f) : vFilter === "completi" ? isComplete(f) : true);

  const waves = [...new Set(fweList.map(f => f.wave || 1))].sort((a, b) => a - b);
  const groups = waves.map(w => {
    const g = list.filter(f => (f.wave || 1) === w)
      .sort((a, b) => (isStuck(b) - isStuck(a)) || (doneAreas(b) - doneAreas(a)) || a.name.localeCompare(b.name));
    if (!g.length) return "";
    return `<div class="wave-head"><span class="wn">Wave ${w}</span>
      <span class="wm">${g.length} ${g.length === 1 ? "persona" : "persone"} · ${g.filter(isComplete).length} complete</span></div>` +
      g.map(fweCard).join("");
  }).join("");

  main.innerHTML = seg + `
    <div class="filters" style="display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap">
      <button type="button" class="fchip" data-vf="tutti" aria-pressed="${vFilter === "tutti"}">Tutti · ${fweList.length}</button>
      <button type="button" class="fchip" data-vf="fermi" aria-pressed="${vFilter === "fermi"}">Fermi · ${nStuck}</button>
      <button type="button" class="fchip" data-vf="completi" aria-pressed="${vFilter === "completi"}">Completi · ${nDone}</button>
    </div>
    ${groups || `<div class="empty">Nessun FWE in questa vista.<br>Aggiungili dal tab Team.</div>`}`;

  main.querySelectorAll("[data-vf]").forEach(b => b.onclick = () => { vFilter = b.dataset.vf; render(); });
  main.querySelectorAll("[data-fwe]").forEach(b => b.onclick = () => { openFweId = b.dataset.fwe; render(); });
}

function fweCard(f) {
  const done = doneAreas(f), tot = totAreas(f);
  const pill = isComplete(f) ? `<span class="badge done">Completo</span>`
    : isStuck(f) ? `<span class="badge">Fermo da ${idleDays(f)}g</span>`
    : `<span class="badge">${done}/${tot}</span>`;
  return `<button type="button" class="card" data-fwe="${f.id}"
      style="width:100%;text-align:left;display:flex;flex-direction:column;gap:8px;cursor:pointer;color:var(--text)">
    <div class="row spread" style="width:100%"><h3>${esc(f.name)}</h3>${pill}</div>
    <div class="dots">${areaList().map(a => {
      const s = areaState(f.id, a);
      return `<span class="dot ${s === -1 ? "na" : s ? "s" + s : ""}"></span>`;
    }).join("")}</div>
  </button>`;
}

function renderFweDetail(main) {
  const f = fweList.find(x => x.id === openFweId);
  if (!f) { openFweId = null; return render(); }
  const done = doneAreas(f), tot = totAreas(f);

  let html = `<button type="button" class="backlink" id="v-back">‹ Tutti gli FWE</button>
    <div class="card">
      <div class="row spread"><div><h3>${esc(f.name)}</h3>
        <div class="sub">Wave ${f.wave || 1}</div></div>
        ${isComplete(f) ? `<span class="badge done">Completo</span>` : `<span class="badge">${done}/${tot}</span>`}
      </div>
      <div class="progress" style="margin-top:10px"><div style="width:${tot ? done / tot * 100 : 0}%"></div></div>
    </div>
    <div class="sub" style="margin:10px 4px 4px">Tocca una voce per aggiornarla: confermi sempre prima del salvataggio, e puoi aggiungere una nota.</div>`;

  areaList().forEach(a => {
    const leaves = leavesOf(a), isParent = kidsOf(a).length > 0;
    if (isParent) {
      const nOk = leaves.filter(l => stOf(f.id, l.id) === 2).length;
      html += `<div class="area-head"><span>${esc(a.label)}</span>
        <span class="ac">${areaState(f.id, a) === -1 ? "non richiesta" : nOk + "/" + leaves.length}</span></div>`;
    }
    leaves.forEach(l => {
      const lvl = stOf(f.id, l.id), ev = evOf(f.id, l.id);
      const meta = ev && lvl > 0 ? ` · ${esc(ev.actor_name)} · ${fmtTs(ev.created_at)}` : "";
      html += `<button type="button" class="comp-row${isParent ? " sub" : ""}" data-leaf="${l.id}">
        <span class="mark ${lvl === -1 ? "na" : lvl ? "s" + lvl : ""}">${lvl === 2 ? "✓" : lvl === 1 ? "◐" : lvl === -1 ? "–" : ""}</span>
        <span class="comp-main">
          <span class="comp-name">${esc(l.label)}</span>
          <span class="comp-state">${ST_LABEL[lvl]}${meta}</span>
          ${ev && ev.note && lvl === 1 ? `<span class="comp-note">“${esc(ev.note)}”</span>` : ""}
        </span>
        <span class="sub" style="font-size:1.1rem">›</span>
      </button>`;
    });
  });

  const hist = events.filter(e => e.fwe_id === f.id).slice().reverse().slice(0, 30);
  if (hist.length) {
    html += `<div class="hist"><div class="area-head"><span>Storico</span></div>` + hist.map(e => {
      const node = comps.find(c => c.id === e.competency_id);
      const verb = e.level === 2 ? "ha validato" : e.isRevert ? "ha riportato a osservato"
        : e.level === 1 ? "ha osservato" : e.level === 0 ? "ha riportato a da osservare" : "ha aggiornato";
      return `<div class="hist-i">
        <span class="hist-dot" style="background:${e.level === 2 ? "var(--ok)" : e.isRevert ? "var(--danger)" : "var(--warn)"}"></span>
        <span><b>${esc(e.actor_name)}</b> ${verb} ${esc(node ? node.label : "—")} · ${fmtTs(e.created_at)}
        ${e.note ? `<br>“${esc(e.note)}”` : ""}</span></div>`;
    }).join("") + `</div>`;
  }

  main.innerHTML = html;
  $("#v-back").onclick = () => { openFweId = null; render(); };
  main.querySelectorAll("[data-leaf]").forEach(b => b.onclick = () => tapLeaf(f, b.dataset.leaf));
}

// Ogni tocco apre un foglio con la transizione, nota facoltativa e Annulla:
// niente avanza più per sbaglio. La nota è obbligatoria solo tornando
// indietro da Validato.
function tapLeaf(f, leafId) {
  const lvl = stOf(f.id, leafId);
  const node = comps.find(c => c.id === leafId);
  const trans = (a, b) => `<p class="sub" style="margin:4px 0 2px"><strong style="color:var(--text)">${ST_LABEL[a].split(" ·")[0]}</strong> → <strong style="color:var(--accent)">${ST_LABEL[b].split(" ·")[0]}</strong></p>`;

  let target, title, noteLabel = "Nota (facoltativa)", notePh = "es. demo iPhone con cliente indeciso";
  let noteRequired = false, extra = "", blocked = false;

  if (lvl === -1) { target = 0; title = "Richiedi questa competenza"; noteLabel = "Perché la aggiungi ora (facoltativa)"; notePh = "es. entrata nel percorso dopo il reparto"; }
  else if (lvl === 0) { target = 1; title = "Segna come osservato"; noteLabel = "Cosa hai osservato (facoltativa)"; }
  else if (lvl === 1) {
    target = 2; title = "Valida";
    noteLabel = "Cosa conferma che è autonomo (facoltativa)";
    notePh = "es. turno intero senza supporto";
    blocked = !canValidate(f.id, leafId);
    if (blocked) extra = `<p class="sub" style="color:var(--warn);margin-top:6px">L'hai osservata tu: la validazione spetta a un altro key role. Puoi però riportarla a “da osservare”.</p>`;
  } else {
    target = 1; title = "Torna a osservato"; noteRequired = true;
    noteLabel = "Cosa non ha funzionato (obbligatorio)";
    notePh = "es. sbaglia ancora il passaggio sul trade-in";
    const ev = evOf(f.id, leafId);
    if (ev) extra = `<p class="sub" style="margin-top:6px">Validato da ${esc(ev.actor_name)} il ${fmtTs(ev.created_at)}. Resta nello storico.</p>`;
  }

  // da "osservato" si può anche tornare a "da osservare" (il tap sbagliato si corregge qui)
  const backBtn = lvl === 1
    ? `<div class="row" style="margin-top:12px"><button type="button" class="ghost small" id="dlg-back0">↩︎ Riporta a “da osservare”</button></div>`
    : "";

  openDialog(title, `
      <p class="sub">${esc(node.label)} · ${esc(f.name)}</p>
      ${blocked ? "" : trans(lvl, target)}
      ${extra}
      ${blocked ? "" : `<div class="field"><label>${noteLabel}</label>
        <input type="text" name="note" placeholder="${notePh}" ${noteRequired ? "required" : ""}></div>`}
      ${backBtn}`,
    async (fd) => {
      if (blocked) return;
      const note = (fd.get("note") || "").trim();
      if (noteRequired && note.length < 3) { toast("Serve scrivere cosa non ha funzionato"); return; }
      if (!await addEvent(f.id, leafId, target, note || null)) return;
      if (lvl === 2) await log(`ha riportato a osservato “${node.label}” di ${f.name}: ${note}`);
      toast(target === 2 ? `${node.label} validato` : target === 1 ? (lvl === 2 ? `${node.label} torna da verificare` : `${node.label} osservato`) : `${node.label} ora è richiesta`);
      await refresh();
    },
    (form) => {
      if (blocked) form.querySelector("button[type=submit]").style.display = "none";
      const b0 = form.querySelector("#dlg-back0");
      if (b0) b0.onclick = async () => {
        const note = (form.querySelector("[name=note]")?.value || "").trim();
        if (!await addEvent(f.id, leafId, 0, note || null)) return;
        toast(`${node.label} torna a “da osservare”`);
        $("#dlg").close();
        await refresh();
      };
    });
}

// Vista per competenza: dove il floor è scoperto
function renderCompetenze(main, seg) {
  const rows = [];
  areaList().forEach(a => {
    const isParent = kidsOf(a).length > 0;
    leavesOf(a).forEach(l => {
      let v = 0, o = 0, tot = 0, rev = 0;
      fweList.forEach(f => {
        const s = stOf(f.id, l.id);
        if (s === -1) return;
        tot++; if (s === 2) v++; else if (s === 1) o++;
        rev += (pairHist[f.id + "|" + l.id] || []).filter(e => e.isRevert).length;
      });
      rows.push({ label: l.label, area: isParent ? a.label : null, v, o, tot, rev });
    });
  });
  rows.sort((x, y) => (x.tot ? x.v / x.tot : 1) - (y.tot ? y.v / y.tot : 1) || y.o - x.o);

  main.innerHTML = seg + `
    <div class="section-head"><h2>Dove serve attenzione</h2>
      <button class="small ghost" id="edit-comps">Modifica</button></div>
    <div class="sub" style="margin:0 4px 12px">Le competenze dalla più scoperta alla più solida, su tutti gli FWE.</div>
    <div class="card" style="padding:0">
      ${rows.length ? rows.map(r => `
        <div class="att-row">
          <span class="att-name">${esc(r.label)}${r.area ? `<em>${esc(r.area)}</em>` : ""}</span>
          <span class="att-bar"><i class="v" style="width:${r.tot ? r.v / r.tot * 100 : 0}%"></i><i class="o" style="width:${r.tot ? r.o / r.tot * 100 : 0}%"></i></span>
          ${r.rev ? `<span class="att-flag">${r.rev} indietro</span>` : ""}
          <span class="att-num">${r.v}/${r.tot}</span>
        </div>`).join("") : `<div class="empty">Nessuna competenza.</div>`}
    </div>`;
  $("#edit-comps").onclick = () => { vEditor = true; render(); };
}

// Editor dell'elenco competenze
function renderCompEditor(main) {
  const areas = comps.filter(c => !c.parent_id).sort((a, b) => a.position - b.position);
  let html = `<button type="button" class="backlink" id="v-back">‹ Competenze</button>
    <div class="sub" style="margin:0 4px 12px">Rinominare è sempre sicuro: le validazioni restano legate alla competenza, non al suo nome.</div>`;

  areas.forEach(a => {
    const kids = comps.filter(c => c.parent_id === a.id).sort((x, y) => x.position - y.position);
    html += `<div class="card" style="${a.active ? "" : "opacity:.55"}">
      <div class="row spread">
        <strong>${esc(a.label)}</strong>
        <span class="row" style="gap:6px">
          <button class="ghost small" data-ce="rename" data-id="${a.id}">Rinomina</button>
          <button class="${a.active ? "danger" : "ghost"} small" data-ce="toggle" data-id="${a.id}">${a.active ? "Disattiva" : "Riattiva"}</button>
        </span>
      </div>
      ${kids.map(k => `
        <div class="row spread" style="padding:7px 0 7px 14px;border-top:1px solid var(--line);${k.active ? "" : "opacity:.55"}">
          <span class="sub" style="color:var(--text)">${esc(k.label)}</span>
          <span class="row" style="gap:6px">
            <button class="ghost small" data-ce="rename" data-id="${k.id}">Rinomina</button>
            <button class="${k.active ? "danger" : "ghost"} small" data-ce="toggle" data-id="${k.id}">${k.active ? "Disattiva" : "Riattiva"}</button>
          </span>
        </div>`).join("")}
      <button class="ghost small" data-ce="add-sub" data-id="${a.id}" style="margin-top:10px;width:100%">+ Sotto-competenza</button>
    </div>`;
  });
  html += `<button class="small" id="add-area" style="width:100%">+ Nuova area</button>`;

  main.innerHTML = html;
  $("#v-back").onclick = () => { vEditor = false; render(); };
  $("#add-area").onclick = () => openAddComp(null);
  main.querySelectorAll("[data-ce]").forEach(b => {
    const c = comps.find(x => x.id === b.dataset.id);
    if (b.dataset.ce === "rename") b.onclick = () => openDialog("Rinomina", `
        <div class="field"><label>Nome</label><input type="text" name="label" value="${esc(c.label)}" required></div>`,
      async (fd) => {
        await db.from("competencies").update({ label: fd.get("label").trim() }).eq("id", c.id);
        await log(`ha rinominato la competenza in “${fd.get("label").trim()}”`);
        await refresh();
      });
    if (b.dataset.ce === "toggle") b.onclick = async () => {
      await db.from("competencies").update({ active: !c.active }).eq("id", c.id);
      await log(`${c.active ? "ha disattivato" : "ha riattivato"} la competenza “${c.label}”`);
      await refresh();
    };
    if (b.dataset.ce === "add-sub") b.onclick = () => openAddComp(c.id);
  });
}

function openAddComp(parentId) {
  const parent = parentId ? comps.find(c => c.id === parentId) : null;
  const firstSub = parent && comps.filter(c => c.parent_id === parentId).length === 0;
  openDialog(parent ? `Sotto-competenza di ${parent.label}` : "Nuova area", `
    <div class="field"><label>Nome</label><input type="text" name="label" required></div>
    ${firstSub ? `<p class="sub">“${esc(parent.label)}” diventa un contenitore: lo stato attuale di ciascun FWE passa a questa prima voce, così nessuno perde quanto già validato.</p>` : ""}
    <div class="field"><label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">
      <input type="checkbox" name="retro" style="width:auto;margin-top:3px">
      <span>Richiedila anche agli FWE già in percorso<br>
      <span class="sub">Se la lasci spenta resta “non richiesta” per chi c'è già.</span></span></label></div>`,
    async (fd) => {
      const label = fd.get("label").trim();
      const retro = fd.get("retro") === "on";
      const siblings = comps.filter(c => (c.parent_id || null) === (parentId || null));
      const pos = Math.max(0, ...siblings.map(c => c.position)) + 1;
      const { data, error } = await db.from("competencies")
        .insert({ label, position: pos, parent_id: parentId }).select().single();
      if (error) { toast("Errore nel salvataggio"); return; }

      const rows = [];
      fweList.forEach(f => {
        // la prima sotto-competenza eredita lo stato che l'area aveva
        const lvl = firstSub ? stOf(f.id, parentId) : (retro ? 0 : -1);
        if (lvl !== 0) rows.push({
          fwe_id: f.id, competency_id: data.id, level: lvl,
          actor_id: me.id, actor_name: me.name,
        });
      });
      if (rows.length) await db.from("fwe_events").insert(rows);
      await log(`ha aggiunto la competenza “${label}”`);
      await refresh();
    });
}

// ── Team ────────────────────────────────────────────────────
function renderTeam(main) {
  const seg = `
    <div class="seg" role="group" aria-label="Sezione del team">
      <button type="button" data-tseg="key" aria-pressed="${teamSeg === "key"}">Keyrole · ${people.length}</button>
      <button type="button" data-tseg="fwe" aria-pressed="${teamSeg === "fwe"}">FWE${hasValidation ? " · " + fweList.length : ""}</button>
    </div>`;
  if (teamSeg === "fwe") { renderTeamFwe(main, seg); return; }

  const rowsPeople = people.map(p => `
    <div class="row spread" style="padding:8px 0; border-bottom:1px solid var(--line)">
      <div class="row" style="gap:8px">
        <span>${esc(p.name)}</span>
        <button class="role-tag ${p.role === "pro" ? "pro" : ""}" data-act="toggle-role" data-id="${p.id}"
          title="Tocca per cambiare ruolo">${p.role === "pro" ? "Pro" : "Expert"}</button>
      </div>
      <button class="danger small" data-act="del-person" data-id="${p.id}">Elimina</button>
    </div>`).join("");
  main.innerHTML = seg + `
    <div class="section-head"><h2>Chi usa l'app</h2>
      <button class="small" id="add-person">+ Aggiungi</button></div>
    <div class="card">${rowsPeople || `<div class="empty">Nessuno ancora.</div>`}</div>
    <div class="sub" style="margin:8px 4px">Tocca Expert/Pro per cambiare il ruolo. Nella validazione i due ruoli hanno gli stessi poteri.</div>`;

  $("#add-person").onclick = () => openDialog("Nuova persona", `
      <div class="field"><label>Cognome</label><input type="text" name="name" required></div>
      <div class="field"><label>Ruolo</label>
        <select name="role"><option value="expert" selected>Expert</option><option value="pro">Pro</option></select></div>`,
    async (fd) => {
      const name = fd.get("name").trim();
      const role = fd.get("role");
      const { error } = await db.from("people").insert({ name, role });
      if (error) { toast("Nome già esistente?"); return; }
      await log(`ha aggiunto ${name} (${role === "pro" ? "Pro" : "Expert"}) al team`);
      await refresh();
    });

  main.querySelectorAll("[data-act=toggle-role]").forEach(b => {
    b.onclick = async () => {
      const p = people.find(x => x.id === b.dataset.id);
      const role = p.role === "pro" ? "expert" : "pro";
      const { error } = await db.from("people").update({ role }).eq("id", p.id);
      if (error) { toast("Errore nel salvataggio"); return; }
      await log(`ha impostato ${p.name} come ${role === "pro" ? "Pro" : "Expert"}`);
      await refresh();
    };
  });
  main.querySelectorAll("[data-act=del-person]").forEach(b => {
    b.onclick = async () => {
      const p = people.find(x => x.id === b.dataset.id);
      if (!confirm(`Eliminare ${p.name} dal team?\nLe attività già registrate nello Storico restano.`)) return;
      const { error } = await db.from("people").delete().eq("id", p.id);
      if (error) { toast("Errore nell'eliminazione"); return; }
      await log(`ha eliminato ${p.name} dal team`);
      if (me?.id === p.id) {
        localStorage.removeItem("whoami"); me = null;
        await loadAll(); showWhoami(); return;
      }
      await refresh();
    };
  });
}

function renderTeamFwe(main, seg) {
  if (!hasValidation) {
    main.innerHTML = seg + `<div class="empty">Esegui <strong>migration-5.sql</strong> per gestire gli FWE da qui.</div>`;
    main.querySelectorAll("[data-tseg]").forEach(b => b.onclick = () => { teamSeg = b.dataset.tseg; render(); });
    return;
  }
  const waves = [...new Set(fweList.map(f => f.wave || 1))].sort((a, b) => a - b);
  const groups = waves.map(w => {
    const g = fweList.filter(f => (f.wave || 1) === w).sort((a, b) => a.name.localeCompare(b.name));
    return `<div class="wave-head"><span class="wn">Wave ${w}</span>
      <span class="wm">${g.length} ${g.length === 1 ? "persona" : "persone"}</span></div>` +
      g.map(f => `
        <div class="t-row tap" data-fweedit="${f.id}">
          <span class="t-txt"><span class="t-name">${esc(f.name)}</span>
            <span class="t-meta">${doneAreas(f)} di ${totAreas(f)} aree</span></span>
          <span class="dots">${areaList().map(a => {
            const s = areaState(f.id, a);
            return `<span class="dot ${s === -1 ? "na" : s ? "s" + s : ""}"></span>`;
          }).join("")}</span>
        </div>`).join("");
  }).join("");

  main.innerHTML = seg + `
    <div class="section-head"><h2>Chi va validato</h2>
      <button class="small" id="add-fwe">+ Aggiungi</button></div>
    <div class="sub" style="margin:0 4px 6px">Non hanno accesso all'app. Tocca un nome per modificarlo.</div>
    ${groups || `<div class="empty">Nessun FWE ancora.</div>`}`;

  $("#add-fwe").onclick = () => openDialog("Nuovo FWE", `
      <div class="field"><label>Cognome</label><input type="text" name="name" required></div>
      <div class="field"><label>Wave</label><select name="wave">
        ${[1,2,3,4,5,6].map(w => `<option value="${w}">Wave ${w}</option>`).join("")}</select></div>`,
    async (fd) => {
      const name = fd.get("name").trim();
      const { error } = await db.from("fwe").insert({ name, wave: parseInt(fd.get("wave"), 10) });
      if (error) { toast("Nome già esistente?"); return; }
      await log(`ha aggiunto l'FWE ${name}`);
      await refresh();
    });

  main.querySelectorAll("[data-fweedit]").forEach(el => {
    el.onclick = () => {
      const f = fweList.find(x => x.id === el.dataset.fweedit);
      openDialog("Modifica FWE", `
        <div class="field"><label>Cognome</label><input type="text" name="name" value="${esc(f.name)}" required></div>
        <div class="field"><label>Wave</label><select name="wave">
          ${[1,2,3,4,5,6].map(w => `<option value="${w}" ${(f.wave || 1) === w ? "selected" : ""}>Wave ${w}</option>`).join("")}</select></div>
        <div class="row" style="margin-top:14px"><button type="button" class="danger small" id="dlg-del">Rimuovi dal percorso</button></div>`,
        async (fd) => {
          await db.from("fwe").update({ name: fd.get("name").trim(), wave: parseInt(fd.get("wave"), 10) }).eq("id", f.id);
          await refresh();
        },
        (form) => {
          form.querySelector("#dlg-del").onclick = async () => {
            const n = events.filter(e => e.fwe_id === f.id && e.level === 2).length;
            if (!confirm(`Rimuovere ${f.name}?${n ? `\n${n} validazioni firmate verranno eliminate con lui.` : ""}`)) return;
            await db.from("fwe").delete().eq("id", f.id);
            await log(`ha rimosso l'FWE ${f.name}`);
            $("#dlg").close();
            await refresh();
          };
        });
    };
  });

  main.querySelectorAll("[data-tseg]").forEach(b => b.onclick = () => { teamSeg = b.dataset.tseg; render(); });
}

// ── Storico ─────────────────────────────────────────────────
function renderLog(main) {
  const rows = logRows.map(r => `
    <div class="log-item"><strong>${esc(r.actor)}</strong> ${esc(r.action)}
      <div class="sub">${fmtTs(r.created_at)}</div></div>`).join("");
  main.innerHTML = `<div class="card">${rows || `<div class="empty">Ancora nessuna attività.</div>`}</div>`;
}

// ── Dialog generico ─────────────────────────────────────────
function openDialog(title, fieldsHtml, onSubmit, onOpen) {
  const dlg = $("#dlg"), form = $("#dlg-form");
  form.innerHTML = `<h3>${title}</h3>${fieldsHtml}
    <div class="dialog-actions">
      <button type="button" class="ghost" id="dlg-cancel">Annulla</button>
      <button type="submit">Salva</button>
    </div>`;
  form.onsubmit = async (e) => {
    e.preventDefault();
    await onSubmit(new FormData(form));
    dlg.close();
  };
  form.querySelector("#dlg-cancel").onclick = () => dlg.close();
  if (onOpen) onOpen(form);
  dlg.showModal();
}

if (session) { await start(); } else { show("login"); }
