<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Store Tasks</title>
<style>
  :root {
    --bg: #f4f5f9;
    --card: #ffffff;
    --text: #14172b;
    --muted: #6b7085;
    --line: #e3e5ee;
    --accent: #3b5bfd;
    --accent-soft: #e8ecff;
    --ok: #1fa36b;
    --ok-soft: #e2f6ec;
    --warn: #c77b12;
    --warn-soft: #fcefdc;
    --danger: #d33f49;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1220;
      --card: #191d31;
      --text: #eceef7;
      --muted: #9aa0b8;
      --line: #2a2f4a;
      --accent: #7d92ff;
      --accent-soft: #232a4d;
      --ok: #3ecf8e;
      --ok-soft: #163a2c;
      --warn: #e8a13c;
      --warn-soft: #3d2f14;
      --danger: #ff6b74;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100dvh;
    padding-bottom: calc(70px + env(safe-area-inset-bottom));
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: calc(12px + env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 1.15rem; }
  #whoami-chip {
    font-size: .85rem; color: var(--accent); background: var(--accent-soft);
    border: none; border-radius: 999px; padding: 6px 12px; font-weight: 600;
  }
  main { padding: 14px 14px 20px; max-width: 640px; margin: 0 auto; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
  }
  .card h3 { font-size: 1rem; margin-bottom: 2px; }
  .sub { color: var(--muted); font-size: .82rem; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .spread { justify-content: space-between; }
  .field { margin-top: 10px; }
  .field label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
  select, input[type=text], input[type=date], input[type=password] {
    width: 100%; padding: 11px 12px; font-size: 1rem;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--text);
    -webkit-appearance: none; appearance: none;
  }
  button {
    font-family: inherit; font-size: .95rem; font-weight: 600;
    border: none; border-radius: 10px; padding: 11px 16px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.ghost { background: var(--accent-soft); color: var(--accent); }
  button.small { padding: 7px 12px; font-size: .85rem; }
  button.danger { background: transparent; color: var(--danger); padding: 7px 8px; }
  button:disabled { opacity: .5; }
  .toggle {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 999px; font-size: .85rem; font-weight: 600;
    background: var(--warn-soft); color: var(--warn); cursor: pointer; border: none;
  }
  .toggle.on { background: var(--ok-soft); color: var(--ok); }
  .badge {
    font-size: .75rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    background: var(--warn-soft); color: var(--warn);
  }
  .badge.done { background: var(--ok-soft); color: var(--ok); }
  .topic {
    font-size: .72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px;
    display: inline-block;
  }
  .topic.Business { background: rgba(59,130,246,.16); color: #3b82f6; }
  .topic.Support  { background: rgba(245,158,11,.16); color: #d97706; }
  .topic.Product  { background: rgba(16,185,129,.16); color: #0d9668; }
  .topic.Creative { background: rgba(168,85,247,.16); color: #a855f7; }
  .topic.Fun      { background: rgba(236,72,153,.16); color: #ec4899; }
  @media (prefers-color-scheme: dark) {
    .topic.Business { color: #7ab1ff; }
    .topic.Support  { color: #fbbf24; }
    .topic.Product  { color: #34d399; }
  }
  .date-head {
    margin: 16px 2px 8px; font-size: .82rem; font-weight: 700;
    color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
  }
  .date-head.today { color: var(--accent); }
  .mini {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 11px 14px; margin-bottom: 8px;
  }
  .mini .sub { flex: 1; }
  details.past { margin-top: 18px; }
  details.past summary {
    cursor: pointer; color: var(--muted); font-size: .85rem; font-weight: 600;
    padding: 8px 2px; list-style: none;
  }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 8px 0 4px; }
  .progress > div { height: 100%; background: var(--ok); border-radius: 3px; transition: width .3s; }
  .checklist { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 6px; }
  .check-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 9px 0;
    border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .check-item:last-child { border-bottom: none; }
  .check-item .box {
    width: 22px; height: 22px; min-width: 22px; border-radius: 7px;
    border: 2px solid var(--muted); margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: .8rem;
  }
  .check-item.done .box { background: var(--ok); border-color: var(--ok); }
  .fwe-summary { cursor: pointer; }
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    display: flex; background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; background: none; color: var(--muted); border-radius: 0;
    padding: 10px 0 8px; font-size: .72rem; display: flex; flex-direction: column;
    align-items: center; gap: 3px;
  }
  nav button.active { color: var(--accent); }
  nav button .ico { font-size: 1.35rem; line-height: 1; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: .9rem; }
  .section-head { display: flex; justify-content: space-between; align-items: center; margin: 6px 2px 12px; }
  .section-head h2 { font-size: 1.05rem; }
  dialog {
    border: none; border-radius: var(--radius); background: var(--card); color: var(--text);
    width: min(92vw, 420px); padding: 18px;
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h3 { margin-bottom: 4px; }
  .dialog-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  #toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(84px + env(safe-area-inset-bottom));
    background: var(--text); color: var(--bg); padding: 10px 18px;
    border-radius: 999px; font-size: .85rem; opacity: 0; transition: opacity .25s;
    pointer-events: none; z-index: 50; max-width: 88vw; text-align: center;
  }
  #toast.show { opacity: 1; }
  .login-wrap {
    min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .login-box { width: min(92vw, 380px); text-align: center; }
  .login-box .logo { font-size: 3rem; margin-bottom: 8px; }
  .login-box h1 { margin-bottom: 4px; }
  .login-box p { color: var(--muted); font-size: .9rem; margin-bottom: 20px; }
  .login-box form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .who-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; max-height: 45dvh; overflow-y: auto; }
  .who-list button { background: var(--card); color: var(--text); border: 1px solid var(--line); text-align: left; }
  .log-item { padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: .85rem; }
  .log-item:last-child { border-bottom: none; }
  .log-item .sub { margin-top: 2px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="view-login" class="login-wrap hidden">
  <div class="login-box">
    <div class="logo">🏬</div>
    <h1>Store Tasks</h1>
    <p>Inserisci la password del team per entrare.</p>
    <form id="login-form">
      <input type="password" id="login-password" placeholder="Password del team" autocomplete="current-password" required>
      <button type="submit" id="login-btn">Entra</button>
    </form>
  </div>
</div>

<div id="view-whoami" class="login-wrap hidden">
  <div class="login-box">
    <div class="logo">👋</div>
    <h1>Chi sei?</h1>
    <p>Scegli il tuo nome: le attività che gestisci verranno registrate a tuo nome.</p>
    <div class="who-list" id="who-list"></div>
  </div>
</div>

<div id="view-app" class="hidden">
  <header>
    <h1 id="tab-title">DD</h1>
    <button id="whoami-chip" title="Cambia utente"></button>
  </header>
  <main id="main"></main>
  <nav>
    <button data-tab="dd" class="active"><span class="ico">📅</span>DD</button>
    <button data-tab="validation"><span class="ico">✅</span>Validation</button>
    <button data-tab="team"><span class="ico">👥</span>Team</button>
    <button data-tab="log"><span class="ico">🕓</span>Storico</button>
  </nav>
</div>

<div id="toast"></div>

<dialog id="dlg">
  <form method="dialog" id="dlg-form"></form>
</dialog>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// ── Configurazione ──────────────────────────────────────────
const SUPABASE_URL = "https://nrxnmucuwucfecnphrtf.supabase.co";
const SUPABASE_KEY = "sb_publishable_OJnekj88Hcc4zCXVo8k9Uw_oSlwAmXm";
const SHARED_EMAIL = "team@store-tasks.app"; // utente condiviso creato in Supabase Auth

const TOPICS = ["Business", "Support", "Product", "Creative", "Fun"];
const MANAGED_TOPIC = "Product"; // solo questi DD vengono gestiti dal team

const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// ── Stato ───────────────────────────────────────────────────
let people = [], downloads = [], competencies = [], fwes = [], validations = [], logRows = [];
let tab = "dd";
let me = JSON.parse(localStorage.getItem("whoami") || "null");
let openFwe = new Set(); // schede FWE espanse

const $ = (s) => document.querySelector(s);
const views = { login: $("#view-login"), whoami: $("#view-whoami"), app: $("#view-app") };
function show(name) {
  Object.entries(views).forEach(([k, el]) => el.classList.toggle("hidden", k !== name));
}
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
}
const esc = (s) => (s ?? "").toString().replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const fmtDate = (d) => d ? new Date(d + "T00:00:00").toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" }) : "—";
const fmtDateShort = (d) => d ? new Date(d + "T00:00:00").toLocaleDateString("it-IT", { day: "numeric", month: "short" }) : "—";
const fmtTs = (ts) => new Date(ts).toLocaleString("it-IT", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const personName = (id) => people.find(p => p.id === id)?.name || "—";
const ddLabel = (d) => d.title || `DD ${d.topic} · ${fmtDateShort(d.date)}`;

// ── Login ───────────────────────────────────────────────────
$("#login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("#login-btn");
  btn.disabled = true; btn.textContent = "Accesso…";
  const { error } = await db.auth.signInWithPassword({
    email: SHARED_EMAIL, password: $("#login-password").value,
  });
  btn.disabled = false; btn.textContent = "Entra";
  if (error) { toast("Password errata"); return; }
  await start();
});

$("#whoami-chip").addEventListener("click", () => {
  if (confirm("Vuoi cambiare nome utente?")) {
    localStorage.removeItem("whoami"); me = null;
    showWhoami();
  }
});

async function start() {
  await loadAll();
  if (!me || !people.find(p => p.id === me.id)) { showWhoami(); return; }
  enterApp();
}

function showWhoami() {
  show("whoami");
  const list = $("#who-list");
  list.innerHTML = "";
  people.filter(p => p.active).forEach(p => {
    const b = document.createElement("button");
    b.textContent = p.name;
    b.onclick = () => { me = { id: p.id, name: p.name }; localStorage.setItem("whoami", JSON.stringify(me)); enterApp(); };
    list.appendChild(b);
  });
}

function enterApp() {
  $("#whoami-chip").textContent = me.name;
  show("app");
  render();
  subscribeRealtime();
}

// ── Dati ────────────────────────────────────────────────────
async function loadAll() {
  const [p, d, c, f, v, l] = await Promise.all([
    db.from("people").select("*").order("name"),
    db.from("downloads").select("*").order("date"),
    db.from("competencies").select("*").order("position"),
    db.from("fwe").select("*").order("name"),
    db.from("fwe_validations").select("*"),
    db.from("activity_log").select("*").order("id", { ascending: false }).limit(80),
  ]);
  people = p.data || []; downloads = d.data || []; competencies = c.data || [];
  fwes = f.data || []; validations = v.data || []; logRows = l.data || [];
}

async function log(action) {
  await db.from("activity_log").insert({ actor: me?.name || "?", action });
}

let rtChannel = null, reloadTimer = null;
function subscribeRealtime() {
  if (rtChannel) return;
  rtChannel = db.channel("db-changes")
    .on("postgres_changes", { event: "*", schema: "public" }, () => {
      clearTimeout(reloadTimer);
      reloadTimer = setTimeout(async () => { await loadAll(); render(); }, 400);
    })
    .subscribe();
}
document.addEventListener("visibilitychange", async () => {
  if (!document.hidden && !views.app.classList.contains("hidden")) { await loadAll(); render(); }
});

async function refresh() { await loadAll(); render(); }

// ── Navigazione ─────────────────────────────────────────────
document.querySelectorAll("nav button").forEach(b => {
  b.addEventListener("click", () => {
    tab = b.dataset.tab;
    document.querySelectorAll("nav button").forEach(x => x.classList.toggle("active", x === b));
    render();
  });
});

const TITLES = { dd: "Daily Download", validation: "Validation", team: "Team", log: "Storico" };

function render() {
  $("#tab-title").textContent = TITLES[tab];
  const main = $("#main");
  if (tab === "dd") renderDD(main);
  else if (tab === "validation") renderValidation(main);
  else if (tab === "team") renderTeam(main);
  else renderLog(main);
}

// ── DD (Daily Download) ─────────────────────────────────────
function personSelect(selected, cls, id) {
  const opts = people.filter(p => p.active || p.id === selected)
    .map(p => `<option value="${p.id}" ${p.id === selected ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  return `<select class="${cls}" data-id="${id}">
    <option value="">— nessuno —</option>${opts}</select>`;
}

function ddCard(d) {
  const managed = d.topic === MANAGED_TOPIC;
  if (!managed) {
    return `<div class="mini">
      <span class="topic ${esc(d.topic)}">${esc(d.topic)}</span>
      <span class="sub">${d.title ? esc(d.title) : "gestito da altri"}</span>
      <button class="danger small" data-act="del-dd" data-id="${d.id}">✕</button>
    </div>`;
  }
  const done = d.uploaded && d.presented;
  return `<div class="card" data-id="${d.id}">
    <div class="row spread">
      <div class="row" style="gap:8px">
        <span class="topic ${esc(d.topic)}">${esc(d.topic)}</span>
        ${d.title ? `<h3>${esc(d.title)}</h3>` : ""}
      </div>
      <span class="badge ${done ? "done" : ""}">${done ? "Completato" : "In corso"}</span>
    </div>
    <div class="field"><label>Chi lo prepara</label>${personSelect(d.preparer_id, "sel-preparer", d.id)}</div>
    <div class="field"><label>Chi lo presenta</label>${personSelect(d.presenter_id, "sel-presenter", d.id)}</div>
    <div class="row" style="margin-top:12px">
      <button class="toggle ${d.uploaded ? "on" : ""}" data-act="uploaded" data-id="${d.id}">
        ${d.uploaded ? "✓ Caricato" : "Da caricare"}</button>
      <button class="toggle ${d.presented ? "on" : ""}" data-act="presented" data-id="${d.id}">
        ${d.presented ? "✓ Presentato" : "Da presentare"}</button>
      <span style="flex:1"></span>
      <button class="danger small" data-act="del-dd" data-id="${d.id}">Elimina</button>
    </div>
  </div>`;
}

function renderDD(main) {
  const today = todayStr();
  const upcoming = downloads.filter(d => d.date >= today);
  const past = downloads.filter(d => d.date < today).reverse();

  // raggruppa per data
  const groups = [];
  for (const d of upcoming) {
    const g = groups[groups.length - 1];
    if (g && g.date === d.date) g.items.push(d);
    else groups.push({ date: d.date, items: [d] });
  }
  const calendar = groups.map(g => `
    <div class="date-head ${g.date === today ? "today" : ""}">
      ${g.date === today ? "Oggi · " : ""}${fmtDate(g.date)}</div>
    ${g.items.map(ddCard).join("")}`).join("");

  const pastHtml = past.length ? `
    <details class="past"><summary>Giorni passati (${past.length}) ▾</summary>
      ${past.map(d => `
        <div class="mini">
          <span class="topic ${esc(d.topic)}">${esc(d.topic)}</span>
          <span class="sub">${fmtDateShort(d.date)}${d.title ? " · " + esc(d.title) : ""}</span>
          ${d.topic === MANAGED_TOPIC ? `<span class="badge ${d.uploaded && d.presented ? "done" : ""}">
            ${d.uploaded && d.presented ? "✓" : "✗"}</span>` : ""}
        </div>`).join("")}
    </details>` : "";

  main.innerHTML = `
    <div class="section-head"><h2>Calendario</h2>
      <button class="small" id="add-dd">+ Nuovo DD</button></div>
    ${calendar || `<div class="empty">Nessun DD in calendario.<br>Aggiungine uno con “+ Nuovo DD”.</div>`}
    ${pastHtml}`;

  $("#add-dd").onclick = () => openDialog("Nuovo DD", `
      <div class="field"><label>Data</label><input type="date" name="date" value="${today}" required></div>
      <div class="field"><label>Argomento</label>
        <select name="topic">${TOPICS.map(t => `<option ${t === MANAGED_TOPIC ? "selected" : ""}>${t}</option>`).join("")}</select></div>
      <div class="field"><label>Titolo (facoltativo)</label><input type="text" name="title" placeholder="es. Novità iPhone"></div>`,
    async (fd) => {
      const title = fd.get("title").trim() || null;
      const { error } = await db.from("downloads").insert({ date: fd.get("date"), topic: fd.get("topic"), title });
      if (error) { toast("Errore nel salvataggio"); return; }
      await log(`ha creato il DD ${fd.get("topic")} del ${fmtDateShort(fd.get("date"))}${title ? ` “${title}”` : ""}`);
      await refresh();
    });

  main.querySelectorAll(".sel-preparer, .sel-presenter").forEach(sel => {
    sel.onchange = async () => {
      const field = sel.classList.contains("sel-preparer") ? "preparer_id" : "presenter_id";
      const d = downloads.find(x => x.id === sel.dataset.id);
      const val = sel.value || null;
      await db.from("downloads").update({ [field]: val, updated_at: new Date().toISOString() }).eq("id", d.id);
      await log(`ha assegnato ${field === "preparer_id" ? "la preparazione" : "la presentazione"} di “${ddLabel(d)}” a ${val ? personName(val) : "nessuno"}`);
      await refresh();
    };
  });
  main.querySelectorAll("[data-act=uploaded],[data-act=presented]").forEach(b => {
    b.onclick = async () => {
      const d = downloads.find(x => x.id === b.dataset.id);
      const field = b.dataset.act;
      const val = !d[field];
      await db.from("downloads").update({ [field]: val, updated_at: new Date().toISOString() }).eq("id", d.id);
      await log(`ha segnato “${ddLabel(d)}” come ${field === "uploaded" ? (val ? "caricato" : "da caricare") : (val ? "presentato" : "da presentare")}`);
      await refresh();
    };
  });
  main.querySelectorAll("[data-act=del-dd]").forEach(b => {
    b.onclick = async () => {
      const d = downloads.find(x => x.id === b.dataset.id);
      if (!confirm(`Eliminare “${ddLabel(d)}”?`)) return;
      await db.from("downloads").delete().eq("id", d.id);
      await log(`ha eliminato il DD “${ddLabel(d)}”`);
      await refresh();
    };
  });
}

// ── Validation (FWE) ────────────────────────────────────────
function renderValidation(main) {
  const activeComps = competencies.filter(c => c.active);
  const cards = fwes.map(f => {
    const mine = validations.filter(v => v.fwe_id === f.id);
    const doneIds = new Set(mine.map(v => v.competency_id));
    const total = activeComps.length;
    const done = activeComps.filter(c => doneIds.has(c.id)).length;
    const complete = total > 0 && done === total;
    const expanded = openFwe.has(f.id);
    const items = !expanded ? "" : activeComps.map(c => {
      const v = mine.find(x => x.competency_id === c.id);
      return `<div class="check-item ${v ? "done" : ""}" data-fwe="${f.id}" data-comp="${c.id}">
        <div class="box">${v ? "✓" : ""}</div>
        <div><div>${esc(c.label)}</div>
          ${v ? `<div class="sub">validata da ${esc(personName(v.validated_by))} · ${fmtTs(v.validated_at)}</div>` : ""}
        </div></div>`;
    }).join("");
    return `<div class="card">
      <div class="row spread fwe-summary" data-fwe-toggle="${f.id}">
        <div><h3>${esc(f.name)}</h3>
          <div class="sub">${f.start_date ? "dal " + fmtDateShort(f.start_date) : "tocca per la checklist"}</div></div>
        <span class="badge ${complete ? "done" : ""}">${done}/${total}</span>
      </div>
      <div class="progress"><div style="width:${total ? (done/total*100) : 0}%"></div></div>
      ${expanded ? `<div class="checklist">${items}</div>
      <div class="row" style="justify-content:flex-end; margin-top:8px">
        <button class="danger small" data-act="del-fwe" data-id="${f.id}">Rimuovi</button>
      </div>` : ""}
    </div>`;
  }).join("");

  const doneCount = fwes.filter(f => {
    const ids = new Set(validations.filter(v => v.fwe_id === f.id).map(v => v.competency_id));
    const comps = competencies.filter(c => c.active);
    return comps.length > 0 && comps.every(c => ids.has(c.id));
  }).length;

  main.innerHTML = `
    <div class="section-head">
      <h2>FWE <span class="sub">${doneCount}/${fwes.length} completi</span></h2>
      <button class="small" id="add-fwe">+ Nuovo</button></div>
    ${cards || `<div class="empty">Nessun FWE in corso.</div>`}`;

  $("#add-fwe").onclick = () => openDialog("Nuovo FWE", `
      <div class="field"><label>Cognome</label><input type="text" name="name" required></div>
      <div class="field"><label>Data di inizio (facoltativa)</label><input type="date" name="start_date"></div>`,
    async (fd) => {
      const { error } = await db.from("fwe").insert({ name: fd.get("name").trim(), start_date: fd.get("start_date") || null });
      if (error) { toast("Errore nel salvataggio"); return; }
      await log(`ha aggiunto l'FWE “${fd.get("name").trim()}”`);
      await refresh();
    });

  main.querySelectorAll("[data-fwe-toggle]").forEach(el => {
    el.onclick = () => {
      const id = el.dataset.fweToggle;
      openFwe.has(id) ? openFwe.delete(id) : openFwe.add(id);
      render();
    };
  });
  main.querySelectorAll(".check-item").forEach(it => {
    it.onclick = async () => {
      const fweId = it.dataset.fwe, compId = it.dataset.comp;
      const f = fwes.find(x => x.id === fweId);
      const c = competencies.find(x => x.id === compId);
      const existing = validations.find(v => v.fwe_id === fweId && v.competency_id === compId);
      if (existing) {
        if (!confirm(`Annullare la validazione di “${c.label}” per ${f.name}?`)) return;
        await db.from("fwe_validations").delete().eq("id", existing.id);
        await log(`ha annullato la validazione di “${c.label}” per ${f.name}`);
      } else {
        await db.from("fwe_validations").insert({ fwe_id: fweId, competency_id: compId, validated_by: me.id });
        await log(`ha validato “${c.label}” per ${f.name}`);
      }
      await refresh();
    };
  });
  main.querySelectorAll("[data-act=del-fwe]").forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation();
      const f = fwes.find(x => x.id === b.dataset.id);
      if (!confirm(`Rimuovere ${f.name} e le sue validazioni?`)) return;
      await db.from("fwe").delete().eq("id", f.id);
      await log(`ha rimosso l'FWE “${f.name}”`);
      await refresh();
    };
  });
}

// ── Team ────────────────────────────────────────────────────
function renderTeam(main) {
  const rowsPeople = people.map(p => `
    <div class="row spread" style="padding:8px 0; border-bottom:1px solid var(--line)">
      <div>${esc(p.name)} ${p.active ? "" : `<span class="sub">(disattivato)</span>`}</div>
      <button class="ghost small" data-act="toggle-person" data-id="${p.id}">
        ${p.active ? "Disattiva" : "Riattiva"}</button>
    </div>`).join("");
  const rowsComps = competencies.map(c => `
    <div class="row spread" style="padding:8px 0; border-bottom:1px solid var(--line)">
      <div>${esc(c.label)} ${c.active ? "" : `<span class="sub">(disattivata)</span>`}</div>
      <button class="ghost small" data-act="toggle-comp" data-id="${c.id}">
        ${c.active ? "Disattiva" : "Riattiva"}</button>
    </div>`).join("");
  main.innerHTML = `
    <div class="section-head"><h2>Persone</h2>
      <button class="small" id="add-person">+ Aggiungi</button></div>
    <div class="card">${rowsPeople || `<div class="empty">Nessuno ancora.</div>`}</div>
    <div class="section-head"><h2>Competenze da validare</h2>
      <button class="small" id="add-comp">+ Aggiungi</button></div>
    <div class="card">${rowsComps || `<div class="empty">Nessuna competenza.</div>`}</div>`;

  $("#add-person").onclick = () => openDialog("Nuova persona", `
      <div class="field"><label>Cognome</label><input type="text" name="name" required></div>`,
    async (fd) => {
      const { error } = await db.from("people").insert({ name: fd.get("name").trim() });
      if (error) { toast("Nome già esistente?"); return; }
      await log(`ha aggiunto ${fd.get("name").trim()} al team`);
      await refresh();
    });
  $("#add-comp").onclick = () => openDialog("Nuova competenza", `
      <div class="field"><label>Descrizione</label><input type="text" name="label" required></div>`,
    async (fd) => {
      const pos = Math.max(0, ...competencies.map(c => c.position)) + 1;
      const { error } = await db.from("competencies").insert({ label: fd.get("label").trim(), position: pos });
      if (error) { toast("Errore nel salvataggio"); return; }
      await log(`ha aggiunto la competenza “${fd.get("label").trim()}”`);
      await refresh();
    });
  main.querySelectorAll("[data-act=toggle-person]").forEach(b => {
    b.onclick = async () => {
      const p = people.find(x => x.id === b.dataset.id);
      await db.from("people").update({ active: !p.active }).eq("id", p.id);
      await log(`${p.active ? "ha disattivato" : "ha riattivato"} ${p.name}`);
      await refresh();
    };
  });
  main.querySelectorAll("[data-act=toggle-comp]").forEach(b => {
    b.onclick = async () => {
      const c = competencies.find(x => x.id === b.dataset.id);
      await db.from("competencies").update({ active: !c.active }).eq("id", c.id);
      await log(`${c.active ? "ha disattivato" : "ha riattivato"} la competenza “${c.label}”`);
      await refresh();
    };
  });
}

// ── Storico ─────────────────────────────────────────────────
function renderLog(main) {
  const rows = logRows.map(r => `
    <div class="log-item"><strong>${esc(r.actor)}</strong> ${esc(r.action)}
      <div class="sub">${fmtTs(r.created_at)}</div></div>`).join("");
  main.innerHTML = `<div class="card">${rows || `<div class="empty">Ancora nessuna attività.</div>`}</div>`;
}

// ── Dialog generico ─────────────────────────────────────────
function openDialog(title, fieldsHtml, onSubmit) {
  const dlg = $("#dlg"), form = $("#dlg-form");
  form.innerHTML = `<h3>${title}</h3>${fieldsHtml}
    <div class="dialog-actions">
      <button type="button" class="ghost" id="dlg-cancel">Annulla</button>
      <button type="submit">Salva</button>
    </div>`;
  form.onsubmit = async (e) => {
    e.preventDefault();
    await onSubmit(new FormData(form));
    dlg.close();
  };
  form.querySelector("#dlg-cancel").onclick = () => dlg.close();
  dlg.showModal();
}

// ── Avvio ───────────────────────────────────────────────────
const { data: { session } } = await db.auth.getSession();
if (session) { await start(); } else { show("login"); }
</script>
