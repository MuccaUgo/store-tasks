<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Store Tasks</title>
<style>
  :root {
    --bg: #f2f3f8;
    --card: #ffffff;
    --glass: rgba(255, 255, 255, .58);
    --glass-line: rgba(255, 255, 255, .75);
    --text: #14172b;
    --muted: #6b7085;
    --line: #e3e5ee;
    --accent: #3b5bfd;
    --accent-soft: #e8ecff;
    --ok: #1fa36b;
    --ok-soft: #e2f6ec;
    --warn: #c77b12;
    --warn-soft: #fcefdc;
    --danger: #d33f49;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(20, 23, 43, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1220;
      --card: #191d31;
      --glass: rgba(25, 29, 49, .55);
      --glass-line: rgba(255, 255, 255, .10);
      --text: #eceef7;
      --muted: #9aa0b8;
      --line: #2a2f4a;
      --accent: #7d92ff;
      --accent-soft: #232a4d;
      --ok: #3ecf8e;
      --ok-soft: #163a2c;
      --warn: #e8a13c;
      --warn-soft: #3d2f14;
      --danger: #ff6b74;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100dvh;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--glass);
    -webkit-backdrop-filter: blur(22px) saturate(1.8);
    backdrop-filter: blur(22px) saturate(1.8);
    padding: calc(12px + env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--glass-line);
  }
  header h1 { font-size: 1.15rem; letter-spacing: -.01em; }
  #whoami-chip {
    font-size: .85rem; color: var(--accent); background: var(--accent-soft);
    border: none; border-radius: 999px; padding: 6px 12px; font-weight: 600;
  }
  main { padding: 14px 14px 20px; max-width: 640px; margin: 0 auto; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(20, 23, 43, .04);
  }
  .card h3 { font-size: 1.02rem; margin-bottom: 2px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: .82rem; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .spread { justify-content: space-between; }
  .field { margin-top: 10px; }
  .field label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
  select, textarea,
  input[type=text], input[type=date], input[type=password],
  input[type=number], input[type=time] {
    width: 100%; padding: 11px 12px; font-size: 1rem;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg); color: var(--text);
    -webkit-appearance: none; appearance: none;
    font-family: inherit;
  }
  textarea { resize: vertical; line-height: 1.4; }
  button {
    font-family: inherit; font-size: .95rem; font-weight: 600;
    border: none; border-radius: 12px; padding: 11px 16px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.ghost { background: var(--accent-soft); color: var(--accent); }
  button.small { padding: 7px 12px; font-size: .85rem; }
  button.danger { background: transparent; color: var(--danger); padding: 7px 8px; }
  button:disabled { opacity: .5; }
  .toggle {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 999px; font-size: .85rem; font-weight: 600;
    background: var(--warn-soft); color: var(--warn); cursor: pointer; border: none;
  }
  .toggle.on { background: var(--ok-soft); color: var(--ok); }
  .badge {
    font-size: .75rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    background: var(--warn-soft); color: var(--warn);
  }
  .badge.done { background: var(--ok-soft); color: var(--ok); }
  .dd-summary { cursor: pointer; }
  .role-tag {
    font-size: .7rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .04em; cursor: pointer; border: none;
    background: var(--accent-soft); color: var(--accent);
  }
  .role-tag.pro { background: rgba(168, 85, 247, .16); color: #8b3fd4; }
  .aud-tag {
    font-size: .68rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
    background: rgba(16, 185, 129, .16); color: #0d9668;
    border: none; cursor: pointer;
  }
  .aud-tag.pz { background: rgba(245, 158, 11, .18); color: #b8730a; }
  @media (prefers-color-scheme: dark) {
    .role-tag.pro { color: #c78dff; }
    .aud-tag { color: #34d399; }
    .aud-tag.pz { color: #fbbf24; }
  }
  .manager-line {
    margin-top: 10px; font-size: .85rem; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .date-head {
    margin: 18px 4px 8px; font-size: .82rem; font-weight: 700;
    color: var(--muted); text-transform: uppercase; letter-spacing: .05em;

  .date-head.today { color: var(--accent); }
  .mini {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 11px 14px; margin-bottom: 8px;

  details.past { margin-top: 18px; }
  details.past summary {
    cursor: pointer; color: var(--muted); font-size: .85rem; font-weight: 600;
    padding: 8px 2px; list-style: none;
  }
  nav {
    position: fixed; z-index: 10;
    left: max(12px, env(safe-area-inset-left));
    right: max(12px, env(safe-area-inset-right));

    background: var(--glass);

    backdrop-filter: blur(24px) saturate(1.8);

  nav .emo { font-size: 1.15rem; line-height: 1; }
  nav button.active { color: var(--accent); }

  .empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: .9rem; }
  .empty-big { text-align: center; color: var(--muted); padding: 90px 24px 30px; }

  .section-head h2 { font-size: 1.05rem; letter-spacing: -.01em; }
  dialog {

  #toast {

  .login-wrap {

  .login-box { width: min(92vw, 380px); text-align: center; }
  .login-box .logo { font-size: 3rem; margin-bottom: 8px; }
  .login-box h1 { margin-bottom: 4px; }
  .login-box p { color: var(--muted); font-size: .9rem; margin-bottom: 20px; }
  .login-box form { display: flex; flex-direction: column; gap: 12px; text-align: left; }

  .log-item .sub { margin-top: 2px; }

  .seg {
    display: flex; gap: 4px; padding: 4px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 13px; margin-bottom: 14px;

  .fchip {
    border: 1px solid var(--line); background: var(--card); color: var(--muted);

  .fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .wave-head {

  .wave-head:first-child { margin-top: 2px; }
  .wave-head .wn { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
  .wave-head .wm { font-size: .78rem; color: var(--muted); }
  .dots { display: flex; gap: 5px; }
  .dot { width: 22px; height: 7px; border-radius: 999px; background: var(--line); }
  .dot.s1 { background: var(--warn); }
  .dot.s2 { background: var(--ok); }
  .dot.na { background: transparent; border: 1px dashed var(--muted); }
  .area-head {
    display: flex; align-items: center; gap: 10px; margin: 16px 4px 7px;

  .area-head .ac { margin-left: auto; font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .comp-row {
    width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer;

  .comp-row.sub { margin-left: 14px; }
  .mark {
    width: 25px; height: 25px; min-width: 25px; border-radius: 8px; display: grid; place-items: center;
    font-size: .8rem; font-weight: 700; background: var(--line); color: var(--muted);
  }
  .mark.s1 { background: var(--warn-soft); color: var(--warn); }
  .mark.s2 { background: var(--ok); color: #fff; }
  .mark.na { background: transparent; border: 1px dashed var(--muted); }
  .comp-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

  .comp-state { font-size: .78rem; color: var(--muted); }
  .comp-note { font-size: .78rem; color: var(--muted); font-style: italic; }
  .backlink {

    padding: 2px 0 12px; cursor: pointer; font-family: inherit;

  .hist { margin-top: 18px; }
  .hist-i { display: flex; gap: 9px; padding: 8px 2px; font-size: .84rem; color: var(--muted); }
  .hist-i b { color: var(--text); font-weight: 600; }
  .hist-dot { width: 8px; height: 8px; border-radius: 99px; margin-top: 7px; flex: none; }
  .att-row {
    display: flex; align-items: center; gap: 12px; padding: 11px 14px;
    border-bottom: 1px solid var(--line);
  }
  .att-row:last-child { border-bottom: none; }
  .att-name { flex: 0 0 40%; font-size: .9rem; font-weight: 600; }
  .att-name em { display: block; font-style: normal; font-size: .72rem; color: var(--muted); font-weight: 400; }
  .att-bar { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; display: flex; }
  .att-bar i { display: block; height: 100%; }
  .att-bar i.v { background: var(--ok); }
  .att-bar i.o { background: var(--warn); }
  .att-num { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; min-width: 46px; text-align: right; }
  .att-flag { font-size: .7rem; font-weight: 700; color: var(--danger); flex: none; }
  .t-row {
    display: flex; align-items: center; gap: 10px; padding: 11px 13px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px;
  }
  .t-row.tap { cursor: pointer; }
  .t-txt { flex: 1; min-width: 0; }
  .t-name { font-size: .96rem; font-weight: 600; display: block; }
  .t-meta { font-size: .75rem; color: var(--muted); display: block; }

const esc = (s) => (s ?? "").toString().replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const todayStr = () => {
  const d = new Date();

};
const fmtDate = (d) => d ? new Date(d + "T00:00:00").toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" }) : "—";
const fmtDateShort = (d) => d ? new Date(d + "T00:00:00").toLocaleDateString("it-IT", { day: "numeric", month: "short" }) : "—";
const fmtTs = (ts) => new Date(ts).toLocaleString("it-IT", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

const icsEsc = (s) => (s ?? "").toString()
  .replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
const icsStamp = () => new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");

// Evento .ics per aggiungere il DD al proprio calendario (promemoria ore 9:00)
function ddToICS(d) {
  const day = d.date.replace(/-/g, "");
  const next = new Date(d.date + "T00:00:00");
  next.setDate(next.getDate() + 1);
  const dayEnd = `${next.getFullYear()}${String(next.getMonth()+1).padStart(2,"0")}${String(next.getDate()).padStart(2,"0")}`;
  const details = [
    hasAudience ? `Destinatari: ${audienceLabel(d.audience)}` : null,
    d.preparer_id ? `Prepara: ${personName(d.preparer_id)}` : null,
    d.presenter_id ? `Facilita: ${personName(d.presenter_id)}` : null,
    d.manager ? `Manager presente: ${d.manager}` : null,
    d.notes ? `Note: ${d.notes}` : null,
  ].filter(Boolean).join("\n");
  return [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Store Tasks//IT",
    "BEGIN:VEVENT",
    `UID:dd-${d.id}@store-tasks`,
    `DTSTAMP:${icsStamp()}`,
    `DTSTART;VALUE=DATE:${day}`,
    `DTEND;VALUE=DATE:${dayEnd}`,
    `SUMMARY:${icsEsc("DD: " + ddLabel(d))}`,
    details ? `DESCRIPTION:${icsEsc(details)}` : null,
    "BEGIN:VALARM",
    "ACTION:DISPLAY",
    `DESCRIPTION:${icsEsc("Tra 5 giorni DD: " + ddLabel(d))}`,
    "TRIGGER;RELATED=START:-P4DT15H",
    "END:VALARM",
    "END:VEVENT",
    "END:VCALENDAR",
  ].filter(Boolean).join("\r\n");
}

function saveICS(text, filename) {
  const blob = new Blob([text], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  toast("Evento creato: aprilo per salvarlo in Calendario");
}

async function detectSchema() {
  const [a, v, p, f] = await Promise.all([
    db.from("downloads").select("audience").limit(1),
    db.from("fwe_events").select("id").limit(1),
    db.from("projects").select("id").limit(1),
    db.from("focus").select("id").limit(1),
  ]);
  hasAudience = !a.error;
  hasValidation = !v.error;
  hasProjects = !p.error;
  hasFocus = !f.error;
}

async function loadAll() {
  const q = [
    ["people", db.from("people").select("*").order("name")],
    ["downloads", db.from("downloads").select("*").order("date")],
    ["log", db.from("activity_log").select("*").order("id", { ascending: false }).limit(80)],
  ];
  if (hasValidation) q.push(
    ["comps", db.from("competencies").select("*").order("position")],
    ["fwe", db.from("fwe").select("*").order("name")],
    ["events", db.from("fwe_events").select("*").order("id")],
  );
  if (hasProjects) q.push(
    ["projects", db.from("projects").select("*").eq("status", "active").order("position")],
    ["slots", db.from("project_slots").select("*").order("date").order("start_time")],
    ["crew", db.from("slot_people").select("*").order("position")],
    ["items", db.from("project_items").select("*").order("position")],
    ["debriefs", db.from("debriefs").select("*").order("id")],
    ["insights", db.from("insights").select("*").order("id")],
    ["replies", db.from("insight_replies").select("*").order("id")],
  );
  if (hasFocus) q.push(
    ["focus", db.from("focus").select("*").order("created_at")],
    ["fupd", db.from("focus_updates").select("*").order("created_at")],
    ["ideas", db.from("ideas").select("*").order("created_at", { ascending: false })],
  );
  const res = await Promise.all(q.map(x => x[1]));
  const d = {};
  q.forEach((x, i) => d[x[0]] = res[i].data || []);

  people = d.people; downloads = d.downloads; logRows = d.log;
  if (hasValidation) {
    comps = d.comps; fweList = d.fwe; events = d.events;
    buildState();
  }
  if (hasProjects) {
    projects = d.projects; slots = d.slots; slotPeople = d.crew; projItems = d.items;
    debriefs = d.debriefs; insights = d.insights; replies = d.replies;
  }
  if (hasFocus) {
    focusList = d.focus; focusUpd = d.fupd; ideaList = d.ideas;
  }
}

// Lo stato di una competenza è il suo ultimo evento; un livello 1 che segue
// un livello 2 è un passo indietro, non un'osservazione.
function buildState() {
  stateMap = {}; pairHist = {};
  events.forEach(e => {
    const k = e.fwe_id + "|" + e.competency_id;
    const arr = pairHist[k] || (pairHist[k] = []);
    const prev = arr[arr.length - 1];
    e.isRevert = e.level === 1 && prev && prev.level === 2;
    arr.push(e);
    stateMap[k] = e;
  });
}

const areaList = () => comps.filter(c => !c.parent_id && c.active).sort((a, b) => a.position - b.position);
const kidsOf = (a) => comps.filter(c => c.parent_id === a.id && c.active).sort((x, y) => x.position - y.position);
const leavesOf = (a) => { const k = kidsOf(a); return k.length ? k : [a]; };
const allLeaves = () => areaList().flatMap(leavesOf);
const evOf = (fweId, leafId) => stateMap[fweId + "|" + leafId] || null;
const stOf = (fweId, leafId) => { const e = evOf(fweId, leafId); return e ? e.level : 0; };

function areaState(fweId, a) {
  const v = leavesOf(a).map(l => stOf(fweId, l.id)).filter(x => x !== -1);
  if (!v.length) return -1;
  if (v.every(x => x === 2)) return 2;
  if (v.every(x => x === 0)) return 0;
  return 1;
}
const reqAreas = (f) => areaList().filter(a => areaState(f.id, a) !== -1);
const doneAreas = (f) => reqAreas(f).filter(a => areaState(f.id, a) === 2).length;
const totAreas = (f) => reqAreas(f).length;
const isComplete = (f) => totAreas(f) > 0 && doneAreas(f) === totAreas(f);

function lastTouch(f) {
  const mine = events.filter(e => e.fwe_id === f.id);
  return mine.length ? mine[mine.length - 1].created_at : f.created_at;
}
function idleDays(f) {
  return Math.floor((Date.now() - new Date(lastTouch(f)).getTime()) / 86400000);
}
const isStuck = (f) => idleDays(f) > 14 && !isComplete(f);

// I quattro occhi: chi ha osservato non valida mai quella competenza.
function myObservation(fweId, leafId) {
  const h = pairHist[fweId + "|" + leafId] || [];
  return h.find(e => e.level === 1 && !e.isRevert && e.actor_name === me?.name) || null;
}
const canValidate = (fweId, leafId) => !myObservation(fweId, leafId);

async function log(action) {
  await db.from("activity_log").insert({ actor: me?.name || "?", action });
}

let rtChannel = null, reloadTimer = null;
function subscribeRealtime() {
  if (rtChannel) return;
  rtChannel = db.channel("db-changes")
    .on("postgres_changes", { event: "*", schema: "public" }, () => {
      clearTimeout(reloadTimer);
      reloadTimer = setTimeout(async () => { await loadAll(); render(); }, 400);
    })
    .subscribe();
}
document.addEventListener("visibilitychange", async () => {
  if (!document.hidden && !views.app.classList.contains("hidden")) { await loadAll(); render(); }
});

async function refresh() { await loadAll(); render(); }

// Un tab per progetto attivo, tra Validation e Team.
function renderNav() {
  const items = [
    { id: "dd", label: "DD", ico: ICONS.dd },
    { id: "validation", label: "Validation", ico: ICONS.validation },
    ...(hasFocus ? [{ id: "focus", label: "Focus", ico: ICONS.focus }] : []),
    ...projects.map(p => ({ id: "proj:" + p.id, label: p.name, emo: p.icon || "🎯" })),
    { id: "team", label: "Team", ico: ICONS.team },
    { id: "log", label: "Storico", ico: ICONS.log },
  ];
  const nav = $("#nav");
  nav.classList.toggle("many", items.length > 4);
  nav.innerHTML = items.map(it => `<button data-tab="${it.id}" class="${tab === it.id ? "active" : ""}">
      <span class="ico">${it.emo ? `<span class="emo">${esc(it.emo)}</span>` : it.ico}</span>${esc(it.label)}</button>`).join("");
  nav.querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      tab = b.dataset.tab;
      openFweId = null; vEditor = false; openFocusId = null;
      render();
    };
  });
}

function render() {
  let pr = null;
  if (tab.startsWith("proj:")) {
    pr = projectOf(tab.slice(5));
    if (!pr) tab = "dd"; // progetto archiviato o eliminato altrove
  }
  renderNav();
  $("#tab-title").textContent = pr ? (pr.full_name || pr.name) : TITLES[tab];
  const main = $("#main");
  if (pr) renderProject(main, pr);
  else if (tab === "dd") renderDD(main);
  else if (tab === "focus") renderFocus(main);
  else if (tab === "validation") renderValidation(main);
  else if (tab === "team") renderTeam(main);
  else renderLog(main);

  main.querySelectorAll("[data-vseg]").forEach(b => b.onclick = () => {
    vSeg = b.dataset.vseg; openFweId = null; vEditor = false; render();
  });
  main.querySelectorAll("[data-tseg]").forEach(b => b.onclick = () => { teamSeg = b.dataset.tseg; render(); });
  main.querySelectorAll("[data-pseg]").forEach(b => b.onclick = () => { pSeg = b.dataset.pseg; render(); });
  main.querySelectorAll("[data-fseg]").forEach(b => b.onclick = () => { fSeg = b.dataset.fseg; openFocusId = null; render(); });
}

function personSelect(selected, cls, id) {
  const opts = people.filter(p => p.active || p.id === selected)
    .map(p => `<option value="${p.id}" ${p.id === selected ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  return `<select class="${cls}" data-id="${id}">
    <option value="">— nessuno —</option>${opts}</select>`;
}

function ddCard(d) {
  const done = d.uploaded;
  const expanded = openDD.has(d.id);
  const summary = [
    d.preparer_id ? `Prepara: ${personName(d.preparer_id)}` : null,
    d.presenter_id ? `Facilita: ${personName(d.presenter_id)}` : null,
  ].filter(Boolean).join(" · ") || "tocca per i dettagli";
  return `<div class="card" data-id="${d.id}">
    <div class="row spread dd-summary" data-dd-toggle="${d.id}">
      <div>
        <div class="row" style="gap:8px">
          <h3>${esc(ddLabel(d))}</h3>
          ${hasAudience ? `<button class="aud-tag ${d.audience === "pz" ? "pz" : ""}" data-act="toggle-aud" data-id="${d.id}"
            title="Tocca per cambiare destinatari">${audienceLabel(d.audience)}</button>` : ""}
        </div>
        <div class="sub">${esc(summary)}</div>
      </div>
      <span class="badge ${done ? "done" : ""}">${done ? "Caricato" : "Da caricare"}</span>
    </div>
    ${!expanded ? "" : `
    <div class="field"><label>Chi lo prepara</label>${personSelect(d.preparer_id, "sel-preparer", d.id)}</div>
    <div class="field"><label>Chi lo facilita</label>${personSelect(d.presenter_id, "sel-presenter", d.id)}</div>
    ${d.manager ? `<div class="manager-line">👤 Manager presente: <strong>${esc(d.manager)}</strong></div>` : ""}
    ${d.notes ? `<div class="manager-line">📝 ${esc(d.notes)}</div>` : ""}
    <div class="row" style="margin-top:12px">
      <button class="toggle ${d.uploaded ? "on" : ""}" data-act="uploaded" data-id="${d.id}">
        ${d.uploaded ? "✓ Caricato" : "Da caricare"}</button>
      <span style="flex:1"></span>
      <button class="ghost small" data-act="ics" data-id="${d.id}">📅 Calendario</button>
      <button class="ghost small" data-act="edit-dd" data-id="${d.id}">Modifica</button>
    </div>`}
  </div>`;
}

function ddFormFields(d) {
  return `
    <div class="field"><label>Data *</label>
      <input type="date" name="date" value="${d?.date || todayStr()}" required></div>
    <div class="field"><label>Argomento (anche provvisorio) *</label>
      <input type="text" name="title" value="${esc(d?.title || "")}" placeholder="es. Novità del mese" required></div>
    ${!hasAudience ? "" : `
    <div class="field"><label>Destinatari</label>
      <select name="audience">
        <option value="all" ${d?.audience !== "pz" ? "selected" : ""}>All team</option>
        <option value="pz" ${d?.audience === "pz" ? "selected" : ""}>PZ solo</option>
      </select></div>`}
    <div class="field"><label>Chi lo prepara</label>
      <select name="preparer_id"><option value="">— da assegnare —</option>
        ${people.filter(p => p.active || p.id === d?.preparer_id).map(p =>
          `<option value="${p.id}" ${p.id === d?.preparer_id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}
      </select></div>
    <div class="field"><label>Chi lo facilita</label>
      <select name="presenter_id"><option value="">— da assegnare —</option>
        ${people.filter(p => p.active || p.id === d?.presenter_id).map(p =>
          `<option value="${p.id}" ${p.id === d?.presenter_id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}

function renderDD(main) {
  const today = todayStr();
  const upcoming = downloads.filter(d => d.date >= today);
  const past = downloads.filter(d => d.date < today).reverse();

  const groups = [];
  for (const d of upcoming) {
    const g = groups[groups.length - 1];
    if (g && g.date === d.date) g.items.push(d);
    else groups.push({ date: d.date, items: [d] });
  }
  const calendar = groups.map(g => `
    <div class="date-head ${g.date === today ? "today" : ""}">
      ${g.date === today ? "Oggi · " : ""}${fmtDate(g.date)}</div>
    ${g.items.map(ddCard).join("")}`).join("");

  const pastHtml = past.length ? `
    <details class="past"><summary>Giorni passati (${past.length}) ▾</summary>
      ${past.map(d => `
        <div class="mini">
          <span class="badge ${d.uploaded ? "done" : ""}">${d.uploaded ? "✓" : "✗"}</span>
          <span class="sub">${fmtDateShort(d.date)} · ${esc(ddLabel(d))}</span>
          <button class="ghost small" data-act="edit-dd" data-id="${d.id}">Modifica</button>
        </div>`).join("")}
    </details>` : "";

  main.innerHTML = `
    <div class="section-head"><h2>Calendario</h2>
      <button class="small" id="add-dd">+ Nuovo DD</button></div>
    ${calendar || `<div class="empty">Nessun DD in programma.<br>Aggiungine uno con “+ Nuovo DD”.</div>`}
    ${pastHtml}`;

  $("#add-dd").onclick = () => openDialog("Nuovo DD", ddFormFields(null),
    async (fd) => {
      const row = {
        date: fd.get("date"),
        title: fd.get("title").trim(),
        ...(hasAudience ? { audience: fd.get("audience") } : {}),
        preparer_id: fd.get("preparer_id") || null,
        presenter_id: fd.get("presenter_id") || null,
        manager: fd.get("manager").trim() || null,
        notes: fd.get("notes").trim() || null,
      };
      const { error } = await db.from("downloads").insert(row);
      if (error) { toast("Errore nel salvataggio"); return; }
      await log(`ha creato il DD “${row.title}” del ${fmtDateShort(row.date)}${hasAudience ? ` (${audienceLabel(row.audience)})` : ""}`);
      await refresh();
    });

  main.querySelectorAll("[data-act=edit-dd]").forEach(b => {
    b.onclick = () => {
      const d = downloads.find(x => x.id === b.dataset.id);
      openDialog("Modifica DD", ddFormFields(d) + `
        <div class="row" style="margin-top:14px">
          <button type="button" class="danger small" id="dlg-delete">Elimina questo DD</button>
        </div>`,
        async (fd) => {
          const row = {
            date: fd.get("date"),
            title: fd.get("title").trim(),
            ...(hasAudience ? { audience: fd.get("audience") } : {}),
            preparer_id: fd.get("preparer_id") || null,
            presenter_id: fd.get("presenter_id") || null,
            manager: fd.get("manager").trim() || null,
            notes: fd.get("notes").trim() || null,
            updated_at: new Date().toISOString(),
          };
          const { error } = await db.from("downloads").update(row).eq("id", d.id);
          if (error) { toast("Errore nel salvataggio"); return; }
          await log(`ha modificato il DD “${row.title}” del ${fmtDateShort(row.date)}`);
          await refresh();
        },
        (form) => {
          form.querySelector("#dlg-delete").onclick = async () => {
            if (!confirm(`Eliminare “${ddLabel(d)}”?`)) return;

    };
  });

// ── Focus Flow ──────────────────────────────────────────────
// Un focus è una cosa che portiamo avanti nel tempo. Un aggiornamento
// è un punto sulla scia: dove i punti smettono, il focus è fermo.
const WEEK_MS = 604800000;
const updOf = (fid) => focusUpd.filter(u => u.focus_id === fid);
const weeksSince = (iso) => Math.floor((Date.now() - new Date(iso).getTime()) / WEEK_MS);
function silenceOf(f) {
  const u = updOf(f.id);
  return weeksSince(u.length ? u[u.length - 1].created_at : f.created_at);
}
function focusState(f) {
  if (f.status === "concluso") return { k: "con", lab: "concluso" };
  if (f.status === "abbandonato") return { k: "abb", lab: "abbandonato" };
  const s = silenceOf(f);
  if (s >= 5) return { k: "fer", lab: "fermo" };
  if (s >= 2) return { k: "ral", lab: "rallentato" };
  return { k: "att", lab: "attivo" };
}
const FS_ORD = { fer: 0, ral: 1, att: 2, con: 3, abb: 4 };
const FS_COLOR = { att: "var(--accent)", ral: "var(--warn)", fer: "var(--danger)", con: "var(--ok)", abb: "var(--muted)" };
const focusSorted = () => focusList.slice().sort((a, b) =>
  (FS_ORD[focusState(a).k] - FS_ORD[focusState(b).k]) || (silenceOf(b) - silenceOf(a)));

function silenceText(f) {
  if (f.status !== "attivo") return f.status;
  const s = silenceOf(f);
  return s === 0 ? "aggiornato questa settimana"
    : s === 1 ? "1 settimana di silenzio" : `${s} settimane di silenzio`;
}
// dieci settimane: 0 la più vecchia, 9 questa
function stripHtml(f, color) {
  const idx = updOf(f.id).map(u => 9 - weeksSince(u.created_at)).filter(i => i >= 0 && i <= 9);
  const first = idx.length ? Math.min(...idx) : 99;
  const last = idx.length ? Math.max(...idx) : -1;
  let out = "";
  for (let i = 0; i <= 9; i++) {
    const cls = idx.includes(i) ? "on" : i < first ? "pre" : i > last ? "aft" : "";
    out += `<i class="${cls}"></i>`;
  }
  return `<span class="strip" style="--sc:${color}">${out}</span>`;
}

function openFocusForm(f) {

    <div class="field"><label>Risultato desiderato</label>

    <div class="field"><label>Come ci accorgiamo che funziona</label>

    <div class="field"><label>Chi tiene il filo</label>

        <option value="concluso" ${f.status === "concluso" ? "selected" : ""}>Concluso</option>

    async (fd) => {

      if (!name) { toast("Serve un nome"); return; }

        name,

const ST_LABEL = { "-1": "Non richiesta", 0: "Da osservare", 1: "Osservato · da validare", 2: "Validato" };

async function addEvent(fweId, leafId, level, note) {
  const { error } = await db.from("fwe_events").insert({
    fwe_id: fweId, competency_id: leafId, level,
    actor_id: me.id, actor_name: me.name, note: note || null,
  });
  if (error) { toast("Errore nel salvataggio"); return false; }
  return true;
}

function renderValidation(main) {
  if (!hasValidation) {
    main.innerHTML = `
      <div class="empty-big">
        <div class="glyph">🚧</div>
        <h2>Quasi pronto</h2>
        <p>Manca l'ultimo passaggio sul database.<br>Esegui <strong>migration-5.sql</strong> e questa sezione si accende da sola.</p>
      </div>`;
    return;
  }
  if (openFweId) return renderFweDetail(main);
  if (vEditor) return renderCompEditor(main);

  const seg = `
    <div class="seg" role="group" aria-label="Vista">
      <button type="button" data-vseg="persone" aria-pressed="${vSeg === "persone"}">Persone</button>
      <button type="button" data-vseg="competenze" aria-pressed="${vSeg === "competenze"}">Competenze</button>
    </div>`;

  if (vSeg === "competenze") { renderCompetenze(main, seg); return; }

  const nStuck = fweList.filter(isStuck).length;
  const nDone = fweList.filter(isComplete).length;
  const list = fweList.filter(f =>
    vFilter === "fermi" ? isStuck(f) : vFilter === "completi" ? isComplete(f) : true);

  const waves = [...new Set(fweList.map(f => f.wave || 1))].sort((a, b) => a - b);
  const groups = waves.map(w => {
    const g = list.filter(f => (f.wave || 1) === w)
      .sort((a, b) => (isStuck(b) - isStuck(a)) || (doneAreas(b) - doneAreas(a)) || a.name.localeCompare(b.name));
    if (!g.length) return "";
    return `<div class="wave-head"><span class="wn">Wave ${w}</span>
      <span class="wm">${g.length} ${g.length === 1 ? "persona" : "persone"} · ${g.filter(isComplete).length} complete</span></div>` +
      g.map(fweCard).join("");
  }).join("");

  main.innerHTML = seg + `
    <div class="filters" style="display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap">
      <button type="button" class="fchip" data-vf="tutti" aria-pressed="${vFilter === "tutti"}">Tutti · ${fweList.length}</button>
      <button type="button" class="fchip" data-vf="fermi" aria-pressed="${vFilter === "fermi"}">Fermi · ${nStuck}</button>
      <button type="button" class="fchip" data-vf="completi" aria-pressed="${vFilter === "completi"}">Completi · ${nDone}</button>
    </div>
    ${groups || `<div class="empty">Nessun FWE in questa vista.<br>Aggiungili dal tab Team.</div>`}`;

  main.querySelectorAll("[data-vf]").forEach(b => b.onclick = () => { vFilter = b.dataset.vf; render(); });
  main.querySelectorAll("[data-fwe]").forEach(b => b.onclick = () => { openFweId = b.dataset.fwe; render(); });
}

function fweCard(f) {
  const done = doneAreas(f), tot = totAreas(f);
  const pill = isComplete(f) ? `<span class="badge done">Completo</span>`
    : isStuck(f) ? `<span class="badge">Fermo da ${idleDays(f)}g</span>`
    : `<span class="badge">${done}/${tot}</span>`;
  return `<button type="button" class="card" data-fwe="${f.id}"
      style="width:100%;text-align:left;display:flex;flex-direction:column;gap:8px;cursor:pointer;color:var(--text)">
    <div class="row spread" style="width:100%"><h3>${esc(f.name)}</h3>${pill}</div>
    <div class="dots">${areaList().map(a => {
      const s = areaState(f.id, a);
      return `<span class="dot ${s === -1 ? "na" : s ? "s" + s : ""}"></span>`;
    }).join("")}</div>
  </button>`;
}

function renderFweDetail(main) {
  const f = fweList.find(x => x.id === openFweId);
  if (!f) { openFweId = null; return render(); }
  const done = doneAreas(f), tot = totAreas(f);

  let html = `<button type="button" class="backlink" id="v-back">‹ Tutti gli FWE</button>
    <div class="card">
      <div class="row spread"><div><h3>${esc(f.name)}</h3>
        <div class="sub">Wave ${f.wave || 1}</div></div>
        ${isComplete(f) ? `<span class="badge done">Completo</span>` : `<span class="badge">${done}/${tot}</span>`}
      </div>
      <div class="progress" style="margin-top:10px"><div style="width:${tot ? done / tot * 100 : 0}%"></div></div>
    </div>
    <div class="sub" style="margin:10px 4px 4px">Tocca una voce per aggiornarla: confermi sempre prima del salvataggio, e puoi aggiungere una nota.</div>`;

  areaList().forEach(a => {
    const leaves = leavesOf(a), isParent = kidsOf(a).length > 0;
    if (isParent) {
      const nOk = leaves.filter(l => stOf(f.id, l.id) === 2).length;
      html += `<div class="area-head"><span>${esc(a.label)}</span>
        <span class="ac">${areaState(f.id, a) === -1 ? "non richiesta" : nOk + "/" + leaves.length}</span></div>`;
    }
    leaves.forEach(l => {
      const lvl = stOf(f.id, l.id), ev = evOf(f.id, l.id);
      const meta = ev && lvl > 0 ? ` · ${esc(ev.actor_name)} · ${fmtTs(ev.created_at)}` : "";
      html += `<button type="button" class="comp-row${isParent ? " sub" : ""}" data-leaf="${l.id}">
        <span class="mark ${lvl === -1 ? "na" : lvl ? "s" + lvl : ""}">${lvl === 2 ? "✓" : lvl === 1 ? "◐" : lvl === -1 ? "–" : ""}</span>
        <span class="comp-main">
          <span class="comp-name">${esc(l.label)}</span>
          <span class="comp-state">${ST_LABEL[lvl]}${meta}</span>
          ${ev && ev.note && lvl === 1 ? `<span class="comp-note">“${esc(ev.note)}”</span>` : ""}
        </span>
        <span class="sub" style="font-size:1.1rem">›</span>
      </button>`;
    });
  });

  const hist = events.filter(e => e.fwe_id === f.id).slice().reverse().slice(0, 30);
  if (hist.length) {
    html += `<div class="hist"><div class="area-head"><span>Storico</span></div>` + hist.map(e => {
      const node = comps.find(c => c.id === e.competency_id);
      const verb = e.level === 2 ? "ha validato" : e.isRevert ? "ha riportato a osservato"
        : e.level === 1 ? "ha osservato" : e.level === 0 ? "ha riportato a da osservare" : "ha aggiornato";
      return `<div class="hist-i">
        <span class="hist-dot" style="background:${e.level === 2 ? "var(--ok)" : e.isRevert ? "var(--danger)" : "var(--warn)"}"></span>
        <span><b>${esc(e.actor_name)}</b> ${verb} ${esc(node ? node.label : "—")} · ${fmtTs(e.created_at)}
        ${e.note ? `<br>“${esc(e.note)}”` : ""}</span></div>`;
    }).join("") + `</div>`;
  }

  main.innerHTML = html;
  $("#v-back").onclick = () => { openFweId = null; render(); };
  main.querySelectorAll("[data-leaf]").forEach(b => b.onclick = () => tapLeaf(f, b.dataset.leaf));
}

// Ogni tocco apre un foglio con la transizione, nota facoltativa e Annulla:
// niente avanza più per sbaglio. La nota è obbligatoria solo tornando
// indietro da Validato.
function tapLeaf(f, leafId) {
  const lvl = stOf(f.id, leafId);
  const node = comps.find(c => c.id === leafId);
  const trans = (a, b) => `<p class="sub" style="margin:4px 0 2px"><strong style="color:var(--text)">${ST_LABEL[a].split(" ·")[0]}</strong> → <strong style="color:var(--accent)">${ST_LABEL[b].split(" ·")[0]}</strong></p>`;

  let target, title, noteLabel = "Nota (facoltativa)", notePh = "es. demo iPhone con cliente indeciso";
  let noteRequired = false, extra = "", blocked = false;

  if (lvl === -1) { target = 0; title = "Richiedi questa competenza"; noteLabel = "Perché la aggiungi ora (facoltativa)"; notePh = "es. entrata nel percorso dopo il reparto"; }
  else if (lvl === 0) { target = 1; title = "Segna come osservato"; noteLabel = "Cosa hai osservato (facoltativa)"; }
  else if (lvl === 1) {
    target = 2; title = "Valida";
    noteLabel = "Cosa conferma che è autonomo (facoltativa)";
    notePh = "es. turno intero senza supporto";
    blocked = !canValidate(f.id, leafId);
    if (blocked) extra = `<p class="sub" style="color:var(--warn);margin-top:6px">L'hai osservata tu: la validazione spetta a un altro key role. Puoi però riportarla a “da osservare”.</p>`;
  } else {
    target = 1; title = "Torna a osservato"; noteRequired = true;
    noteLabel = "Cosa non ha funzionato (obbligatorio)";
    notePh = "es. sbaglia ancora il passaggio sul trade-in";
    const ev = evOf(f.id, leafId);
    if (ev) extra = `<p class="sub" style="margin-top:6px">Validato da ${esc(ev.actor_name)} il ${fmtTs(ev.created_at)}. Resta nello storico.</p>`;
  }

  // da "osservato" si può anche tornare a "da osservare" (il tap sbagliato si corregge qui)
  const backBtn = lvl === 1
    ? `<div class="row" style="margin-top:12px"><button type="button" class="ghost small" id="dlg-back0">↩︎ Riporta a “da osservare”</button></div>`
    : "";

  openDialog(title, `
      <p class="sub">${esc(node.label)} · ${esc(f.name)}</p>
      ${blocked ? "" : trans(lvl, target)}
      ${extra}
      ${blocked ? "" : `<div class="field"><label>${noteLabel}</label>
        <input type="text" name="note" placeholder="${notePh}" ${noteRequired ? "required" : ""}></div>`}
      ${backBtn}`,
    async (fd) => {
      if (blocked) return;
      const note = (fd.get("note") || "").trim();
      if (noteRequired && note.length < 3) { toast("Serve scrivere cosa non ha funzionato"); return false; }
      if (!await addEvent(f.id, leafId, target, note || null)) return;
      if (lvl === 2) await log(`ha riportato a osservato “${node.label}” di ${f.name}: ${note}`);
      toast(target === 2 ? `${node.label} validato` : target === 1 ? (lvl === 2 ? `${node.label} torna da verificare` : `${node.label} osservato`) : `${node.label} ora è richiesta`);
      await refresh();
    },
    (form) => {
      if (blocked) form.querySelector("button[type=submit]").style.display = "none";
      const b0 = form.querySelector("#dlg-back0");
      if (b0) b0.onclick = async () => {
        const note = (form.querySelector("[name=note]")?.value || "").trim();
        if (!await addEvent(f.id, leafId, 0, note || null)) return;
        toast(`${node.label} torna a “da osservare”`);
        $("#dlg").close();
        await refresh();
      };
    });
}

// Vista per competenza: dove il floor è scoperto
function renderCompetenze(main, seg) {
  const rows = [];
  areaList().forEach(a => {
    const isParent = kidsOf(a).length > 0;
    leavesOf(a).forEach(l => {
      let v = 0, o = 0, tot = 0, rev = 0;
      fweList.forEach(f => {
        const s = stOf(f.id, l.id);
        if (s === -1) return;
        tot++; if (s === 2) v++; else if (s === 1) o++;
        rev += (pairHist[f.id + "|" + l.id] || []).filter(e => e.isRevert).length;
      });
      rows.push({ label: l.label, area: isParent ? a.label : null, v, o, tot, rev });
    });
  });
  rows.sort((x, y) => (x.tot ? x.v / x.tot : 1) - (y.tot ? y.v / y.tot : 1) || y.o - x.o);

  main.innerHTML = seg + `
    <div class="section-head"><h2>Dove serve attenzione</h2>
      <button class="small ghost" id="edit-comps">Modifica</button></div>
    <div class="sub" style="margin:0 4px 12px">Le competenze dalla più scoperta alla più solida, su tutti gli FWE.</div>
    <div class="card" style="padding:0">
      ${rows.length ? rows.map(r => `
        <div class="att-row">
          <span class="att-name">${esc(r.label)}${r.area ? `<em>${esc(r.area)}</em>` : ""}</span>
          <span class="att-bar"><i class="v" style="width:${r.tot ? r.v / r.tot * 100 : 0}%"></i><i class="o" style="width:${r.tot ? r.o / r.tot * 100 : 0}%"></i></span>
          ${r.rev ? `<span class="att-flag">${r.rev} indietro</span>` : ""}
          <span class="att-num">${r.v}/${r.tot}</span>
        </div>`).join("") : `<div class="empty">Nessuna competenza.</div>`}
    </div>`;
  $("#edit-comps").onclick = () => { vEditor = true; render(); };
}

function openAddComp(parentId) {
  const parent = parentId ? comps.find(c => c.id === parentId) : null;
  const firstSub = parent && comps.filter(c => c.parent_id === parentId).length === 0;
  openDialog(parent ? `Sotto-competenza di ${parent.label}` : "Nuova area", `
    <div class="field"><label>Nome</label><input type="text" name="label" required></div>
    ${firstSub ? `<p class="sub">“${esc(parent.label)}” diventa un contenitore: lo stato attuale di ciascun FWE passa a questa prima voce, così nessuno perde quanto già validato.</p>` : ""}
    <div class="field"><label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">
      <input type="checkbox" name="retro" style="width:auto;margin-top:3px">
      <span>Richiedila anche agli FWE già in percorso<br>
      <span class="sub">Se la lasci spenta resta “non richiesta” per chi c'è già.</span></span></label></div>`,
    async (fd) => {
      const label = fd.get("label").trim();
      const retro = fd.get("retro") === "on";
      const siblings = comps.filter(c => (c.parent_id || null) === (parentId || null));
      const pos = Math.max(0, ...siblings.map(c => c.position)) + 1;
      const { data, error } = await db.from("competencies")
        .insert({ label, position: pos, parent_id: parentId }).select().single();
      if (error) { toast("Errore nel salvataggio"); return; }

      const rows = [];
      fweList.forEach(f => {
        // la prima sotto-competenza eredita lo stato che l'area aveva
        const lvl = firstSub ? stOf(f.id, parentId) : (retro ? 0 : -1);
        if (lvl !== 0) rows.push({
          fwe_id: f.id, competency_id: data.id, level: lvl,
          actor_id: me.id, actor_name: me.name,
        });
      });
      if (rows.length) await db.from("fwe_events").insert(rows);
      await log(`ha aggiunto la competenza “${label}”`);
      await refresh();
    });
}

      if (me?.id === p.id) {
        localStorage.removeItem("whoami"); me = null;
        await loadAll(); showWhoami(); return;
      }
      await refresh();
    };
  });
}

// ── Progetti ────────────────────────────────────────────────
// Ogni progetto attivo è un tab a sé: il pilot vive accanto a
// Validation, non dentro un menu.
const ROLES = ["Specialist", "OnPoint", "Keyrole", "Coach"];
const TRAFFIC = ["poco", "medio", "tanto"];
const KINDS = ["osservazione", "idea", "problema", "domanda"];

const projectOf = (id) => projects.find(p => p.id === id) || null;
const itemsOf = (pr, kind) => projItems
  .filter(i => i.project_id === pr.id && i.kind === kind && i.active)
  .sort((a, b) => a.position - b.position);
const slotsOf = (pr) => slots.filter(s => s.project_id === pr.id)
  .sort((a, b) => (a.date + (a.start_time || "")).localeCompare(b.date + (b.start_time || "")));
const crewOf = (slotId) => slotPeople.filter(x => x.slot_id === slotId).sort((a, b) => a.position - b.position);
const roleNames = (slotId, role) => crewOf(slotId).filter(x => x.role === role).map(x => x.person_name);
const debriefsOf = (slotId) => debriefs.filter(d => d.slot_id === slotId);
const projDebriefs = (pr) => debriefs.filter(d => d.project_id === pr.id);
const repliesOf = (insightId) => replies.filter(r => r.insight_id === insightId);
const slotLabel = (s) => s.start_time ? `${s.start_time}–${s.end_time || ""}`.replace(/–$/, "") : "Turno";
const projPeriod = (pr) => pr.starts_on
  ? `${fmtDateShort(pr.starts_on)} – ${fmtDateShort(pr.ends_on)}` : "";

function slotState(s) {
  const n = debriefsOf(s.id).length;
  if (n) return { cls: "done", label: n === 1 ? "Debriefato" : `${n} debrief` };
  const t = todayStr();
  if (s.date < t) return { cls: "", label: "Da debriefare" };
  return { cls: "soft", label: s.date === t ? "Oggi" : "In programma" };
}

// ── Turni ───────────────────────────────────────────────────
function renderProjectTurni(main, pr, seg) {
  const list = slotsOf(pr), today = todayStr();
  const nDeb = projDebriefs(pr).length;
  const nTodo = list.filter(s => s.date < today && !debriefsOf(s.id).length).length;

  const groups = [];
  list.forEach(s => {
    const g = groups[groups.length - 1];
    if (g && g.date === s.date) g.items.push(s);
    else groups.push({ date: s.date, items: [s] });
  });
  const cal = groups.map(g => `
    <div class="date-head ${g.date === today ? "today" : ""}">
      ${g.date === today ? "Oggi · " : ""}${fmtDate(g.date)}</div>
    ${g.items.map(s => slotCard(pr, s)).join("")}`).join("");

  const recap = [projPeriod(pr), `${list.length} turni`, `${nDeb} debrief`].filter(Boolean).join(" · ");
  main.innerHTML = seg + `
    <div class="section-head"><h2>Turni</h2>
      <button class="small" id="add-slot">+ Nuovo turno</button></div>
    <div class="sub" style="margin:-6px 4px 12px">${esc(recap)}${
      nTodo ? ` · <strong style="color:var(--warn)">${nTodo} da debriefare</strong>` : ""}</div>
    ${cal || `<div class="empty">Nessun turno ancora.<br>Aggiungine uno con “+ Nuovo turno”.</div>`}`;

  $("#add-slot").onclick = () => openDialog("Nuovo turno", slotFields(pr, null),
    async (fd) => {
      const { data, error } = await db.from("project_slots").insert({
        project_id: pr.id,
        date: fd.get("date"),
        start_time: fd.get("start_time") || null,
        end_time: fd.get("end_time") || null,
        note: (fd.get("note") || "").trim() || null,
      }).select().single();
      if (error) { toast("Errore nel salvataggio"); return false; }
      await saveCrew(data.id, fd);
      await log(`ha aggiunto un turno ${pr.name} del ${fmtDateShort(data.date)}`);
      await refresh();
    }, wireSlotForm);

  main.querySelectorAll("[data-slot-toggle]").forEach(el => {
    el.onclick = () => {
      const id = el.dataset.slotToggle;
      openSlot.has(id) ? openSlot.delete(id) : openSlot.add(id);
      render();
    };
  });
  main.querySelectorAll("[data-act=debrief]").forEach(b => {
    b.onclick = () => openDebriefDialog(pr, list.find(s => s.id === b.dataset.id));
  });
  main.querySelectorAll("[data-act=slot-ics]").forEach(b => {
    const s = list.find(x => x.id === b.dataset.id);
    b.onclick = () => saveICS(slotToICS(pr, s), `${pr.name.toLowerCase()}-${s.date}.ics`);
  });
  main.querySelectorAll("[data-act=edit-slot]").forEach(b => {
    b.onclick = () => {
      const s = list.find(x => x.id === b.dataset.id);
      openDialog("Modifica turno", slotFields(pr, s) + `
        <div class="row" style="margin-top:14px">
          <button type="button" class="danger small" id="dlg-del-slot">Elimina questo turno</button>
        </div>`,
        async (fd) => {
          const { error } = await db.from("project_slots").update({
            date: fd.get("date"),
            start_time: fd.get("start_time") || null,
            end_time: fd.get("end_time") || null,
            note: (fd.get("note") || "").trim() || null,
            updated_at: new Date().toISOString(),
          }).eq("id", s.id);
          if (error) { toast("Errore nel salvataggio"); return false; }
          await saveCrew(s.id, fd);
          await log(`ha modificato il turno ${pr.name} del ${fmtDateShort(fd.get("date"))}`);
          await refresh();
        },
        (form) => {
          wireSlotForm(form);
          form.querySelector("#dlg-del-slot").onclick = async () => {
            const n = debriefsOf(s.id).length;
            if (!confirm(`Eliminare il turno del ${fmtDateShort(s.date)}?${
              n ? `\nI ${n} debrief restano, senza turno collegato.` : ""}`)) return;
            await db.from("project_slots").delete().eq("id", s.id);
            await log(`ha eliminato il turno ${pr.name} del ${fmtDateShort(s.date)}`);
            $("#dlg").close();
            await refresh();
          };
        });
    };
  });
}

function slotCard(pr, s) {
  const st = slotState(s);
  const lines = ROLES.map(r => ({ r, n: roleNames(s.id, r) })).filter(x => x.n.length);
  const summary = lines.map(x => `${x.r}: ${x.n.join(", ")}`).join(" · ") || "nessuno assegnato";
  return `<div class="card">
    <div class="row spread dd-summary slot-head" data-slot-toggle="${s.id}">
      <div style="min-width:0">
        <h3>${esc(slotLabel(s))}</h3>
        ${openSlot.has(s.id) ? "" : `<div class="sub">${esc(summary)}</div>`}
      </div>
      <span class="badge ${st.cls}">${esc(st.label)}</span>
    </div>
    ${!openSlot.has(s.id) ? "" : `
      ${lines.map(x => `<div class="role-line"><b>${esc(x.r)}</b><span>${esc(x.n.join(", "))}</span></div>`).join("")}
      ${s.note ? `<div class="manager-line">📝 ${esc(s.note)}</div>` : ""}
      ${debriefsOf(s.id).map(debriefBlock).join("")}
      <div class="row" style="margin-top:12px">
        <button class="small" data-act="debrief" data-id="${s.id}">+ Debrief</button>
        <span style="flex:1"></span>
        <button class="ghost small" data-act="slot-ics" data-id="${s.id}">📅 Calendario</button>
        <button class="ghost small" data-act="edit-slot" data-id="${s.id}">Modifica</button>
      </div>`}
  </div>`;
}

function debriefBlock(d) {
  const nums = [
    d.in_list != null ? `👥 ${d.in_list} in lista` : null,
    d.bags != null ? `🛍 ${d.bags} bag` : null,
    d.conversions != null ? `✅ ${d.conversions} conversion` : null,
    d.traffic ? `traffico ${d.traffic}` : null,
  ].filter(Boolean);
  const demos = Array.isArray(d.demos) ? d.demos : [];
  return `<div class="db-item">
    <div class="row spread"><strong>${esc(d.author_name)}</strong>
      <span class="sub">${fmtTs(d.created_at)}</span></div>
    ${nums.length ? `<div class="db-nums">${nums.map(n => `<span>${esc(n)}</span>`).join("")}</div>` : ""}
    ${demos.length ? `<div class="db-line">Demo: ${esc(demos.join(", "))}</div>` : ""}
    ${d.best_demo ? `<div class="db-line">★ La più efficace: <b>${esc(d.best_demo)}</b></div>` : ""}
    ${d.icebreaker ? `<div class="db-line">🗣 “${esc(d.icebreaker)}”</div>` : ""}
    ${d.worked ? `<div class="db-line">✔ <b>${esc(d.worked)}</b></div>` : ""}
    ${d.improve ? `<div class="db-line">↻ ${esc(d.improve)}</div>` : ""}
  </div>`;
}

// I nomi dei ruoli si scrivono separati da virgola: i suggerimenti
// sotto al campo evitano di riscriverli ogni volta.
function suggestNames(pr, role) {
  const ids = new Set(slotsOf(pr).map(s => s.id));
  const freq = {};
  slotPeople.filter(x => ids.has(x.slot_id) && x.role === role)
    .forEach(x => freq[x.person_name] = (freq[x.person_name] || 0) + 1);
  const used = Object.keys(freq).sort((a, b) => freq[b] - freq[a]);
  const extra = role === "Specialist"
    ? itemsOf(pr, "specialist").sort((a, b) => (b.checked - a.checked) || (a.position - b.position)).map(i => i.label)
    : people.filter(p => p.active).map(p => p.name);
  return [...new Set([...used, ...extra])];
}

function slotFields(pr, s) {
  return `
    <div class="field"><label>Data *</label>
      <input type="date" name="date" value="${s?.date || todayStr()}" required></div>
    <div class="row" style="gap:10px">
      <div class="field" style="flex:1"><label>Dalle</label>
        <input type="time" name="start_time" value="${s?.start_time || "16:00"}"></div>
      <div class="field" style="flex:1"><label>Alle</label>
        <input type="time" name="end_time" value="${s?.end_time || "18:00"}"></div>
    </div>
    ${ROLES.map(r => {
      const have = roleNames(s?.id, r);
      const sug = suggestNames(pr, r).filter(n => !have.includes(n)).slice(0, 8);
      return `<div class="field"><label>${r}</label>
        <input type="text" name="role_${r}" value="${esc(have.join(", "))}" placeholder="Nomi separati da virgola">
        ${sug.length ? `<div class="chips" style="margin-top:6px">${sug.map(n =>
          `<button type="button" class="fchip" data-append="role_${r}" data-v="${esc(n)}">${esc(n)}</button>`).join("")}</div>` : ""}
      </div>`;
    }).join("")}
    <div class="field"><label>Note</label>
      <input type="text" name="note" value="${esc(s?.note || "")}" placeholder="es. store pieno per il lancio"></div>`;
}

function wireSlotForm(form) {
  form.querySelectorAll("[data-append]").forEach(b => {
    b.onclick = () => {
      const inp = form.querySelector(`[name="${b.dataset.append}"]`);
      const names = inp.value.split(",").map(x => x.trim()).filter(Boolean);
      if (names.includes(b.dataset.v)) return;
      names.push(b.dataset.v);
      inp.value = names.join(", ");
      b.setAttribute("aria-pressed", "true");
    };
  });
}

// Sostituisce in blocco chi copre il turno: più semplice di
// inseguire le singole differenze, e il turno resta coerente.
async function saveCrew(slotId, fd) {
  await db.from("slot_people").delete().eq("slot_id", slotId);
  const rows = [];
  ROLES.forEach(r => (fd.get("role_" + r) || "").split(",").map(x => x.trim()).filter(Boolean)
    .forEach((nm, i) => rows.push({
      slot_id: slotId, role: r, person_name: nm,
      person_id: people.find(p => p.name === nm)?.id || null, position: i,
    })));
  if (rows.length) await db.from("slot_people").insert(rows);
}

function slotToICS(pr, s) {
  const day = s.date.replace(/-/g, "");
  const hhmm = (v, fb) => (v || fb).replace(":", "") + "00";
  const crew = ROLES.map(r => {
    const n = roleNames(s.id, r);
    return n.length ? `${r}: ${n.join(", ")}` : null;
  }).filter(Boolean).join("\n");
  const title = `${pr.full_name || pr.name}: turno ${slotLabel(s)}`;
  return [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Store Tasks//IT",
    "BEGIN:VEVENT",
    `UID:slot-${s.id}@store-tasks`,
    `DTSTAMP:${icsStamp()}`,
    `DTSTART:${day}T${hhmm(s.start_time, "16:00")}`,
    `DTEND:${day}T${hhmm(s.end_time, "18:00")}`,
    `SUMMARY:${icsEsc(title)}`,
    crew || s.note ? `DESCRIPTION:${icsEsc([crew, s.note].filter(Boolean).join("\n"))}` : null,
    "BEGIN:VALARM",
    "ACTION:DISPLAY",
    `DESCRIPTION:${icsEsc("Tra un'ora: " + title)}`,
    "TRIGGER;RELATED=START:-PT1H",
    "END:VALARM",
    "END:VEVENT",
    "END:VCALENDAR",
  ].filter(Boolean).join("\r\n");
}

// ── Debrief ─────────────────────────────────────────────────
function chipRow(name, values, current, multi) {
  const sel = multi ? (current || []) : (current ? [current] : []);
  return `<div class="chips" data-chips="${name}" data-multi="${multi ? 1 : 0}">
    ${values.map(v => `<button type="button" class="fchip" data-v="${esc(v)}"
        aria-pressed="${sel.includes(v)}">${esc(v)}</button>`).join("")}
    <input type="hidden" name="${name}" value="${esc(multi ? JSON.stringify(sel) : (current || ""))}">
  </div>`;
}

function wireChips(form) {
  form.querySelectorAll("[data-chips]").forEach(box => {
    const hidden = box.querySelector("input[type=hidden]");
    const multi = box.dataset.multi === "1";
    box.querySelectorAll("button[data-v]").forEach(b => {
      b.onclick = () => {
        if (multi) {
          const cur = JSON.parse(hidden.value || "[]");
          const i = cur.indexOf(b.dataset.v);
          if (i < 0) cur.push(b.dataset.v); else cur.splice(i, 1);
          hidden.value = JSON.stringify(cur);
          b.setAttribute("aria-pressed", i < 0);
        } else {
          const on = b.getAttribute("aria-pressed") === "true";
          box.querySelectorAll("button[data-v]").forEach(x => x.setAttribute("aria-pressed", "false"));
          b.setAttribute("aria-pressed", !on);
          hidden.value = on ? "" : b.dataset.v;
        }
      };
    });
  });
}

function openDebriefDialog(pr, s) {
  if (!s) return;
  const demos = itemsOf(pr, "demo").map(i => i.label);
  const phrases = [...new Set(projDebriefs(pr).filter(d => d.icebreaker)
    .map(d => d.icebreaker.trim()))].reverse().slice(0, 5);

  openDialog(`Debrief · ${fmtDateShort(s.date)}`, `
      <p class="sub">${esc(slotLabel(s))} · quello che scrivi qui finisce negli Spunti.</p>
      <div class="num-grid">
        <label>In lista<input type="number" name="in_list" min="0" inputmode="numeric" placeholder="—"></label>
        <label>Shopping bag<input type="number" name="bags" min="0" inputmode="numeric" placeholder="—"></label>
        <label>Conversion<input type="number" name="conversions" min="0" inputmode="numeric" placeholder="—"></label>
      </div>
      <div class="field"><label>Traffico in store</label>${chipRow("traffic", TRAFFIC, "", false)}</div>
      ${demos.length ? `
        <div class="field"><label>Demo fatte</label>${chipRow("demos", demos, [], true)}</div>
        <div class="field"><label>La demo più efficace</label>
          <select name="best_demo"><option value="">— nessuna —</option>
            ${demos.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join("")}</select></div>` : ""}
      <div class="field"><label>Frase rompighiaccio che ha funzionato</label>
        <input type="text" name="icebreaker" placeholder="es. Hai già l'iPhone?">
        ${phrases.length ? `<div class="chips" style="margin-top:6px">${phrases.map(p =>
          `<button type="button" class="fchip" data-fill="${esc(p)}">${esc(p)}</button>`).join("")}</div>` : ""}</div>
      <div class="field"><label>Cosa ha funzionato</label>
        <textarea name="worked" rows="2" placeholder="es. partire da una funzione sola"></textarea></div>
      <div class="field"><label>Cosa cambieresti</label>
        <textarea name="improve" rows="2"></textarea></div>`,
    async (fd) => {
      const num = (k) => { const v = (fd.get(k) || "").trim(); return v === "" ? null : parseInt(v, 10); };
      const txt = (k) => ((fd.get(k) || "").toString().trim() || null);
      const row = {
        project_id: pr.id, slot_id: s.id,
        author_id: me.id, author_name: me.name,
        in_list: num("in_list"), bags: num("bags"), conversions: num("conversions"),
        traffic: txt("traffic"),
        demos: JSON.parse(fd.get("demos") || "[]"),
        best_demo: txt("best_demo"), icebreaker: txt("icebreaker"),
        worked: txt("worked"), improve: txt("improve"),
      };
      const vuoto = row.in_list == null && row.bags == null && row.conversions == null &&
        !row.demos.length && !row.traffic && !row.best_demo && !row.icebreaker && !row.worked && !row.improve;
      if (vuoto) { toast("Scrivi almeno un numero o un'osservazione"); return false; }
      const { error } = await db.from("debriefs").insert(row);
      if (error) { toast("Errore nel salvataggio"); return false; }
      await log(`ha fatto il debrief del turno ${pr.name} del ${fmtDateShort(s.date)}`);
      toast("Debrief salvato");
      openSlot.add(s.id);
      await refresh();
    },
    (form) => {
      wireChips(form);
      form.querySelectorAll("[data-fill]").forEach(b => {
        b.onclick = () => { form.querySelector("[name=icebreaker]").value = b.dataset.fill; };
      });
    });
}

// ── Spunti ──────────────────────────────────────────────────
function renderProjectSpunti(main, pr, seg) {
  const dbs = projDebriefs(pr);
  const somma = (k) => dbs.reduce((a, d) => a + (d[k] || 0), 0);

  const demoRows = itemsOf(pr, "demo").map(i => ({
    label: i.label,
    fatte: dbs.filter(d => (d.demos || []).includes(i.label)).length,
    best: dbs.filter(d => d.best_demo === i.label).length,
  })).sort((a, b) => (b.best - a.best) || (b.fatte - a.fatte) || a.label.localeCompare(b.label));
  const maxDemo = Math.max(1, ...demoRows.map(r => Math.max(r.fatte, r.best)));
  const demoHtml = demoRows.some(r => r.fatte || r.best)
    ? `<div class="card" style="padding:4px 0">${demoRows.map(r => `
        <div class="att-row">
          <span class="att-name">${esc(r.label)}</span>
          <span class="att-bar">
            <i class="v" style="width:${r.best / maxDemo * 100}%"></i>
            <i class="o" style="width:${Math.max(0, r.fatte - r.best) / maxDemo * 100}%"></i></span>
          <span class="att-num">${r.fatte}× · ${r.best}★</span>
        </div>`).join("")}</div>`
    : `<div class="empty">Nessuna demo ancora registrata in un debrief.</div>`;

  const frasi = {};
  dbs.filter(d => d.icebreaker).forEach(d => {
    const k = d.icebreaker.trim().toLowerCase();
    const f = frasi[k] || (frasi[k] = { text: d.icebreaker.trim(), n: 0, chi: [] });
    f.n++;
    if (!f.chi.includes(d.author_name)) f.chi.push(d.author_name);
  });
  const frasiRows = Object.values(frasi).sort((a, b) => b.n - a.n);

  const media = (g, k) => {
    const v = g.filter(d => d[k] != null);
    return v.length ? (v.reduce((a, d) => a + d[k], 0) / v.length).toFixed(1).replace(".0", "") : "—";
  };
  const trRows = TRAFFIC.map(t => {
    const g = dbs.filter(d => d.traffic === t);
    return { t, n: g.length, lista: media(g, "in_list"), bag: media(g, "bags"), conv: media(g, "conversions") };
  }).filter(r => r.n);

  const note = dbs.filter(d => d.worked || d.improve).slice().reverse().slice(0, 8);

  const spunti = insights.filter(i => i.project_id === pr.id)
    .sort((a, b) => (a.resolved - b.resolved) || (b.id - a.id));

  main.innerHTML = seg + `
    <div class="stats">
      <div class="stat"><b>${dbs.length}</b><span>Debrief</span></div>
      <div class="stat"><b>${somma("in_list")}</b><span>In lista</span></div>
      <div class="stat"><b>${somma("bags")}</b><span>Bag</span></div>
      <div class="stat"><b>${somma("conversions")}</b><span>Conversion</span></div>
    </div>

    <div class="area-head"><span>Le demo che convertono</span>
      <span class="ac">volte · ★ migliore</span></div>
    ${demoHtml}

    ${frasiRows.length ? `<div class="area-head"><span>Frasi che funzionano</span></div>
      ${frasiRows.map(f => `<div class="t-row">
        <span class="t-txt"><span class="t-name">“${esc(f.text)}”</span>
          <span class="t-meta">${esc(f.chi.join(", "))}</span></span>
        <span class="badge ${f.n > 1 ? "done" : "soft"}">${f.n}×</span>
      </div>`).join("")}` : ""}

    ${trRows.length ? `<div class="area-head"><span>Traffico e risultati</span>
        <span class="ac">media per turno</span></div>
      ${trRows.map(r => `<div class="t-row">
        <span class="t-txt"><span class="t-name">Traffico ${esc(r.t)}</span>
          <span class="t-meta">${r.n} ${r.n === 1 ? "debrief" : "debrief"}</span></span>
        <span class="sub">👥 ${r.lista} · 🛍 ${r.bag} · ✅ ${r.conv}</span>
      </div>`).join("")}` : ""}

    ${note.length ? `<div class="area-head"><span>Dai debrief</span></div>
      <div class="card">${note.map(d => `
        <div class="db-line" style="margin-bottom:8px">
          ${d.worked ? `✔ <b>${esc(d.worked)}</b><br>` : ""}
          ${d.improve ? `↻ ${esc(d.improve)}<br>` : ""}
          <span class="sub">${esc(d.author_name)} · ${fmtTs(d.created_at)}</span>
        </div>`).join("")}</div>` : ""}

    <div class="section-head" style="margin-top:22px"><h2>Spunti</h2>
      <button class="small" id="add-insight">+ Spunto</button></div>
    ${spunti.length ? spunti.map(insightCard).join("")
      : `<div class="empty">Ancora nessuno spunto.<br>Butta giù un'osservazione con “+ Spunto”.</div>`}`;

  $("#add-insight").onclick = () => openDialog("Nuovo spunto", `
      <div class="field"><label>Che tipo è</label>${chipRow("kind", KINDS, "osservazione", false)}</div>
      <div class="field"><label>Lo spunto</label>
        <textarea name="text" rows="3" required placeholder="es. con il cliente indeciso funziona partire dalla fotocamera"></textarea></div>`,
    async (fd) => {
      const text = (fd.get("text") || "").trim();
      if (text.length < 3) { toast("Scrivi lo spunto"); return false; }
      const { error } = await db.from("insights").insert({
        project_id: pr.id, kind: fd.get("kind") || "osservazione", text,
        author_id: me.id, author_name: me.name,
      });
      if (error) { toast("Errore nel salvataggio"); return false; }
      await log(`ha aggiunto uno spunto a ${pr.name}: ${text.slice(0, 60)}`);
      toast("Spunto salvato");
      await refresh();
    }, wireChips);

  main.querySelectorAll("[data-act=reply]").forEach(b => {
    b.onclick = () => {
      const i = insights.find(x => x.id === Number(b.dataset.id));
      openDialog("Rispondi", `
        <p class="sub">${esc(i.text)}</p>
        <div class="field"><label>La tua risposta</label>
          <textarea name="text" rows="3" required></textarea></div>`,
        async (fd) => {
          const text = (fd.get("text") || "").trim();
          if (text.length < 2) { toast("Scrivi la risposta"); return false; }
          const { error } = await db.from("insight_replies").insert({
            insight_id: i.id, text, author_id: me.id, author_name: me.name,
          });
          if (error) { toast("Errore nel salvataggio"); return false; }
          await refresh();
        });
    };
  });
  main.querySelectorAll("[data-act=resolve]").forEach(b => {
    b.onclick = async () => {
      const i = insights.find(x => x.id === Number(b.dataset.id));
      const { error } = await db.from("insights").update({ resolved: !i.resolved }).eq("id", i.id);
      if (error) { toast("Errore nel salvataggio"); return; }
      await refresh();
    };
  });
  main.querySelectorAll("[data-act=del-insight]").forEach(b => {
    b.onclick = async () => {
      const i = insights.find(x => x.id === Number(b.dataset.id));
      if (!confirm("Eliminare questo spunto?")) return;
      await db.from("insights").delete().eq("id", i.id);
      await refresh();
    };
  });
}

function insightCard(i) {
  const rs = repliesOf(i.id);
  return `<div class="card">
    <div class="row spread">
      <span class="row" style="gap:6px">
        <span class="kind ${esc(i.kind)}">${esc(i.kind)}</span>
        ${i.resolved ? `<span class="badge done">Chiusa</span>` : ""}
      </span>
      <span class="sub">${esc(i.author_name)} · ${fmtTs(i.created_at)}</span>
    </div>
    <div style="margin-top:8px">${esc(i.text)}</div>
    ${rs.map(r => `<div class="reply"><b>${esc(r.author_name)}</b>
      <span class="sub">· ${fmtTs(r.created_at)}</span><br>${esc(r.text)}</div>`).join("")}
    <div class="row" style="margin-top:10px">
      <button class="ghost small" data-act="reply" data-id="${i.id}">Rispondi</button>
      ${i.kind === "domanda" ? `<button class="ghost small" data-act="resolve" data-id="${i.id}">${
        i.resolved ? "↩︎ Riapri" : "✓ Chiudi"}</button>` : ""}
      <span style="flex:1"></span>
      ${i.author_name === me?.name
        ? `<button class="danger small" data-act="del-insight" data-id="${i.id}">Elimina</button>` : ""}
    </div>
  </div>`;
}

// ── Dialog generico ─────────────────────────────────────────
function openDialog(title, fieldsHtml, onSubmit, onOpen) {
  const dlg = $("#dlg"), form = $("#dlg-form");
  form.innerHTML = `<h3>${title}</h3>${fieldsHtml}
    <div class="dialog-actions">
      <button type="button" class="ghost" id="dlg-cancel">Annulla</button>
      <button type="submit">Salva</button>
    </div>`;
  form.onsubmit = async (e) => {
    e.preventDefault();
    // chi gestisce il salvataggio può restituire false per tenere
    // aperto il foglio senza far perdere quello che è stato scritto
    if (await onSubmit(new FormData(form)) === false) return;
    dlg.close();
  };
  form.querySelector("#dlg-cancel").onclick = () => dlg.close();
  if (onOpen) onOpen(form);
  dlg.showModal();
}

if (session) { await start(); } else { show("login"); }
