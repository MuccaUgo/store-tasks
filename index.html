<title>Store Tasks</title>
<style>
  :root {
    --bg: #f2f3f8;
    --card: #ffffff;
    --glass: rgba(255, 255, 255, .58);
    --glass-line: rgba(255, 255, 255, .75);
    --text: #14172b;
    --muted: #6b7085;
    --line: #e3e5ee;
    --accent: #3b5bfd;
    --accent-soft: #e8ecff;
    --ok: #1fa36b;
    --ok-soft: #e2f6ec;
    --warn: #c77b12;
    --warn-soft: #fcefdc;
    --danger: #d33f49;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(20, 23, 43, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1220;
      --card: #191d31;
      --glass: rgba(25, 29, 49, .55);
      --glass-line: rgba(255, 255, 255, .10);
      --text: #eceef7;
      --muted: #9aa0b8;
      --line: #2a2f4a;
      --accent: #7d92ff;
      --accent-soft: #232a4d;
      --ok: #3ecf8e;
      --ok-soft: #163a2c;
      --warn: #e8a13c;
      --warn-soft: #3d2f14;
      --danger: #ff6b74;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100dvh;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--glass);
    -webkit-backdrop-filter: blur(22px) saturate(1.8);
    backdrop-filter: blur(22px) saturate(1.8);
    padding: calc(12px + env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--glass-line);
  }
  header h1 { font-size: 1.15rem; letter-spacing: -.01em; }
  #whoami-chip {
    font-size: .85rem; color: var(--accent); background: var(--accent-soft);
    border: none; border-radius: 999px; padding: 6px 12px; font-weight: 600;
  }
  main { padding: 14px 14px 20px; max-width: 640px; margin: 0 auto; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(20, 23, 43, .04);
  }
  .card h3 { font-size: 1.02rem; margin-bottom: 2px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: .82rem; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .spread { justify-content: space-between; }
  .field { margin-top: 10px; }
  .field label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
  select, textarea,
  input[type=text], input[type=date], input[type=password],
  input[type=number], input[type=time] {
    width: 100%; padding: 11px 12px; font-size: 1rem;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg); color: var(--text);
    -webkit-appearance: none; appearance: none;
    font-family: inherit;
  }
  textarea { resize: vertical; line-height: 1.4; }
  button {
    font-family: inherit; font-size: .95rem; font-weight: 600;
    border: none; border-radius: 12px; padding: 11px 16px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.ghost { background: var(--accent-soft); color: var(--accent); }
  button.small { padding: 7px 12px; font-size: .85rem; }
  button.danger { background: transparent; color: var(--danger); padding: 7px 8px; }
  button:disabled { opacity: .5; }
  .toggle {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 999px; font-size: .85rem; font-weight: 600;
    background: var(--warn-soft); color: var(--warn); cursor: pointer; border: none;
  }
  .toggle.on { background: var(--ok-soft); color: var(--ok); }
  .badge {
    font-size: .75rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    background: var(--warn-soft); color: var(--warn);
  }
  .badge.done { background: var(--ok-soft); color: var(--ok); }
  .dd-summary { cursor: pointer; }
  .role-tag {
    font-size: .7rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .04em; cursor: pointer; border: none;
    background: var(--accent-soft); color: var(--accent);
  }
  .role-tag.pro { background: rgba(168, 85, 247, .16); color: #8b3fd4; }
  .aud-tag {
    font-size: .68rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
    background: rgba(16, 185, 129, .16); color: #0d9668;
    border: none; cursor: pointer;
  }
  .aud-tag.pz { background: rgba(245, 158, 11, .18); color: #b8730a; }
  @media (prefers-color-scheme: dark) {
    .role-tag.pro { color: #c78dff; }

    .aud-tag.pz { color: #fbbf24; }
  }
  .manager-line {
    margin-top: 10px; font-size: .85rem; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .date-head {
    margin: 18px 4px 8px; font-size: .82rem; font-weight: 700;

    display: flex; align-items: center; gap: 10px;

  details.past { margin-top: 18px; }
  details.past summary {
    cursor: pointer; color: var(--muted); font-size: .85rem; font-weight: 600;
    padding: 8px 2px; list-style: none;

  nav {

  #toast {

  .who-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; max-height: 45dvh; overflow-y: auto; }

  .log-item .sub { margin-top: 2px; }
  /* ── Segmenti e chip ── */
  .seg {
    display: flex; gap: 4px; padding: 4px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 13px; margin-bottom: 14px;
  }
  .fchip {
    border: 1px solid var(--line); background: var(--card); color: var(--muted);

  .dot.na { background: transparent; border: 1px dashed var(--muted); }
  .area-head {

  .att-bar i.v { background: var(--ok); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .slot-head { flex-wrap: nowrap; align-items: flex-start; }

  }
  .db-item { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; font-size: .88rem; }
  .db-nums { display: flex; flex-wrap: wrap; gap: 6px; margin: 7px 0; }

  .db-line { color: var(--muted); margin-top: 3px; }

    text-transform: uppercase; letter-spacing: .04em;

  .kind.domanda { background: var(--warn-soft); color: var(--warn); }
  .kind.idea { background: rgba(168, 85, 247, .16); color: #8b3fd4; }

  .reply {
    border-left: 2px solid var(--line); margin: 8px 0 0 2px;
    padding: 3px 0 3px 10px; font-size: .86rem;
  }
  .num-grid { display: flex; gap: 8px; margin-top: 10px; }
  .num-grid label { flex: 1; font-size: .72rem; color: var(--muted); }
  .num-grid input { margin-top: 4px; text-align: center; }
  .badge.soft { background: var(--accent-soft); color: var(--accent); }
  /* ── Focus Flow ── */
  .f-card2 {
    width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line);
    border-radius: 15px; padding: 13px 14px; margin-bottom: 9px; cursor: pointer;
    display: flex; flex-direction: column; gap: 9px; font-family: inherit; color: var(--text);
  }
  .f-card2:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .f-name2 { font-size: 1rem; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; }
  .fstate {
    font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap; flex: none;
  }
  .fs-att { background: var(--accent-soft); color: var(--accent); }
  .fs-ral { background: var(--warn-soft); color: var(--warn); }
  .fs-fer { background: rgba(211, 63, 73, .15); color: var(--danger); }

const $ = (s) => document.querySelector(s);
const views = { login: $("#view-login"), whoami: $("#view-whoami"), app: $("#view-app") };
function show(name) {
  Object.entries(views).forEach(([k, el]) => el.classList.toggle("hidden", k !== name));
}
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
}
const esc = (s) => (s ?? "").toString().replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const fmtDate = (d) => d ? new Date(d + "T00:00:00").toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" }) : "—";
const fmtDateShort = (d) => d ? new Date(d + "T00:00:00").toLocaleDateString("it-IT", { day: "numeric", month: "short" }) : "—";
const fmtTs = (ts) => new Date(ts).toLocaleString("it-IT", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const personName = (id) => people.find(p => p.id === id)?.name || "—";
const ddLabel = (d) => d.title || `DD del ${fmtDateShort(d.date)}`;
const audienceLabel = (a) => a === "pz" ? "PZ solo" : "All team";

const icsEsc = (s) => (s ?? "").toString()
  .replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
const icsStamp = () => new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");

// Evento .ics per aggiungere il DD al proprio calendario (promemoria ore 9:00)
function ddToICS(d) {
  const day = d.date.replace(/-/g, "");
  const next = new Date(d.date + "T00:00:00");
  next.setDate(next.getDate() + 1);
  const dayEnd = `${next.getFullYear()}${String(next.getMonth()+1).padStart(2,"0")}${String(next.getDate()).padStart(2,"0")}`;
  const details = [
    hasAudience ? `Destinatari: ${audienceLabel(d.audience)}` : null,
    d.preparer_id ? `Prepara: ${personName(d.preparer_id)}` : null,
    d.presenter_id ? `Facilita: ${personName(d.presenter_id)}` : null,
    d.manager ? `Manager presente: ${d.manager}` : null,
    d.notes ? `Note: ${d.notes}` : null,
  ].filter(Boolean).join("\n");
  return [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Store Tasks//IT",
    "BEGIN:VEVENT",
    `UID:dd-${d.id}@store-tasks`,
    `DTSTAMP:${icsStamp()}`,
    `DTSTART;VALUE=DATE:${day}`,
    `DTEND;VALUE=DATE:${dayEnd}`,
    `SUMMARY:${icsEsc("DD: " + ddLabel(d))}`,
    details ? `DESCRIPTION:${icsEsc(details)}` : null,
    "BEGIN:VALARM",
    "ACTION:DISPLAY",
    `DESCRIPTION:${icsEsc("Tra 5 giorni DD: " + ddLabel(d))}`,
    "TRIGGER;RELATED=START:-P4DT15H",
    "END:VALARM",
    "END:VEVENT",
    "END:VCALENDAR",
  ].filter(Boolean).join("\r\n");
}

function saveICS(text, filename) {
  const blob = new Blob([text], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  toast("Evento creato: aprilo per salvarlo in Calendario");
}

// L'icona in testata ricarica i dati e, se nel frattempo è uscita una
// versione nuova dell'app, ricarica anche la pagina: sul telefono la
// vecchia resterebbe in cache per giorni.
const APP_VERSION = document.querySelector('meta[name=app-version]')?.content || "";

async function versionePubblicata() {
  try {
    const r = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" });
    const t = await r.text();
    return /<meta name="app-version" content="([^"]*)"/.exec(t)?.[1] || "";
  } catch { return ""; }
}

$("#refresh-btn").addEventListener("click", async (e) => {
  const b = e.currentTarget;
  b.classList.add("spin");
  await refresh();
  const v = await versionePubblicata();
  if (v && v !== APP_VERSION) {
    toast("Nuova versione, ricarico…");
    setTimeout(() => location.replace(location.pathname + "?v=" + v), 900);
    return;
  }
  toast("Aggiornato");
  setTimeout(() => b.classList.remove("spin"), 700);
});

async function start() {
  await detectSchema();
  await loadAll();
  if (!me || !people.find(p => p.id === me.id)) { showWhoami(); return; }
  enterApp();
}

function showWhoami() {
  show("whoami");
  const list = $("#who-list");
  list.innerHTML = "";
  people.filter(p => p.active).forEach(p => {
    const b = document.createElement("button");
    b.textContent = p.name;
    b.onclick = () => { me = { id: p.id, name: p.name }; localStorage.setItem("whoami", JSON.stringify(me)); enterApp(); };
    list.appendChild(b);
  });
}

function enterApp() {
  $("#whoami-chip").textContent = me.name;
  show("app");
  render();
  subscribeRealtime();
}

// ── Dati ────────────────────────────────────────────────────
async function detectSchema() {
  const [a, p, f] = await Promise.all([
    db.from("downloads").select("audience").limit(1),
    db.from("projects").select("id").limit(1),
    db.from("focus").select("id").limit(1),
  ]);
  hasAudience = !a.error;
  hasProjects = !p.error;
  hasFocus = !f.error;
}

async function loadAll() {
  const q = [
    ["people", db.from("people").select("*").order("name")],
    ["downloads", db.from("downloads").select("*").order("date")],
    ["log", db.from("activity_log").select("*").order("id", { ascending: false }).limit(80)],
  ];
  if (hasProjects) q.push(
    ["projects", db.from("projects").select("*").order("position")],
    ["slots", db.from("project_slots").select("*").order("date").order("start_time")],
    ["crew", db.from("slot_people").select("*").order("position")],
    ["items", db.from("project_items").select("*").order("position")],
    ["debriefs", db.from("debriefs").select("*").order("id")],
    ["insights", db.from("insights").select("*").order("id")],
    ["replies", db.from("insight_replies").select("*").order("id")],
    ["points", db.from("shift_points").select("*").order("id")],
    ["briefs", db.from("briefs").select("*").order("id")],
  );
  if (hasFocus) q.push(
    ["focus", db.from("focus").select("*").order("created_at")],
    ["fupd", db.from("focus_updates").select("*").order("created_at")],
    ["ideas", db.from("ideas").select("*").order("created_at", { ascending: false })],
  );
  const res = await Promise.all(q.map(x => x[1]));
  const d = {};
  q.forEach((x, i) => d[x[0]] = res[i].data || []);

  people = d.people; downloads = d.downloads; logRows = d.log;
  if (hasProjects) {
    projects = d.projects; slots = d.slots; slotPeople = d.crew; projItems = d.items;
    debriefs = d.debriefs; insights = d.insights; replies = d.replies;
    shiftPoints = d.points; briefs = d.briefs;
  }
  if (hasFocus) {
    focusList = d.focus; focusUpd = d.fupd; ideaList = d.ideas;
  }
}

async function log(action) {
  await db.from("activity_log").insert({ actor: me?.name || "?", action });
}

let rtChannel = null, reloadTimer = null;
function subscribeRealtime() {
  if (rtChannel) return;
  rtChannel = db.channel("db-changes")
    .on("postgres_changes", { event: "*", schema: "public" }, () => {
      clearTimeout(reloadTimer);
      reloadTimer = setTimeout(async () => { await loadAll(); render(); }, 400);
    })
    .subscribe();
}
document.addEventListener("visibilitychange", async () => {
  if (!document.hidden && !views.app.classList.contains("hidden")) { await loadAll(); render(); }
});

async function refresh() { await loadAll(); render(); }

// Un tab per ogni progetto, tra Focus e Team.
function renderNav() {
  const items = [
    { id: "dd", label: "DD", ico: ICONS.dd },
    ...(hasFocus ? [{ id: "focus", label: "Focus", ico: ICONS.focus }] : []),
    ...projects.map(p => ({ id: "proj:" + p.id, label: p.name, emo: p.icon || "🎯" })),
    { id: "team", label: "Team", ico: ICONS.team },
    { id: "log", label: "Storico", ico: ICONS.log },
  ];
  const nav = $("#nav");
  nav.classList.toggle("many", items.length > 4);
  nav.innerHTML = items.map(it => `<button data-tab="${it.id}" class="${tab === it.id ? "active" : ""}">
      <span class="ico">${it.emo ? `<span class="emo">${esc(it.emo)}</span>` : it.ico}</span>${esc(it.label)}</button>`).join("");
  nav.querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      tab = b.dataset.tab;
      openFocusId = null;
      render();
    };
  });
}

function render() {
  let pr = null;
  if (tab.startsWith("proj:")) {
    pr = projectOf(tab.slice(5));
    if (!pr) tab = "dd"; // progetto archiviato o eliminato altrove
  }
  renderNav();
  $("#tab-title").textContent = pr ? (pr.full_name || pr.name) : TITLES[tab];
  const main = $("#main");
  if (pr) renderProject(main, pr);
  else if (tab === "dd") renderDD(main);
  else if (tab === "focus") renderFocus(main);
  else if (tab === "team") renderTeam(main);
  else renderLog(main);

  main.querySelectorAll("[data-pseg]").forEach(b => b.onclick = () => { pSeg = b.dataset.pseg; render(); });
  main.querySelectorAll("[data-fseg]").forEach(b => b.onclick = () => { fSeg = b.dataset.fseg; openFocusId = null; render(); });
}

// ── DD (Daily Download) ─────────────────────────────────────
function personSelect(selected, cls, id) {
  const opts = people.filter(p => p.active || p.id === selected)
    .map(p => `<option value="${p.id}" ${p.id === selected ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  return `<select class="${cls}" data-id="${id}">
    <option value="">— nessuno —</option>${opts}</select>`;
}

function ddCard(d) {
  const done = d.uploaded;
  const expanded = openDD.has(d.id);
  const summary = [
    d.preparer_id ? `Prepara: ${personName(d.preparer_id)}` : null,
    d.presenter_id ? `Facilita: ${personName(d.presenter_id)}` : null,
  ].filter(Boolean).join(" · ") || "tocca per i dettagli";
  return `<div class="card" data-id="${d.id}">
    <div class="row spread dd-summary" data-dd-toggle="${d.id}">
      <div>
        <div class="row" style="gap:8px">
          <h3>${esc(ddLabel(d))}</h3>
          ${hasAudience ? `<button class="aud-tag ${d.audience === "pz" ? "pz" : ""}" data-act="toggle-aud" data-id="${d.id}"
            title="Tocca per cambiare destinatari">${audienceLabel(d.audience)}</button>` : ""}
        </div>
        <div class="sub">${esc(summary)}</div>
      </div>
      <span class="badge ${done ? "done" : ""}">${done ? "Caricato" : "Da caricare"}</span>
    </div>
    ${!expanded ? "" : `
    <div class="field"><label>Chi lo prepara</label>${personSelect(d.preparer_id, "sel-preparer", d.id)}</div>
    <div class="field"><label>Chi lo facilita</label>${personSelect(d.presenter_id, "sel-presenter", d.id)}</div>
    ${d.manager ? `<div class="manager-line">👤 Manager presente: <strong>${esc(d.manager)}</strong></div>` : ""}
    ${d.notes ? `<div class="manager-line">📝 ${esc(d.notes)}</div>` : ""}
    <div class="row" style="margin-top:12px">
      <button class="toggle ${d.uploaded ? "on" : ""}" data-act="uploaded" data-id="${d.id}">
        ${d.uploaded ? "✓ Caricato" : "Da caricare"}</button>
      <span style="flex:1"></span>
      <button class="ghost small" data-act="ics" data-id="${d.id}">📅 Calendario</button>
      <button class="ghost small" data-act="edit-dd" data-id="${d.id}">Modifica</button>
    </div>`}
  </div>`;
}

function ddFormFields(d) {
  return `
    <div class="field"><label>Data *</label>
      <input type="date" name="date" value="${d?.date || todayStr()}" required></div>
    <div class="field"><label>Argomento (anche provvisorio) *</label>
      <input type="text" name="title" value="${esc(d?.title || "")}" placeholder="es. Novità del mese" required></div>
    ${!hasAudience ? "" : `
    <div class="field"><label>Destinatari</label>
      <select name="audience">
        <option value="all" ${d?.audience !== "pz" ? "selected" : ""}>All team</option>
        <option value="pz" ${d?.audience === "pz" ? "selected" : ""}>PZ solo</option>
      </select></div>`}
    <div class="field"><label>Chi lo prepara</label>
      <select name="preparer_id"><option value="">— da assegnare —</option>
        ${people.filter(p => p.active || p.id === d?.preparer_id).map(p =>
          `<option value="${p.id}" ${p.id === d?.preparer_id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}
      </select></div>
    <div class="field"><label>Chi lo facilita</label>
      <select name="presenter_id"><option value="">— da assegnare —</option>
        ${people.filter(p => p.active || p.id === d?.presenter_id).map(p =>
          `<option value="${p.id}" ${p.id === d?.presenter_id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}
      </select></div>
    <div class="field"><label>Manager presente</label>
      <input type="text" name="manager" value="${esc(d?.manager || "")}" placeholder="es. Verdi"></div>
    <div class="field"><label>Note / altri partecipanti</label>
      <input type="text" name="notes" value="${esc(d?.notes || "")}" placeholder="es. presente anche il team Genius"></div>`;
}

function renderDD(main) {
  const today = todayStr();
  const upcoming = downloads.filter(d => d.date >= today);
  const past = downloads.filter(d => d.date < today).reverse();

  const groups = [];
  for (const d of upcoming) {
    const g = groups[groups.length - 1];
    if (g && g.date === d.date) g.items.push(d);
    else groups.push({ date: d.date, items: [d] });
  }
  const calendar = groups.map(g => `
    <div class="date-head ${g.date === today ? "today" : ""}">
      ${g.date === today ? "Oggi · " : ""}${fmtDate(g.date)}</div>
    ${g.items.map(ddCard).join("")}`).join("");

  const pastHtml = past.length ? `
    <details class="past"><summary>Giorni passati (${past.length}) ▾</summary>
      ${past.map(d => `
        <div class="mini">
          <span class="badge ${d.uploaded ? "done" : ""}">${d.uploaded ? "✓" : "✗"}</span>
          <span class="sub">${fmtDateShort(d.date)} · ${esc(ddLabel(d))}</span>
          <button class="ghost small" data-act="edit-dd" data-id="${d.id}">Modifica</button>
        </div>`).join("")}
    </details>` : "";

  main.innerHTML = `
    <div class="section-head"><h2>Calendario</h2>
      <button class="small" id="add-dd">+ Nuovo DD</button></div>
    ${calendar || `<div class="empty">Nessun DD in programma.<br>Aggiungine uno con “+ Nuovo DD”.</div>`}
    ${pastHtml}`;

  $("#add-dd").onclick = () => openDialog("Nuovo DD", ddFormFields(null),
    async (fd) => {
      const row = {
        date: fd.get("date"),
        title: fd.get("title").trim(),
        ...(hasAudience ? { audience: fd.get("audience") } : {}),
        preparer_id: fd.get("preparer_id") || null,
        presenter_id: fd.get("presenter_id") || null,
        manager: fd.get("manager").trim() || null,
        notes: fd.get("notes").trim() || null,
      };
      const { error } = await db.from("downloads").insert(row);
      if (error) { toast("Errore nel salvataggio"); return; }
      await log(`ha creato il DD “${row.title}” del ${fmtDateShort(row.date)}${hasAudience ? ` (${audienceLabel(row.audience)})` : ""}`);
      await refresh();
    });

  main.querySelectorAll("[data-act=edit-dd]").forEach(b => {
    b.onclick = () => {
      const d = downloads.find(x => x.id === b.dataset.id);
      openDialog("Modifica DD", ddFormFields(d) + `
        <div class="row" style="margin-top:14px">
          <button type="button" class="danger small" id="dlg-delete">Elimina questo DD</button>
        </div>`,
        async (fd) => {
          const row = {
            date: fd.get("date"),
            title: fd.get("title").trim(),
            ...(hasAudience ? { audience: fd.get("audience") } : {}),
            preparer_id: fd.get("preparer_id") || null,
            presenter_id: fd.get("presenter_id") || null,
            manager: fd.get("manager").trim() || null,
            notes: fd.get("notes").trim() || null,
            updated_at: new Date().toISOString(),
          };
          const { error } = await db.from("downloads").update(row).eq("id", d.id);
          if (error) { toast("Errore nel salvataggio"); return; }
          await log(`ha modificato il DD “${row.title}” del ${fmtDateShort(row.date)}`);
          await refresh();
        },
        (form) => {
          form.querySelector("#dlg-delete").onclick = async () => {
            if (!confirm(`Eliminare “${ddLabel(d)}”?`)) return;
            await db.from("downloads").delete().eq("id", d.id);
            await log(`ha eliminato il DD “${ddLabel(d)}”`);
            $("#dlg").close();
            await refresh();
          };
        });
    };
  });

  main.querySelectorAll(".sel-preparer, .sel-presenter").forEach(sel => {
    sel.onchange = async () => {
      const field = sel.classList.contains("sel-preparer") ? "preparer_id" : "presenter_id";
      const d = downloads.find(x => x.id === sel.dataset.id);
      const val = sel.value || null;
      await db.from("downloads").update({ [field]: val, updated_at: new Date().toISOString() }).eq("id", d.id);
      await log(`ha assegnato ${field === "preparer_id" ? "la preparazione" : "la facilitazione"} di “${ddLabel(d)}” a ${val ? personName(val) : "nessuno"}`);
      await refresh();
    };
  });
  main.querySelectorAll("[data-dd-toggle]").forEach(el => {
    el.onclick = () => {
      const id = el.dataset.ddToggle;
      openDD.has(id) ? openDD.delete(id) : openDD.add(id);
      render();
    };
  });
  main.querySelectorAll("[data-act=toggle-aud]").forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation(); // non espandere/chiudere la scheda
      const d = downloads.find(x => x.id === b.dataset.id);
      const audience = d.audience === "pz" ? "all" : "pz";
      const { error } = await db.from("downloads").update({ audience, updated_at: new Date().toISOString() }).eq("id", d.id);
      if (error) { toast("Errore nel salvataggio"); return; }
      await log(`ha impostato “${ddLabel(d)}” per ${audienceLabel(audience)}`);
      await refresh();
    };
  });
  main.querySelectorAll("[data-act=ics]").forEach(b => {
    b.onclick = () => {
      const d = downloads.find(x => x.id === b.dataset.id);
      saveICS(ddToICS(d), `dd-${d.date}.ics`);
    };
  });
  main.querySelectorAll("[data-act=uploaded]").forEach(b => {
    b.onclick = async () => {
      const d = downloads.find(x => x.id === b.dataset.id);
      const val = !d.uploaded;
      await db.from("downloads").update({ uploaded: val, updated_at: new Date().toISOString() }).eq("id", d.id);
      await log(`ha segnato “${ddLabel(d)}” come ${val ? "caricato" : "da caricare"}`);
      await refresh();
    };
  });
}

// ── Focus Flow ──────────────────────────────────────────────
// Un focus è una cosa che portiamo avanti nel tempo. Un aggiornamento
// è un punto sulla scia: dove i punti smettono, il focus è fermo.
const WEEK_MS = 604800000;
const updOf = (fid) => focusUpd.filter(u => u.focus_id === fid);
const weeksSince = (iso) => Math.floor((Date.now() - new Date(iso).getTime()) / WEEK_MS);
function silenceOf(f) {
  const u = updOf(f.id);
  return weeksSince(u.length ? u[u.length - 1].created_at : f.created_at);
}
function focusState(f) {
  if (f.status === "concluso") return { k: "con", lab: "concluso" };
  if (f.status === "abbandonato") return { k: "abb", lab: "abbandonato" };
  const s = silenceOf(f);
  if (s >= 5) return { k: "fer", lab: "fermo" };
  if (s >= 2) return { k: "ral", lab: "rallentato" };
  return { k: "att", lab: "attivo" };
}
const FS_ORD = { fer: 0, ral: 1, att: 2, con: 3, abb: 4 };
const FS_COLOR = { att: "var(--accent)", ral: "var(--warn)", fer: "var(--danger)", con: "var(--ok)", abb: "var(--muted)" };
const focusSorted = () => focusList.slice().sort((a, b) =>
  (FS_ORD[focusState(a).k] - FS_ORD[focusState(b).k]) || (silenceOf(b) - silenceOf(a)));

function silenceText(f) {
  if (f.status !== "attivo") return f.status;
  const s = silenceOf(f);
  return s === 0 ? "aggiornato questa settimana"
    : s === 1 ? "1 settimana di silenzio" : `${s} settimane di silenzio`;
}
// dieci settimane: 0 la più vecchia, 9 questa
function stripHtml(f, color) {
  const idx = updOf(f.id).map(u => 9 - weeksSince(u.created_at)).filter(i => i >= 0 && i <= 9);
  const first = idx.length ? Math.min(...idx) : 99;
  const last = idx.length ? Math.max(...idx) : -1;
  let out = "";
  for (let i = 0; i <= 9; i++) {
    const cls = idx.includes(i) ? "on" : i < first ? "pre" : i > last ? "aft" : "";
    out += `<i class="${cls}"></i>`;
  }
  return `<span class="strip" style="--sc:${color}">${out}</span>`;
}

      <input type="text" name="outcome" value="${esc(f.outcome || "")}" placeholder="obbligatorio se lo chiudi o lo abbandoni"></div>` : ""}`,
    async (fd) => {
      const name = fd.get("name").trim();
      if (!name) { toast("Serve un nome"); return; }

        name,
        goal: fd.get("goal").trim() || null,
        indicator: fd.get("indicator").trim() || null,
        owner_id: fd.get("owner") || null,

      if (f) {
        row.status = fd.get("status");
        row.outcome = fd.get("outcome").trim() || null;
        if (row.status !== "attivo" && !row.outcome) { toast("Scrivi com'è andata a finire"); return; }

        if (error) { toast("Errore nel salvataggio"); return; }
        await log(`ha aperto il focus “${name}”`);
        openFocusId = data.id;
      }
      await refresh();

// Ogni progetto attivo è un tab a sé. Dentro, l'unità di lavoro è
// il gruppo che copre un turno: il brief e il debrief sono suoi.
const ROLES = ["Specialist", "Point", "Keyrole", "Coach", "Brief/Debrief"];
const KINDS = ["osservazione", "idea", "problema", "domanda"];
// Le due liste del debrief: si scrivono, una riga alla volta.
const LISTE = [
  { k: "good", titolo: "✅ Cose positive", ph: "es. il Point ha portato le persone al tavolo" },
  { k: "bad",  titolo: "⚠️ Sfide", ph: "es. troppo rumore vicino alla cassa" },
];
const lista = (k) => LISTE.find(x => x.k === k) || LISTE[0];
// I numeri del gruppo, sommati sui debrief di quel turno
function numeriDi(slotId) {
  const dbs = debriefsOf(slotId);
  const somma = (k) => {
    const v = dbs.filter(d => d[k] != null);
    return v.length ? v.reduce((a, d) => a + d[k], 0) : null;
  };
  return { conn: somma("reached"), conv: somma("conversions"), quanti: dbs.length };
}

const projectOf = (id) => projects.find(p => p.id === id) || null;
const itemsOf = (pr, kind) => projItems
  .filter(i => i.project_id === pr.id && i.kind === kind && i.active)
  .sort((a, b) => a.position - b.position);
const slotsOf = (pr) => slots.filter(s => s.project_id === pr.id)
  .sort((a, b) => (a.date + (a.start_time || "")).localeCompare(b.date + (b.start_time || "")));
const crewOf = (slotId) => slotPeople.filter(x => x.slot_id === slotId).sort((a, b) => a.position - b.position);
const roleNames = (slotId, role) => crewOf(slotId).filter(x => x.role === role).map(x => x.person_name);
const debriefsOf = (slotId) => debriefs.filter(d => d.slot_id === slotId);
const pointsOf = (slotId, kind) => shiftPoints.filter(x => x.slot_id === slotId && x.kind === kind);
const briefsOf = (slotId) => briefs.filter(b => b.slot_id === slotId);
const projDebriefs = (pr) => debriefs.filter(d => d.project_id === pr.id);
const repliesOf = (insightId) => replies.filter(r => r.insight_id === insightId);

// Il nome del gruppo sono gli specialist: è così che li chiamate.
const groupName = (s) => roleNames(s.id, "Specialist").join(", ") || "Gruppo da assegnare";
const slotHours = (s) => s.start_time ? `${s.start_time}–${s.end_time || ""}`.replace(/–$/, "") : "";
const slotOf = (id) => slots.find(s => s.id === id) || null;
const daysFromToday = (d) => Math.round((new Date(d + "T00:00:00") - new Date(todayStr() + "T00:00:00")) / 86400000);
const projPeriod = (pr) => pr.starts_on ? `${fmtDateShort(pr.starts_on)} – ${fmtDateShort(pr.ends_on)}` : "";

function slotState(s) {
  if (debriefsOf(s.id).length) return { cls: "done", label: "Debriefato" };
  const t = todayStr();
  if (s.date < t) return { cls: "", label: "Da debriefare" };
  return { cls: "soft", label: s.date === t ? "Oggi" : "In programma" };
}

// ── Turni ───────────────────────────────────────────────────
function renderProjectTurni(main, pr, seg) {
  const list = slotsOf(pr), today = todayStr();
  const oggi = list.filter(s => s.date === today);
  const nTodo = list.filter(s => s.date < today && !debriefsOf(s.id).length).length;

  const groups = [];
  list.forEach(s => {
    const g = groups[groups.length - 1];
    if (g && g.date === s.date) g.items.push(s);
    else groups.push({ date: s.date, items: [s] });
  });
  const cal = groups.map(g => `
    <div class="date-head ${g.date === today ? "today" : ""}">
      ${g.date === today ? "Oggi · " : ""}${fmtDate(g.date)}</div>
    ${g.items.map(s => slotCard(pr, s)).join("")}`).join("");

  const sottotitolo = oggi.length
    ? `Oggi: ${oggi.map(groupName).join(" · ")}`
    : nTodo ? `${nTodo} ${nTodo === 1 ? "gruppo" : "gruppi"} senza debrief`
    : projPeriod(pr);

  main.innerHTML = seg + `
    <div class="menu2">
      <button type="button" class="big" id="go-brief"><span>📋</span>Brief</button>
      <button type="button" class="big" id="go-debrief"><span>📝</span>Debrief</button>
    </div>
    <div class="sub menu2-sub">${esc(sottotitolo)}</div>

    <div class="section-head" style="margin-top:20px"><h2>Turni</h2>
      <button class="small ghost" id="add-slot">+ Turno</button></div>
    ${cal || `<div class="empty">Nessun turno ancora.<br>Aggiungine uno con “+ Turno”.</div>`}`;

  $("#go-brief").onclick = () => pickGroup(pr, "Brief di quale gruppo?", s => openBriefDialog(pr, s));
  $("#go-debrief").onclick = () => pickGroup(pr, "Debrief di quale gruppo?", s => openDebriefDialog(pr, s));

  $("#add-slot").onclick = () => openDialog("Nuovo turno", slotFields(pr, null),
    async (fd) => {
      const { data, error } = await db.from("project_slots").insert({
        project_id: pr.id,
        date: fd.get("date"),
        start_time: fd.get("start_time") || null,
        end_time: fd.get("end_time") || null,
        note: (fd.get("note") || "").trim() || null,
      }).select().single();
      if (error) { toast("Errore nel salvataggio"); return false; }
      await saveCrew(data.id, fd);
      await log(`ha aggiunto un turno ${pr.name} del ${fmtDateShort(data.date)}`);
      await refresh();
    });

  main.querySelectorAll("[data-slot-toggle]").forEach(el => {
    el.onclick = () => {
      const id = el.dataset.slotToggle;
      openSlot.has(id) ? openSlot.delete(id) : openSlot.add(id);
      render();
    };
  });
  main.querySelectorAll("[data-act=brief]").forEach(b => {
    b.onclick = () => openBriefDialog(pr, slotOf(b.dataset.id));
  });
  main.querySelectorAll("[data-act=debrief]").forEach(b => {
    b.onclick = () => openDebriefDialog(pr, slotOf(b.dataset.id));
  });
  main.querySelectorAll("[data-act=add-point]").forEach(b => {
    b.onclick = () => openPointDialog(slotOf(b.dataset.id), b.dataset.kind);
  });

    b.onclick = () => {

      openDialog("Modifica turno", slotFields(pr, s) + `
        <div class="row" style="margin-top:14px">

        async (fd) => {

          }).eq("id", s.id);

          await saveCrew(s.id, fd);
          await log(`ha modificato il turno ${pr.name} del ${fmtDateShort(s.date)}`);
          await refresh();

        (form) => {
          form.querySelector("#dlg-del-slot").onclick = async () => {
            if (!confirm(`Eliminare il turno di ${groupName(s)} del ${fmtDateShort(s.date)}?`)) return;
            await db.from("project_slots").delete().eq("id", s.id);
            await log(`ha eliminato il turno ${pr.name} del ${fmtDateShort(s.date)}`);

            await refresh();

}

function slotCard(pr, s) {

  const point = roleNames(s.id, "Point");

    ? `<div class="row" style="gap:10px;margin-top:8px">
         <span class="pt-count conn">👥 ${n.conn ?? "–"} connessioni</span>
         <span class="pt-count conv">🛍 ${n.conv ?? "–"} conversion</span>
       </div>` : "";

    <div class="row spread dd-summary slot-head" data-slot-toggle="${s.id}">
      <div style="min-width:0">
        <h3>${esc(groupName(s))}</h3>
        <div class="sub">${esc(sotto)}</div>
        ${riepilogo}
      </div>
      <span class="badge ${st.cls}">${esc(st.label)}</span>

      ${ROLES.filter(r => r !== "Specialist").map(r => {
        const n = roleNames(s.id, r);
        return n.length ? `<div class="role-line"><b>${esc(r)}</b><span>${esc(n.join(", "))}</span></div>` : "";
      }).join("")}

      ${bfs.length ? `<div class="manager-line">📋 Brief fatto da ${esc(bfs.map(b => b.person_name).join(", "))}</div>` : ""}

      ${riusciteDi(s, "icebreaker", "🗣 Frasi più riuscite")}
      ${pointBlock(s, "good", good)}

      <div class="row" style="margin-top:14px">
        <button class="ghost small" data-act="brief" data-id="${s.id}">📋 Brief</button>
        <button class="small" data-act="debrief" data-id="${s.id}">📝 Debrief</button>

        <button class="ghost small" data-act="edit-slot" data-id="${s.id}">Modifica</button>
      </div>`}
  </div>`;
}

// Le demo e le frasi più riuscite: testo libero del debrief. Le demo
// registrate prima, quando si sceglievano da un elenco, restano qui.
function riusciteDi(s, campo, titolo) {
  const righe = debriefsOf(s.id).map(d => (d[campo] || "").trim()).filter(Boolean);
  if (campo === "best_demo") righe.push(...pointsOf(s.id, "demo").map(p => p.text));
  if (!righe.length) return "";
  return `<div class="db-line" style="margin-top:10px">${titolo}: <b>${esc(righe.join(" · "))}</b></div>`;
}

function pointBlock(s, kind, list) {
  return `<div class="pt-block">
    <div class="pt-head">${lista(kind).titolo}
      <button class="ghost small" data-act="add-point" data-kind="${kind}" data-id="${s.id}">+</button></div>

}

function debriefNumbers(d) {
  const nums = [
    d.reached != null ? `👥 ${d.reached} connessioni` : null,
    d.conversions != null ? `🛍 ${d.conversions} conversion` : null,
  ].filter(Boolean);
  if (!nums.length) return "";
  return `<div class="db-item">
    <div class="row spread"><strong>${esc(d.author_name)}</strong>
      <span class="sub">${fmtTs(d.created_at)}</span></div>
    <div class="db-nums">${nums.map(n => `<span>${esc(n)}</span>`).join("")}</div>
  </div>`;
}

// ── Scegliere il gruppo ─────────────────────────────────────
// Se c'è un solo turno oggi si salta il passaggio: è quasi sempre quello.
function pickGroup(pr, titolo, onPick) {
  const list = slotsOf(pr);
  if (!list.length) { toast("Nessun turno: aggiungine uno"); return; }
  const oggi = list.filter(s => s.date === todayStr());
  if (oggi.length === 1) return onPick(oggi[0]);

  const vicini = list.slice().sort((a, b) =>
    Math.abs(daysFromToday(a.date)) - Math.abs(daysFromToday(b.date)) ||
    (a.start_time || "").localeCompare(b.start_time || ""));

  openDialog(titolo, `<div class="pick-list">${vicini.map(s => {
      const d = daysFromToday(s.date);
      const quando = d === 0 ? "oggi" : d === -1 ? "ieri" : d === 1 ? "domani" : fmtDateShort(s.date);
      return `<button type="button" class="pick" data-pick="${s.id}">
        <span class="pick-name">${esc(groupName(s))}</span>
        <span class="pick-meta">${esc(quando)} · ${esc(slotHours(s))}</span>
      </button>`;
    }).join("")}</div>`,
    null,
    (form) => {
      form.querySelector("button[type=submit]").style.display = "none";
      form.querySelectorAll("[data-pick]").forEach(b => {
        b.onclick = () => { $("#dlg").close(); onPick(slotOf(b.dataset.pick)); };
      });
    });
}

function pointField(name, label, placeholder) {
  return `<div class="field pl-field"><label>${label}</label>
    <div class="add-row">
      <input type="text" class="pl-in" placeholder="${placeholder}" autocomplete="off">
      <button type="button" class="pl-add">+</button>
    </div>
    <div class="pl-items"></div>
    <input type="hidden" name="${name}" value="[]">
  </div>`;
}

function wirePointFields(form) {
  form.querySelectorAll(".pl-field").forEach(box => {
    const input = box.querySelector(".pl-in");
    const hidden = box.querySelector("input[type=hidden]");
    const items = box.querySelector(".pl-items");
    const draw = () => {
      const list = JSON.parse(hidden.value || "[]");
      items.innerHTML = list.map((t, i) => `<div class="pl-item"><span>${esc(t)}</span>
        <button type="button" class="pt-x" data-i="${i}">×</button></div>`).join("");
      items.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
        const l = JSON.parse(hidden.value || "[]");
        l.splice(Number(b.dataset.i), 1);
        hidden.value = JSON.stringify(l);
        draw();
      });
    };
    const add = () => {
      const t = input.value.trim();
      if (!t) return;
      const l = JSON.parse(hidden.value || "[]");
      l.push(t);
      hidden.value = JSON.stringify(l);
      input.value = "";
      draw();
      input.focus();
    };
    box.querySelector(".pl-add").onclick = add;
    input.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } };
  });
}

async function saveCrew(slotId, fd) {
  await db.from("slot_people").delete().eq("slot_id", slotId);
  const rows = [];
  ROLES.forEach(r => (fd.get("role_" + r) || "").split(",").map(x => x.trim()).filter(Boolean)
    .forEach((nm, i) => rows.push({
      slot_id: slotId, role: r, person_name: nm,
      person_id: people.find(p => p.name === nm)?.id || null, position: i,
    })));
  if (rows.length) await db.from("slot_people").insert(rows);
}

function chipRow(name, values, current, multi) {
  const sel = multi ? (current || []) : (current ? [current] : []);
  return `<div class="chips" data-chips="${name}" data-multi="${multi ? 1 : 0}">
    ${values.map(v => `<button type="button" class="fchip" data-v="${esc(v)}"
        aria-pressed="${sel.includes(v)}">${esc(v)}</button>`).join("")}
    <input type="hidden" name="${name}" value="${esc(multi ? JSON.stringify(sel) : (current || ""))}">
  </div>`;
}

function wireChips(form) {
  form.querySelectorAll("[data-chips]").forEach(box => {
    const hidden = box.querySelector("input[type=hidden]");
    const multi = box.dataset.multi === "1";
    box.querySelectorAll("button[data-v]").forEach(b => {
      b.onclick = () => {
        if (multi) {
          const cur = JSON.parse(hidden.value || "[]");
          const i = cur.indexOf(b.dataset.v);
          if (i < 0) cur.push(b.dataset.v); else cur.splice(i, 1);
          hidden.value = JSON.stringify(cur);
          b.setAttribute("aria-pressed", i < 0);
        } else {
          const on = b.getAttribute("aria-pressed") === "true";
          box.querySelectorAll("button[data-v]").forEach(x => x.setAttribute("aria-pressed", "false"));
          b.setAttribute("aria-pressed", !on);
          hidden.value = on ? "" : b.dataset.v;
        }
      };
    });
  });
}

// ── Spunti ──────────────────────────────────────────────────
function renderProjectSpunti(main, pr, seg) {
  const ids = new Set(slotsOf(pr).map(s => s.id));
  const dbs = projDebriefs(pr);
  const somma = (k) => dbs.reduce((a, d) => a + (d[k] || 0), 0);
  const conDebrief = new Set(dbs.map(d => d.slot_id)).size;

  const punti = shiftPoints.filter(x => ids.has(x.slot_id));
  const good = punti.filter(x => x.kind === "good").slice().reverse();
  const bad = punti.filter(x => x.kind === "bad").slice().reverse();
  const riga = (pt) => {
    const s = slotOf(pt.slot_id);
    return `<div class="pt-row big">
      <span>${esc(pt.text)}
        <em>${s ? esc(groupName(s)) + " · " + esc(fmtDateShort(s.date)) : ""}</em></span>
    </div>`;
  };

  // le demo e le frasi più riuscite, dai campi liberi del debrief
  const riuscite = (campo) => {
    const out = dbs.filter(d => (d[campo] || "").trim())
      .map(d => ({ text: d[campo].trim(), slot_id: d.slot_id, id: d.id }));
    if (campo === "best_demo") out.push(...punti.filter(x => x.kind === "demo"));
    return out.reverse();
  };
  const demoTop = riuscite("best_demo"), frasiTop = riuscite("icebreaker");

  // gli elenchi lunghi restano corti finché non li apri
  const LIMITE = 10;
  const elenco = (list, kind) => {
    const visibili = tuttiPunti[kind] ? list : list.slice(0, LIMITE);
    return `<div class="card" style="padding:6px 12px">${visibili.map(riga).join("")}</div>
      ${list.length > LIMITE ? `<button class="ghost small" data-tutti="${kind}" style="margin:2px 2px 4px">${
        tuttiPunti[kind] ? "Mostra meno" : `Vedi tutti e ${list.length}`}</button>` : ""}`;
  };

  const spunti = insights.filter(i => i.project_id === pr.id)
    .sort((a, b) => (a.resolved - b.resolved) || (b.id - a.id));

  main.innerHTML = seg + `
    <div class="stats">
      <div class="stat"><b>${conDebrief}</b><span>Gruppi</span></div>
      <div class="stat"><b>${somma("reached")}</b><span>Connessioni</span></div>
      <div class="stat"><b>${somma("conversions")}</b><span>Conversion</span></div>
    </div>

    <div class="area-head"><span>✅ Cose positive</span><span class="ac">${good.length}</span></div>
    ${good.length ? elenco(good, "good") : `<div class="empty">Ancora niente: esce dai debrief.</div>`}

    <div class="area-head"><span>⚠️ Sfide</span><span class="ac">${bad.length}</span></div>
    ${bad.length ? elenco(bad, "bad") : ""}

    ${demoTop.length ? `<div class="area-head"><span>💡 Demo più riuscite</span><span class="ac">${demoTop.length}</span></div>
      <div class="card" style="padding:6px 12px">${demoTop.map(riga).join("")}</div>` : ""}

    ${frasiTop.length ? `<div class="area-head"><span>🗣 Frasi più riuscite</span><span class="ac">${frasiTop.length}</span></div>
      <div class="card" style="padding:6px 12px">${frasiTop.map(riga).join("")}</div>` : ""}

    <div class="section-head" style="margin-top:22px"><h2>Spunti liberi</h2>
      <button class="small" id="add-insight">+ Spunto</button></div>
    ${spunti.length ? spunti.map(insightCard).join("")
      : `<div class="empty">Niente per ora.</div>`}`;

  main.querySelectorAll("[data-tutti]").forEach(b => {
    b.onclick = () => { tuttiPunti[b.dataset.tutti] = !tuttiPunti[b.dataset.tutti]; render(); };
  });

  $("#add-insight").onclick = () => openDialog("Nuovo spunto", `
      <div class="field"><label>Che tipo è</label>${chipRow("kind", KINDS, "osservazione", false)}</div>
      <div class="field"><label>Lo spunto</label>
        <textarea name="text" rows="3" required placeholder="es. col cliente indeciso funziona partire dalla fotocamera"></textarea></div>`,
    async (fd) => {
      const text = (fd.get("text") || "").trim();
      if (text.length < 3) { toast("Scrivi lo spunto"); return false; }
      const { error } = await db.from("insights").insert({
        project_id: pr.id, kind: fd.get("kind") || "osservazione", text,
        author_id: me.id, author_name: me.name,
      });
      if (error) { toast("Errore nel salvataggio"); return false; }
      await log(`ha aggiunto uno spunto a ${pr.name}: ${text.slice(0, 60)}`);
      toast("Spunto salvato");
      await refresh();
    }, wireChips);

  main.querySelectorAll("[data-act=reply]").forEach(b => {
    b.onclick = () => {
      const i = insights.find(x => x.id === Number(b.dataset.id));
      openDialog("Rispondi", `
        <p class="sub">${esc(i.text)}</p>
        <div class="field"><label>La tua risposta</label>
          <textarea name="text" rows="3" required></textarea></div>`,
        async (fd) => {
          const text = (fd.get("text") || "").trim();
          if (text.length < 2) { toast("Scrivi la risposta"); return false; }
          const { error } = await db.from("insight_replies").insert({
            insight_id: i.id, text, author_id: me.id, author_name: me.name,
          });
          if (error) { toast("Errore nel salvataggio"); return false; }
          await refresh();
        });
    };
  });
  main.querySelectorAll("[data-act=resolve]").forEach(b => {
    b.onclick = async () => {
      const i = insights.find(x => x.id === Number(b.dataset.id));
      const { error } = await db.from("insights").update({ resolved: !i.resolved }).eq("id", i.id);
      if (error) { toast("Errore nel salvataggio"); return; }
      await refresh();
    };
  });
  main.querySelectorAll("[data-act=del-insight]").forEach(b => {
    b.onclick = async () => {
      if (!confirm("Eliminare questo spunto?")) return;
      await db.from("insights").delete().eq("id", Number(b.dataset.id));
      await refresh();
    };
  });
}

      <button class="ghost small" data-act="reply" data-id="${i.id}">Rispondi</button>
      ${i.kind === "domanda" ? `<button class="ghost small" data-act="resolve" data-id="${i.id}">${
        i.resolved ? "↩︎ Riapri" : "✓ Chiudi"}</button>` : ""}
      <span style="flex:1"></span>
      ${i.author_name === me?.name
        ? `<button class="danger small" data-act="del-insight" data-id="${i.id}">Elimina</button>` : ""}
    </div>
  </div>`;
}

// ── Dialog generico ─────────────────────────────────────────
function openDialog(title, fieldsHtml, onSubmit, onOpen) {
  const dlg = $("#dlg"), form = $("#dlg-form");
  form.innerHTML = `<h3>${title}</h3>${fieldsHtml}
    <div class="dialog-actions">
      <button type="button" class="ghost" id="dlg-cancel">Annulla</button>
      <button type="submit">Salva</button>
    </div>`;
  form.onsubmit = async (e) => {
    e.preventDefault();
    // chi gestisce il salvataggio può restituire false per tenere
    // aperto il foglio senza far perdere quello che è stato scritto
    if (onSubmit && await onSubmit(new FormData(form)) === false) return;
    dlg.close();
  };
  form.querySelector("#dlg-cancel").onclick = () => dlg.close();
  if (onOpen) onOpen(form);
  dlg.showModal();
}

// ── Avvio ───────────────────────────────────────────────────
const { data: { session } } = await db.auth.getSession();
if (session) { await start(); } else { show("login"); }
</script>
