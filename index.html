<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Store Tasks</title>
<style>
  :root {
    --bg: #f2f3f8;
    --card: #ffffff;
    --glass: rgba(255, 255, 255, .58);
    --glass-line: rgba(255, 255, 255, .75);
    --text: #14172b;
    --muted: #6b7085;
    --line: #e3e5ee;
    --accent: #3b5bfd;
    --accent-soft: #e8ecff;
    --ok: #1fa36b;
    --ok-soft: #e2f6ec;
    --warn: #c77b12;
    --warn-soft: #fcefdc;
    --danger: #d33f49;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(20, 23, 43, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1220;
      --card: #191d31;
      --glass: rgba(25, 29, 49, .55);
      --glass-line: rgba(255, 255, 255, .10);
      --text: #eceef7;
      --muted: #9aa0b8;
      --line: #2a2f4a;
      --accent: #7d92ff;
      --accent-soft: #232a4d;
      --ok: #3ecf8e;
      --ok-soft: #163a2c;
      --warn: #e8a13c;
      --warn-soft: #3d2f14;
      --danger: #ff6b74;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100dvh;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--glass);
    -webkit-backdrop-filter: blur(22px) saturate(1.8);
    backdrop-filter: blur(22px) saturate(1.8);
    padding: calc(12px + env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--glass-line);
  }
  header h1 { font-size: 1.15rem; letter-spacing: -.01em; }
  #whoami-chip {
    font-size: .85rem; color: var(--accent); background: var(--accent-soft);
    border: none; border-radius: 999px; padding: 6px 12px; font-weight: 600;
  }
  main { padding: 14px 14px 20px; max-width: 640px; margin: 0 auto; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(20, 23, 43, .04);
  }
  .card h3 { font-size: 1.02rem; margin-bottom: 2px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: .82rem; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .spread { justify-content: space-between; }
  .field { margin-top: 10px; }
  .field label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
  select, input[type=text], input[type=date], input[type=password] {
    width: 100%; padding: 11px 12px; font-size: 1rem;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg); color: var(--text);
    -webkit-appearance: none; appearance: none;
  }
  button {
    font-family: inherit; font-size: .95rem; font-weight: 600;
    border: none; border-radius: 12px; padding: 11px 16px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.ghost { background: var(--accent-soft); color: var(--accent); }
  button.small { padding: 7px 12px; font-size: .85rem; }
  button.danger { background: transparent; color: var(--danger); padding: 7px 8px; }
  button:disabled { opacity: .5; }
  .toggle {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 999px; font-size: .85rem; font-weight: 600;
    background: var(--warn-soft); color: var(--warn); cursor: pointer; border: none;
  }
  .toggle.on { background: var(--ok-soft); color: var(--ok); }
  .badge {
    font-size: .75rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    background: var(--warn-soft); color: var(--warn);
  }
  .badge.done { background: var(--ok-soft); color: var(--ok); }
  .dd-summary { cursor: pointer; }
  .role-tag {
    font-size: .7rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .04em; cursor: pointer; border: none;
    background: var(--accent-soft); color: var(--accent);
  }
  .role-tag.pro { background: rgba(168, 85, 247, .16); color: #8b3fd4; }
  .aud-tag {
    font-size: .68rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
    background: rgba(16, 185, 129, .16); color: #0d9668;
    border: none; cursor: pointer;
  }
  .aud-tag.pz { background: rgba(245, 158, 11, .18); color: #b8730a; }
  @media (prefers-color-scheme: dark) {
    .role-tag.pro { color: #c78dff; }
    .aud-tag { color: #34d399; }
    .aud-tag.pz { color: #fbbf24; }
  }
  .manager-line {
    margin-top: 10px; font-size: .85rem; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .date-head {
    margin: 18px 4px 8px; font-size: .82rem; font-weight: 700;
    color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
  }
  .date-head.today { color: var(--accent); }
  .mini {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 11px 14px; margin-bottom: 8px;
  }
  .mini .sub { flex: 1; }
  details.past { margin-top: 18px; }
  details.past summary {
    cursor: pointer; color: var(--muted); font-size: .85rem; font-weight: 600;
    padding: 8px 2px; list-style: none;
  }
  nav {
    position: fixed; z-index: 10;
    left: max(12px, env(safe-area-inset-left));
    right: max(12px, env(safe-area-inset-right));
    bottom: calc(12px + env(safe-area-inset-bottom));
    display: flex;
    background: var(--glass);
    -webkit-backdrop-filter: blur(24px) saturate(1.8);
    backdrop-filter: blur(24px) saturate(1.8);
    border: 1px solid var(--glass-line);
    border-radius: 32px;
    box-shadow: var(--shadow);
    padding: 6px;
    max-width: 500px; margin: 0 auto;
  }
  nav button {
    flex: 1; background: none; color: var(--muted); border-radius: 24px;
    padding: 7px 0 6px; font-size: .68rem; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  nav button .ico {
    display: flex; align-items: center; justify-content: center;
    width: 46px; height: 28px; border-radius: 999px;
    transition: background .2s;
  }
  nav button .ico svg { width: 21px; height: 21px; }
  nav button.active { color: var(--accent); }
  nav button.active .ico { background: var(--accent-soft); }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: .9rem; }
  .empty-big { text-align: center; color: var(--muted); padding: 90px 24px 30px; }
  .empty-big .glyph { font-size: 2.6rem; margin-bottom: 12px; }
  .empty-big h2 { color: var(--text); font-size: 1.1rem; margin-bottom: 6px; }
  .section-head { display: flex; justify-content: space-between; align-items: center; margin: 6px 2px 12px; }
  .section-head h2 { font-size: 1.05rem; letter-spacing: -.01em; }
  dialog {
    border: none; border-radius: 20px; background: var(--card); color: var(--text);
    width: min(92vw, 420px); padding: 18px;
    box-shadow: var(--shadow);
  }
  dialog::backdrop {
    background: rgba(10, 12, 25, .35);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  dialog h3 { margin-bottom: 4px; }
  .dialog-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  #toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(96px + env(safe-area-inset-bottom));
    background: var(--text); color: var(--bg); padding: 10px 18px;
    border-radius: 999px; font-size: .85rem; opacity: 0; transition: opacity .25s;
    pointer-events: none; z-index: 50; max-width: 88vw; text-align: center;
  }
  #toast.show { opacity: 1; }
  .login-wrap {
    min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .login-box { width: min(92vw, 380px); text-align: center; }
  .login-box .logo { font-size: 3rem; margin-bottom: 8px; }
  .login-box h1 { margin-bottom: 4px; }
  .login-box p { color: var(--muted); font-size: .9rem; margin-bottom: 20px; }
  .login-box form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .who-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; max-height: 45dvh; overflow-y: auto; }
  .who-list button { background: var(--card); color: var(--text); border: 1px solid var(--line); text-align: left; }
  .log-item { padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: .85rem; }
  .log-item:last-child { border-bottom: none; }
  .log-item .sub { margin-top: 2px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="view-login" class="login-wrap hidden">
  <div class="login-box">
    <div class="logo">🏬</div>
    <h1>Store Tasks</h1>
    <p>Inserisci la password del team per entrare.</p>
    <form id="login-form">
      <input type="password" id="login-password" placeholder="Password del team" autocomplete="current-password" required>
      <button type="submit" id="login-btn">Entra</button>
    </form>
  </div>
</div>

<div id="view-whoami" class="login-wrap hidden">
  <div class="login-box">
    <div class="logo">👋</div>
    <h1>Chi sei?</h1>
    <p>Scegli il tuo nome: le attività che gestisci verranno registrate a tuo nome.</p>
    <div class="who-list" id="who-list"></div>
  </div>
</div>

<div id="view-app" class="hidden">
  <header>
    <h1 id="tab-title">Daily Download</h1>
    <button id="whoami-chip" title="Cambia utente"></button>
  </header>
  <main id="main"></main>
  <nav>
    <button data-tab="dd" class="active">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="4.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
      DD</button>
    <button data-tab="validation">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.4l2.4 2.4 4.6-5"/></svg></span>
      Validation</button>
    <button data-tab="team">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.4"/><path d="M3.2 19.3c.8-3.1 3.1-4.7 5.8-4.7s5 1.6 5.8 4.7"/><circle cx="16.8" cy="9.8" r="2.6"/><path d="M15.6 14.7c2.3.2 4.2 1.6 4.9 4"/></svg></span>
      Team</button>
    <button data-tab="log">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3.2 2"/></svg></span>
      Storico</button>
  </nav>
</div>

<div id="toast"></div>

<dialog id="dlg">
  <form method="dialog" id="dlg-form"></form>
</dialog>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// ── Configurazione ──────────────────────────────────────────
const SUPABASE_URL = "https://nrxnmucuwucfecnphrtf.supabase.co";
const SUPABASE_KEY = "sb_publishable_OJnekj88Hcc4zCXVo8k9Uw_oSlwAmXm";
const SHARED_EMAIL = "marcocasati+storetasks@gmail.com"; // utente condiviso in Supabase Auth

const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// ── Stato ───────────────────────────────────────────────────
let people = [], downloads = [], logRows = [];
let tab = "dd";
let me = JSON.parse(localStorage.getItem("whoami") || "null");
let openDD = new Set(); // schede DD espanse
let hasAudience = false; // il tag destinatari appare solo se la colonna esiste

const $ = (s) => document.querySelector(s);
const views = { login: $("#view-login"), whoami: $("#view-whoami"), app: $("#view-app") };
function show(name) {
  Object.entries(views).forEach(([k, el]) => el.classList.toggle("hidden", k !== name));
}
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
}
const esc = (s) => (s ?? "").toString().replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const fmtDate = (d) => d ? new Date(d + "T00:00:00").toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" }) : "—";
const fmtDateShort = (d) => d ? new Date(d + "T00:00:00").toLocaleDateString("it-IT", { day: "numeric", month: "short" }) : "—";
const fmtTs = (ts) => new Date(ts).toLocaleString("it-IT", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const personName = (id) => people.find(p => p.id === id)?.name || "—";
const ddLabel = (d) => d.title || `DD del ${fmtDateShort(d.date)}`;
const audienceLabel = (a) => a === "pz" ? "PZ solo" : "All team";

// Evento .ics per aggiungere il DD al proprio calendario (promemoria ore 9:00)
function ddToICS(d) {
  const icsEsc = (s) => (s ?? "").toString()
    .replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  const day = d.date.replace(/-/g, "");
  const next = new Date(d.date + "T00:00:00");
  next.setDate(next.getDate() + 1);
  const dayEnd = `${next.getFullYear()}${String(next.getMonth()+1).padStart(2,"0")}${String(next.getDate()).padStart(2,"0")}`;
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const details = [
    hasAudience ? `Destinatari: ${audienceLabel(d.audience)}` : null,
    d.preparer_id ? `Prepara: ${personName(d.preparer_id)}` : null,
    d.presenter_id ? `Facilita: ${personName(d.presenter_id)}` : null,
    d.manager ? `Manager presente: ${d.manager}` : null,
    d.notes ? `Note: ${d.notes}` : null,
  ].filter(Boolean).join("\n");
  return [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Store Tasks//IT",
    "BEGIN:VEVENT",
    `UID:dd-${d.id}@store-tasks`,
    `DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${day}`,
    `DTEND;VALUE=DATE:${dayEnd}`,
    `SUMMARY:${icsEsc("DD: " + ddLabel(d))}`,
    details ? `DESCRIPTION:${icsEsc(details)}` : null,
    "BEGIN:VALARM",
    "ACTION:DISPLAY",
    `DESCRIPTION:${icsEsc("Tra 5 giorni DD: " + ddLabel(d))}`,
    "TRIGGER;RELATED=START:-P4DT15H",
    "END:VALARM",
    "END:VEVENT",
    "END:VCALENDAR",
  ].filter(Boolean).join("\r\n");
}

function downloadICS(d) {
  const blob = new Blob([ddToICS(d)], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `dd-${d.date}.ics`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  toast("Evento creato: aprilo per salvarlo in Calendario");
}

// ── Login ───────────────────────────────────────────────────
$("#login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("#login-btn");
  btn.disabled = true; btn.textContent = "Accesso…";
  const { error } = await db.auth.signInWithPassword({
    email: SHARED_EMAIL, password: $("#login-password").value,
  });
  btn.disabled = false; btn.textContent = "Entra";
  if (error) { toast("Password errata"); return; }
  await start();
});

$("#whoami-chip").addEventListener("click", () => {
  if (confirm("Vuoi cambiare nome utente?")) {
    localStorage.removeItem("whoami"); me = null;
    showWhoami();
  }
});

async function start() {
  await detectSchema();
  await loadAll();
  if (!me || !people.find(p => p.id === me.id)) { showWhoami(); return; }
  enterApp();
}

function showWhoami() {
  show("whoami");
  const list = $("#who-list");
  list.innerHTML = "";
  people.filter(p => p.active).forEach(p => {
    const b = document.createElement("button");
    b.textContent = p.name;
    b.onclick = () => { me = { id: p.id, name: p.name }; localStorage.setItem("whoami", JSON.stringify(me)); enterApp(); };
    list.appendChild(b);
  });
}

function enterApp() {
  $("#whoami-chip").textContent = me.name;
  show("app");
  render();
  subscribeRealtime();
}

// ── Dati ────────────────────────────────────────────────────
async function detectSchema() {
  const { error } = await db.from("downloads").select("audience").limit(1);
  hasAudience = !error;
}

async function loadAll() {
  const [p, d, l] = await Promise.all([
    db.from("people").select("*").order("name"),
    db.from("downloads").select("*").order("date"),
    db.from("activity_log").select("*").order("id", { ascending: false }).limit(80),
  ]);
  people = p.data || []; downloads = d.data || []; logRows = l.data || [];
}

async function log(action) {
  await db.from("activity_log").insert({ actor: me?.name || "?", action });
}

let rtChannel = null, reloadTimer = null;
function subscribeRealtime() {
  if (rtChannel) return;
  rtChannel = db.channel("db-changes")
    .on("postgres_changes", { event: "*", schema: "public" }, () => {
      clearTimeout(reloadTimer);
      reloadTimer = setTimeout(async () => { await loadAll(); render(); }, 400);
    })
    .subscribe();
}
document.addEventListener("visibilitychange", async () => {
  if (!document.hidden && !views.app.classList.contains("hidden")) { await loadAll(); render(); }
});

async function refresh() { await loadAll(); render(); }

// ── Navigazione ─────────────────────────────────────────────
document.querySelectorAll("nav button").forEach(b => {
  b.addEventListener("click", () => {
    tab = b.dataset.tab;
    document.querySelectorAll("nav button").forEach(x => x.classList.toggle("active", x === b));
    render();
  });
});

const TITLES = { dd: "Daily Download", validation: "Validation", team: "Team", log: "Storico" };

function render() {
  $("#tab-title").textContent = TITLES[tab];
  const main = $("#main");
  if (tab === "dd") renderDD(main);
  else if (tab === "validation") renderValidation(main);
  else if (tab === "team") renderTeam(main);
  else renderLog(main);
}

// ── DD (Daily Download) ─────────────────────────────────────
function personSelect(selected, cls, id) {
  const opts = people.filter(p => p.active || p.id === selected)
    .map(p => `<option value="${p.id}" ${p.id === selected ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  return `<select class="${cls}" data-id="${id}">
    <option value="">— nessuno —</option>${opts}</select>`;
}

function ddCard(d) {
  const done = d.uploaded;
  const expanded = openDD.has(d.id);
  const summary = [
    d.preparer_id ? `Prepara: ${personName(d.preparer_id)}` : null,
    d.presenter_id ? `Facilita: ${personName(d.presenter_id)}` : null,
  ].filter(Boolean).join(" · ") || "tocca per i dettagli";
  return `<div class="card" data-id="${d.id}">
    <div class="row spread dd-summary" data-dd-toggle="${d.id}">
      <div>
        <div class="row" style="gap:8px">
          <h3>${esc(ddLabel(d))}</h3>
          ${hasAudience ? `<button class="aud-tag ${d.audience === "pz" ? "pz" : ""}" data-act="toggle-aud" data-id="${d.id}"
            title="Tocca per cambiare destinatari">${audienceLabel(d.audience)}</button>` : ""}
        </div>
        <div class="sub">${esc(summary)}</div>
      </div>
      <span class="badge ${done ? "done" : ""}">${done ? "Caricato" : "Da caricare"}</span>
    </div>
    ${!expanded ? "" : `
    <div class="field"><label>Chi lo prepara</label>${personSelect(d.preparer_id, "sel-preparer", d.id)}</div>
    <div class="field"><label>Chi lo facilita</label>${personSelect(d.presenter_id, "sel-presenter", d.id)}</div>
    ${d.manager ? `<div class="manager-line">👤 Manager presente: <strong>${esc(d.manager)}</strong></div>` : ""}
    ${d.notes ? `<div class="manager-line">📝 ${esc(d.notes)}</div>` : ""}
    <div class="row" style="margin-top:12px">
      <button class="toggle ${d.uploaded ? "on" : ""}" data-act="uploaded" data-id="${d.id}">
        ${d.uploaded ? "✓ Caricato" : "Da caricare"}</button>
      <span style="flex:1"></span>
      <button class="ghost small" data-act="ics" data-id="${d.id}">📅 Calendario</button>
      <button class="ghost small" data-act="edit-dd" data-id="${d.id}">Modifica</button>
    </div>`}
  </div>`;
}

function ddFormFields(d) {
  return `
    <div class="field"><label>Data *</label>
      <input type="date" name="date" value="${d?.date || todayStr()}" required></div>
    <div class="field"><label>Argomento (anche provvisorio) *</label>
      <input type="text" name="title" value="${esc(d?.title || "")}" placeholder="es. Novità del mese" required></div>
    ${!hasAudience ? "" : `
    <div class="field"><label>Destinatari</label>
      <select name="audience">
        <option value="all" ${d?.audience !== "pz" ? "selected" : ""}>All team</option>
        <option value="pz" ${d?.audience === "pz" ? "selected" : ""}>PZ solo</option>
      </select></div>`}
    <div class="field"><label>Chi lo prepara</label>
      <select name="preparer_id"><option value="">— da assegnare —</option>
        ${people.filter(p => p.active || p.id === d?.preparer_id).map(p =>
          `<option value="${p.id}" ${p.id === d?.preparer_id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}
      </select></div>
    <div class="field"><label>Chi lo facilita</label>
      <select name="presenter_id"><option value="">— da assegnare —</option>
        ${people.filter(p => p.active || p.id === d?.presenter_id).map(p =>
          `<option value="${p.id}" ${p.id === d?.presenter_id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}
      </select></div>
    <div class="field"><label>Manager presente</label>
      <input type="text" name="manager" value="${esc(d?.manager || "")}" placeholder="es. Verdi"></div>
    <div class="field"><label>Note / altri partecipanti</label>
      <input type="text" name="notes" value="${esc(d?.notes || "")}" placeholder="es. presente anche il team Genius"></div>`;
}

function renderDD(main) {
  const today = todayStr();
  const upcoming = downloads.filter(d => d.date >= today);
  const past = downloads.filter(d => d.date < today).reverse();

  const groups = [];
  for (const d of upcoming) {
    const g = groups[groups.length - 1];
    if (g && g.date === d.date) g.items.push(d);
    else groups.push({ date: d.date, items: [d] });
  }
  const calendar = groups.map(g => `
    <div class="date-head ${g.date === today ? "today" : ""}">
      ${g.date === today ? "Oggi · " : ""}${fmtDate(g.date)}</div>
    ${g.items.map(ddCard).join("")}`).join("");

  const pastHtml = past.length ? `
    <details class="past"><summary>Giorni passati (${past.length}) ▾</summary>
      ${past.map(d => `
        <div class="mini">
          <span class="badge ${d.uploaded ? "done" : ""}">${d.uploaded ? "✓" : "✗"}</span>
          <span class="sub">${fmtDateShort(d.date)} · ${esc(ddLabel(d))}</span>
          <button class="ghost small" data-act="edit-dd" data-id="${d.id}">Modifica</button>
        </div>`).join("")}
    </details>` : "";

  main.innerHTML = `
    <div class="section-head"><h2>Calendario</h2>
      <button class="small" id="add-dd">+ Nuovo DD</button></div>
    ${calendar || `<div class="empty">Nessun DD in programma.<br>Aggiungine uno con “+ Nuovo DD”.</div>`}
    ${pastHtml}`;

  $("#add-dd").onclick = () => openDialog("Nuovo DD", ddFormFields(null),
    async (fd) => {
      const row = {
        date: fd.get("date"),
        title: fd.get("title").trim(),
        ...(hasAudience ? { audience: fd.get("audience") } : {}),
        preparer_id: fd.get("preparer_id") || null,
        presenter_id: fd.get("presenter_id") || null,
        manager: fd.get("manager").trim() || null,
        notes: fd.get("notes").trim() || null,
      };
      const { error } = await db.from("downloads").insert(row);
      if (error) { toast("Errore nel salvataggio"); return; }
      await log(`ha creato il DD “${row.title}” del ${fmtDateShort(row.date)}${hasAudience ? ` (${audienceLabel(row.audience)})` : ""}`);
      await refresh();
    });

  main.querySelectorAll("[data-act=edit-dd]").forEach(b => {
    b.onclick = () => {
      const d = downloads.find(x => x.id === b.dataset.id);
      openDialog("Modifica DD", ddFormFields(d) + `
        <div class="row" style="margin-top:14px">
          <button type="button" class="danger small" id="dlg-delete">Elimina questo DD</button>
        </div>`,
        async (fd) => {
          const row = {
            date: fd.get("date"),
            title: fd.get("title").trim(),
            ...(hasAudience ? { audience: fd.get("audience") } : {}),
            preparer_id: fd.get("preparer_id") || null,
            presenter_id: fd.get("presenter_id") || null,
            manager: fd.get("manager").trim() || null,
            notes: fd.get("notes").trim() || null,
            updated_at: new Date().toISOString(),
          };
          const { error } = await db.from("downloads").update(row).eq("id", d.id);
          if (error) { toast("Errore nel salvataggio"); return; }
          await log(`ha modificato il DD “${row.title}” del ${fmtDateShort(row.date)}`);
          await refresh();
        },
        (form) => {
          form.querySelector("#dlg-delete").onclick = async () => {
            if (!confirm(`Eliminare “${ddLabel(d)}”?`)) return;
            await db.from("downloads").delete().eq("id", d.id);
            await log(`ha eliminato il DD “${ddLabel(d)}”`);
            $("#dlg").close();
            await refresh();
          };
        });
    };
  });

  main.querySelectorAll(".sel-preparer, .sel-presenter").forEach(sel => {
    sel.onchange = async () => {
      const field = sel.classList.contains("sel-preparer") ? "preparer_id" : "presenter_id";
      const d = downloads.find(x => x.id === sel.dataset.id);
      const val = sel.value || null;
      await db.from("downloads").update({ [field]: val, updated_at: new Date().toISOString() }).eq("id", d.id);
      await log(`ha assegnato ${field === "preparer_id" ? "la preparazione" : "la facilitazione"} di “${ddLabel(d)}” a ${val ? personName(val) : "nessuno"}`);
      await refresh();
    };
  });
  main.querySelectorAll("[data-dd-toggle]").forEach(el => {
    el.onclick = () => {
      const id = el.dataset.ddToggle;
      openDD.has(id) ? openDD.delete(id) : openDD.add(id);
      render();
    };
  });
  main.querySelectorAll("[data-act=toggle-aud]").forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation(); // non espandere/chiudere la scheda
      const d = downloads.find(x => x.id === b.dataset.id);
      const audience = d.audience === "pz" ? "all" : "pz";
      const { error } = await db.from("downloads").update({ audience, updated_at: new Date().toISOString() }).eq("id", d.id);
      if (error) { toast("Errore nel salvataggio"); return; }
      await log(`ha impostato “${ddLabel(d)}” per ${audienceLabel(audience)}`);
      await refresh();
    };
  });
  main.querySelectorAll("[data-act=ics]").forEach(b => {
    b.onclick = () => downloadICS(downloads.find(x => x.id === b.dataset.id));
  });
  main.querySelectorAll("[data-act=uploaded]").forEach(b => {
    b.onclick = async () => {
      const d = downloads.find(x => x.id === b.dataset.id);
      const val = !d.uploaded;
      await db.from("downloads").update({ uploaded: val, updated_at: new Date().toISOString() }).eq("id", d.id);
      await log(`ha segnato “${ddLabel(d)}” come ${val ? "caricato" : "da caricare"}`);
      await refresh();
    };
  });
}

      <div class="glyph">🚧</div>
      <h2>In arrivo</h2>

// ── Team ────────────────────────────────────────────────────
function renderTeam(main) {
  const rowsPeople = people.map(p => `
    <div class="row spread" style="padding:8px 0; border-bottom:1px solid var(--line)">
      <div class="row" style="gap:8px">
        <span>${esc(p.name)}</span>
        <button class="role-tag ${p.role === "pro" ? "pro" : ""}" data-act="toggle-role" data-id="${p.id}"
          title="Tocca per cambiare ruolo">${p.role === "pro" ? "Pro" : "Expert"}</button>
      </div>
      <button class="danger small" data-act="del-person" data-id="${p.id}">Elimina</button>
    </div>`).join("");
  main.innerHTML = `
    <div class="section-head"><h2>Persone</h2>
      <button class="small" id="add-person">+ Aggiungi</button></div>
    <div class="card">${rowsPeople || `<div class="empty">Nessuno ancora.</div>`}</div>
    <div class="sub" style="margin:8px 4px">Tocca Expert/Pro per cambiare il ruolo.</div>`;

  $("#add-person").onclick = () => openDialog("Nuova persona", `
      <div class="field"><label>Cognome</label><input type="text" name="name" required></div>
      <div class="field"><label>Ruolo</label>
        <select name="role"><option value="expert" selected>Expert</option><option value="pro">Pro</option></select></div>`,
    async (fd) => {
      const name = fd.get("name").trim();
      const role = fd.get("role");
      const { error } = await db.from("people").insert({ name, role });
      if (error) { toast("Nome già esistente?"); return; }
      await log(`ha aggiunto ${name} (${role === "pro" ? "Pro" : "Expert"}) al team`);
      await refresh();
    });

  main.querySelectorAll("[data-act=toggle-role]").forEach(b => {
    b.onclick = async () => {
      const p = people.find(x => x.id === b.dataset.id);
      const role = p.role === "pro" ? "expert" : "pro";
      const { error } = await db.from("people").update({ role }).eq("id", p.id);
      if (error) { toast("Errore nel salvataggio"); return; }
      await log(`ha impostato ${p.name} come ${role === "pro" ? "Pro" : "Expert"}`);
      await refresh();
    };
  });
  main.querySelectorAll("[data-act=del-person]").forEach(b => {
    b.onclick = async () => {
      const p = people.find(x => x.id === b.dataset.id);
      if (!confirm(`Eliminare ${p.name} dal team?\nLe attività già registrate nello Storico restano.`)) return;
      const { error } = await db.from("people").delete().eq("id", p.id);
      if (error) { toast("Errore nell'eliminazione"); return; }
      await log(`ha eliminato ${p.name} dal team`);
      if (me?.id === p.id) {
        localStorage.removeItem("whoami"); me = null;
        await loadAll(); showWhoami(); return;
      }
      await refresh();
    };
  });
}

// ── Storico ─────────────────────────────────────────────────
function renderLog(main) {
  const rows = logRows.map(r => `
    <div class="log-item"><strong>${esc(r.actor)}</strong> ${esc(r.action)}
      <div class="sub">${fmtTs(r.created_at)}</div></div>`).join("");
  main.innerHTML = `<div class="card">${rows || `<div class="empty">Ancora nessuna attività.</div>`}</div>`;
}

// ── Dialog generico ─────────────────────────────────────────
function openDialog(title, fieldsHtml, onSubmit, onOpen) {
  const dlg = $("#dlg"), form = $("#dlg-form");
  form.innerHTML = `<h3>${title}</h3>${fieldsHtml}
    <div class="dialog-actions">
      <button type="button" class="ghost" id="dlg-cancel">Annulla</button>
      <button type="submit">Salva</button>
    </div>`;
  form.onsubmit = async (e) => {
    e.preventDefault();
    await onSubmit(new FormData(form));
    dlg.close();
  };
  form.querySelector("#dlg-cancel").onclick = () => dlg.close();
  if (onOpen) onOpen(form);
  dlg.showModal();
}

// ── Avvio ───────────────────────────────────────────────────
const { data: { session } } = await db.auth.getSession();
if (session) { await start(); } else { show("login"); }
