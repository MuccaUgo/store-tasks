<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1220">
<meta name="app-version" content="24">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Store Tasks</title>
<style>
  :root {
    --bg: #f2f3f8;
    --card: #ffffff;
    --glass: rgba(255, 255, 255, .58);
    --glass-line: rgba(255, 255, 255, .75);
    --text: #14172b;
    --muted: #6b7085;
    --line: #e3e5ee;
    --accent: #3b5bfd;
    --accent-soft: #e8ecff;
    --ok: #1fa36b;
    --ok-soft: #e2f6ec;
    --warn: #c77b12;
    --warn-soft: #fcefdc;
    --danger: #d33f49;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(20, 23, 43, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1220;
      --card: #191d31;
      --glass: rgba(25, 29, 49, .55);
      --glass-line: rgba(255, 255, 255, .10);
      --text: #eceef7;
      --muted: #9aa0b8;
      --line: #2a2f4a;
      --accent: #7d92ff;
      --accent-soft: #232a4d;
      --ok: #3ecf8e;
      --ok-soft: #163a2c;
      --warn: #e8a13c;
      --warn-soft: #3d2f14;
      --danger: #ff6b74;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100dvh;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--glass);
    -webkit-backdrop-filter: blur(22px) saturate(1.8);
    backdrop-filter: blur(22px) saturate(1.8);
    padding: calc(12px + env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--glass-line);
  }
  header h1 { font-size: 1.15rem; letter-spacing: -.01em; }
  #whoami-chip {
    font-size: .85rem; color: var(--accent); background: var(--accent-soft);
    border: none; border-radius: 999px; padding: 6px 12px; font-weight: 600;
  }
  main { padding: 14px 14px 20px; max-width: 640px; margin: 0 auto; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(20, 23, 43, .04);
  }
  .card h3 { font-size: 1.02rem; margin-bottom: 2px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: .82rem; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .spread { justify-content: space-between; }
  .field { margin-top: 10px; }
  .field label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
  select, textarea,
  input[type=text], input[type=date], input[type=password],
  input[type=number], input[type=time] {
    width: 100%; padding: 11px 12px; font-size: 1rem;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg); color: var(--text);
    -webkit-appearance: none; appearance: none;
    font-family: inherit;
  }
  textarea { resize: vertical; line-height: 1.4; }
  button {
    font-family: inherit; font-size: .95rem; font-weight: 600;
    border: none; border-radius: 12px; padding: 11px 16px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.ghost { background: var(--accent-soft); color: var(--accent); }
  button.small { padding: 7px 12px; font-size: .85rem; }
  button.danger { background: transparent; color: var(--danger); padding: 7px 8px; }
  button:disabled { opacity: .5; }
  .toggle {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 999px; font-size: .85rem; font-weight: 600;
    background: var(--warn-soft); color: var(--warn); cursor: pointer; border: none;
  }
  .toggle.on { background: var(--ok-soft); color: var(--ok); }
  .badge {
    font-size: .75rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    background: var(--warn-soft); color: var(--warn);
  }
  .badge.done { background: var(--ok-soft); color: var(--ok); }
  .dd-summary { cursor: pointer; }
  .card.fatto { background: var(--bg); box-shadow: none; }
  .role-tag {
    font-size: .7rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .04em; cursor: pointer; border: none;
    background: var(--accent-soft); color: var(--accent);
  }
  .role-tag.pro { background: rgba(168, 85, 247, .16); color: #8b3fd4; }
  .aud-tag {
    font-size: .68rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
    background: rgba(16, 185, 129, .16); color: #0d9668;
    border: none; cursor: pointer;
  }
  .aud-tag.pz { background: rgba(245, 158, 11, .18); color: #b8730a; }
  @media (prefers-color-scheme: dark) {
    .role-tag.pro { color: #c78dff; }
    .aud-tag { color: #34d399; }
    .aud-tag.pz { color: #fbbf24; }
  }
  .manager-line {
    margin-top: 10px; font-size: .85rem; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .date-head {
    margin: 18px 4px 8px; font-size: .82rem; font-weight: 700;
    color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
  }
  .date-head.today { color: var(--accent); }
  .mini {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 11px 14px; margin-bottom: 8px;
  }
  .mini .sub { flex: 1; }
  details.past { margin-top: 18px; }
  details.past summary {
    cursor: pointer; color: var(--muted); font-size: .85rem; font-weight: 600;
    padding: 8px 2px; list-style: none;
  }
  nav {
    position: fixed; z-index: 10;
    left: max(12px, env(safe-area-inset-left));
    right: max(12px, env(safe-area-inset-right));
    bottom: calc(12px + env(safe-area-inset-bottom));
    display: flex;
    background: var(--glass);
    -webkit-backdrop-filter: blur(24px) saturate(1.8);
    backdrop-filter: blur(24px) saturate(1.8);
    border: 1px solid var(--glass-line);
    border-radius: 32px;
    box-shadow: var(--shadow);
    padding: 6px;
    max-width: 500px; margin: 0 auto;
  }
  nav button {
    flex: 1; background: none; color: var(--muted); border-radius: 24px;
    padding: 7px 0 6px; font-size: .68rem; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  nav button .ico {
    display: flex; align-items: center; justify-content: center;
    width: 46px; height: 28px; border-radius: 999px;
    transition: background .2s;
  }
  nav button .ico svg { width: 21px; height: 21px; }
  nav.many button { font-size: .63rem; }
  nav.many button .ico { width: 40px; }
  nav .emo { font-size: 1.15rem; line-height: 1; }
  nav button.active { color: var(--accent); }
  nav button.active .ico { background: var(--accent-soft); }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: .9rem; }
  .empty-big { text-align: center; color: var(--muted); padding: 90px 24px 30px; }
  .empty-big .glyph { font-size: 2.6rem; margin-bottom: 12px; }
  .empty-big h2 { color: var(--text); font-size: 1.1rem; margin-bottom: 6px; }
  .section-head { display: flex; justify-content: space-between; align-items: center; margin: 6px 2px 12px; }
  .section-head h2 { font-size: 1.05rem; letter-spacing: -.01em; }
  dialog {
    border: none; border-radius: 22px 22px 0 0; background: var(--card); color: var(--text);
    width: 100%; max-width: 480px;
    margin: auto auto 0;
    padding: 16px 18px calc(18px + env(safe-area-inset-bottom));
    max-height: 88dvh; overflow-y: auto;
    box-shadow: var(--shadow);
  }
  dialog[open] { animation: sheet-up .22s ease-out; }
  @keyframes sheet-up { from { transform: translateY(18px); } to { transform: none; } }
  dialog::backdrop { animation: fade-in .22s ease-out; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  dialog::backdrop {
    background: rgba(10, 12, 25, .35);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  dialog h3 { margin-bottom: 4px; }
  .dialog-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .dialog-actions button { min-width: 96px; }
  .row-del { margin-top: 14px; }
  .row-del button { padding: 8px 0; font-size: .86rem; }
  #toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(96px + env(safe-area-inset-bottom));
    background: var(--text); color: var(--bg); padding: 10px 18px;
    border-radius: 999px; font-size: .85rem; opacity: 0; transition: opacity .25s;
    pointer-events: none; z-index: 50; max-width: 88vw; text-align: center;
  }
  #toast.show { opacity: 1; }
  .login-wrap {
    min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .login-box { width: min(92vw, 380px); text-align: center; }
  .login-box .logo { font-size: 3rem; margin-bottom: 8px; }
  .login-box h1 { margin-bottom: 4px; }
  .login-box p { color: var(--muted); font-size: .9rem; margin-bottom: 20px; }
  .login-box form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .who-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; max-height: 45dvh; overflow-y: auto; }
  .who-list button { background: var(--card); color: var(--text); border: 1px solid var(--line); text-align: left; }
  .log-item { padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: .85rem; }
  .log-item:last-child { border-bottom: none; }
  .log-item .sub { margin-top: 2px; }
  /* ── Segmenti e chip ── */
  .seg {
    display: flex; gap: 4px; padding: 4px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 13px; margin-bottom: 14px;
  }
  .fchip {
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    border-radius: 999px; padding: 7px 14px; font-size: .82rem; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .seg button {
    flex: 1; border: none; background: none; padding: 11px 6px; border-radius: 10px;
    min-height: 42px; font-size: .9rem; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.13); }
  .dot.s1 { background: var(--warn); }
  .dot.s2 { background: var(--ok); }
  .dot.na { background: transparent; border: 1px dashed var(--muted); }
  .area-head {
    display: flex; align-items: center; gap: 10px; margin: 16px 4px 7px;
    font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  }
  .area-head .ac { margin-left: auto; font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .att-bar i.v { background: var(--ok); }
  .att-bar i.o { background: var(--warn); }
  .t-row.tap { cursor: pointer; }
  /* ── Progetti ── */
  .stats { display: flex; gap: 8px; margin-bottom: 6px; }
  .stat {
    flex: 1; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px 6px; text-align: center;
  }
  .stat b { display: block; font-size: 1.3rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat span { font-size: .66rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .slot-head { flex-wrap: nowrap; align-items: flex-start; }
  .slot-head .badge { flex: none; margin-top: 2px; }
  .role-line { display: flex; gap: 10px; font-size: .88rem; margin-top: 8px; align-items: baseline; }
  .role-line b {
    flex: 0 0 74px; font-size: .68rem; color: var(--muted); font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .db-item { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; font-size: .88rem; }
  .db-nums { display: flex; flex-wrap: wrap; gap: 6px; margin: 7px 0; }
  .db-nums span { background: var(--bg); border-radius: 999px; padding: 3px 10px; font-size: .78rem; }
  .db-line { color: var(--muted); margin-top: 3px; }
  .db-line b { color: var(--text); font-weight: 600; }
  .kind {
    font-size: .66rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .04em;
    background: var(--accent-soft); color: var(--accent);
  }
  .kind.problema { background: rgba(211, 63, 73, .14); color: var(--danger); }
  .kind.domanda { background: var(--warn-soft); color: var(--warn); }
  .kind.idea { background: rgba(168, 85, 247, .16); color: #8b3fd4; }
  @media (prefers-color-scheme: dark) { .kind.idea { color: #c78dff; } }
  .reply {
    border-left: 2px solid var(--line); margin: 8px 0 0 2px;
    padding: 3px 0 3px 10px; font-size: .86rem;
  }
  .num-grid { display: flex; gap: 8px; margin-top: 10px; }
  .num-grid label { flex: 1; font-size: .72rem; color: var(--muted); }
  .num-grid input { margin-top: 4px; text-align: center; }
  .badge.soft { background: var(--accent-soft); color: var(--accent); }
  /* ── Focus Flow ── */
  .f-card2 {
    width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line);
    border-radius: 15px; padding: 13px 14px; margin-bottom: 9px; cursor: pointer;
    display: flex; flex-direction: column; gap: 9px; font-family: inherit; color: var(--text);
  }
  .f-card2:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .f-name2 { font-size: 1rem; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; }
  .fstate {
    font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap; flex: none;
  }
  .fs-att { background: var(--accent-soft); color: var(--accent); }
  .fs-ral { background: var(--warn-soft); color: var(--warn); }
  .fs-fer { background: rgba(211, 63, 73, .15); color: var(--danger); }
  .fs-con { background: var(--ok-soft); color: var(--ok); }
  .fs-abb { background: var(--line); color: var(--muted); }
  .strip-row { display: flex; align-items: center; gap: 10px; width: 100%; }
  .strip { display: flex; gap: 3px; align-items: flex-end; height: 18px; flex: 1; }
  .strip i { flex: 1; border-radius: 2px; background: var(--line); height: 3px; display: block; }
  .strip i.on { height: 18px; background: var(--sc, var(--accent)); }
  .strip i.pre { background: none; }
  .strip i.aft { opacity: .45; }
  .fmetric { font-size: .74rem; color: var(--muted); white-space: nowrap; }
  .backlink {
    background: none; border: none; color: var(--accent); font-size: .95rem;
    font-weight: 600; padding: 2px 0 12px; cursor: pointer; font-family: inherit;
  }
  .feed { display: flex; flex-direction: column; }
  .fitem {
    display: flex; gap: 13px; align-items: flex-start; position: relative;
    width: 100%; text-align: left; background: none; border: none;
    padding: 0 0 18px; font-family: inherit; color: var(--text);
    font-size: 1rem; font-weight: 400; cursor: pointer;
  }
  .fitem:not(:last-child)::before {
    content: ""; position: absolute; left: 5px; top: 18px; bottom: 0; width: 2px; background: var(--line);
  }
  .fdot2 { width: 12px; height: 12px; border-radius: 99px; flex: none; margin-top: 5px; z-index: 2; }
  .ftxt {
    flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 11px 13px;
  }
  .fwk {
    display: block; font-size: .76rem; font-weight: 700; color: var(--accent);
    letter-spacing: .01em; margin-bottom: 5px;
  }
  .fwk::first-letter { text-transform: uppercase; }
  .fbody { display: block; font-size: .95rem; line-height: 1.5; white-space: pre-wrap; }
  .fauth { display: block; font-size: .74rem; color: var(--muted); margin-top: 7px; }
  .fchev { color: var(--muted); font-size: 1.1rem; align-self: center; flex: none; }
  .fitem:disabled { opacity: 1; cursor: default; }
  /* proposte e decisioni */
  .pcard {
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent);
    border-radius: 15px; padding: 13px 14px; margin-bottom: 10px;
  }
  .pcard.dec { border-left-color: var(--ok); }
  .kind.prop { background: var(--accent-soft); color: var(--accent); }
  .kind.dec { background: var(--ok-soft); color: var(--ok); }
  .pbody { font-size: .95rem; line-height: 1.5; white-space: pre-wrap; margin-top: 9px; }
  .pesito {
    margin-top: 10px; padding: 9px 11px; border-radius: 11px; background: var(--ok-soft);
    font-size: .9rem; line-height: 1.45;
  }
  .votes { display: flex; gap: 8px; margin-top: 11px; }
  .vote {
    flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-family: inherit; font-size: .92rem;
    cursor: pointer;
  }
  .vote[aria-pressed="true"] { border-color: transparent; font-weight: 700; }
  .vote.up[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .vote.down[aria-pressed="true"] { background: rgba(211, 63, 73, .14); color: var(--danger); }
  .tally { font-size: .92rem; margin-top: 11px; }
  .voters { font-size: .74rem; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  .qr-card { text-align: center; }
  .qr-card .sub { margin: 6px auto 14px; max-width: 30ch; }
  /* il codice resta scuro su chiaro anche col tema scuro: serve il contrasto */
  .qr {
    width: 200px; max-width: 62%; height: auto; display: block; margin: 0 auto;
    background: #fff; border-radius: 10px; padding: 8px; box-sizing: content-box;
  }
  .qr-url { font-size: .8rem; color: var(--muted); margin-top: 10px; word-break: break-all; }
  .dd-comm { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 4px; }
  .creply { display: flex; gap: 8px; margin-top: 10px; }
  .creply input { flex: 1; min-width: 0; }
  .prompts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .prompt {
    border: 1px dashed var(--line); background: none; color: var(--muted);
    border-radius: 999px; padding: 5px 11px; font-size: .78rem; cursor: pointer; font-family: inherit;
  }
  .prompt:hover { border-color: var(--accent); color: var(--accent); }
  /* ── Brief e Debrief ── */
  .head-right { display: flex; align-items: center; gap: 4px; }
  #refresh-btn {
    background: none; color: var(--muted); font-size: 1.3rem; line-height: 1;
    padding: 5px 8px; border-radius: 999px;
  }
  #refresh-btn:active { background: var(--accent-soft); color: var(--accent); }
  #refresh-btn.spin { animation: spin .7s linear; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .menu2 { display: flex; gap: 10px; }
  .menu2 .big {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 16px 10px; border-radius: 18px; font-size: .95rem;
    background: var(--accent-soft); color: var(--accent);
  }
  .menu2 .big span { font-size: 1.5rem; line-height: 1; }
  .menu2-sub { text-align: center; margin-top: 8px; }
  .pt-block { margin-top: 13px; }
  .pt-block .add-row { margin-top: 6px; }
  .pt-block .add-row input { padding: 8px 11px; font-size: .88rem; }
  .pt-block .pl-add {
    padding: 8px 15px; font-size: 1rem; background: var(--accent-soft); color: var(--accent);
  }
  .pt-head {
    display: flex; align-items: center; gap: 8px; font-size: .73rem; font-weight: 700;
    color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px;
  }
  .pt-head button { margin-left: auto; padding: 3px 14px; font-size: 1rem; }
  .pt-row {
    display: flex; gap: 8px; align-items: flex-start; font-size: .88rem;
    padding: 6px 0; border-bottom: 1px solid var(--line);
  }
  .pt-row:last-child { border-bottom: none; }
  .pt-row span { flex: 1; }
  .pt-row em { display: block; font-style: normal; font-size: .75rem; color: var(--muted); margin-top: 3px; }
  .pt-x { background: none; color: var(--muted); font-size: 1.15rem; line-height: 1; padding: 0 6px; }
  .pt-count { font-size: .78rem; font-weight: 700; }
  .pt-count.ok { color: var(--ok); }
  .pt-count.ko { color: var(--danger); }

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// ── Configurazione ──────────────────────────────────────────
const SUPABASE_URL = "https://nrxnmucuwucfecnphrtf.supabase.co";
const SUPABASE_KEY = "sb_publishable_OJnekj88Hcc4zCXVo8k9Uw_oSlwAmXm";
const SHARED_EMAIL = "marcocasati+storetasks@gmail.com"; // utente condiviso in Supabase Auth

const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// ── Stato ───────────────────────────────────────────────────
let people = [], downloads = [], logRows = [];
let projects = [], slots = [], slotPeople = [], projItems = [], debriefs = [], insights = [], replies = [];
let shiftPoints = [], briefs = [];
let tab = localStorage.getItem("tab") || "dd";
let me = JSON.parse(localStorage.getItem("whoami") || "null");
let openDD = new Set();     // schede DD espanse
let ddSecondo = new Set();  // schede dove il secondo posto è stato aperto col +
let hasAudience = false; // il tag destinatari appare solo se la colonna esiste
let hasSecondo = false;  // la seconda persona che facilita: migration-12.sql
let hasDDComm = false;   // i commenti sotto un DD: migration-13.sql
let hasProjects = false;   // i tab dei progetti compaiono dopo migration-6.sql
let pSeg = "turni", openSlot = new Set(); // schede turno espanse
let tuttiPunti = { good: false, bad: false, demo: false, phrase: false };
let focusList = [], focusUpd = [], focusVotes = [], focusComments = [];
let ddComments = [];
let hasFocus = false;      // il tab Focus si attiva dopo migration-7.sql
let hasUpdDate = false;    // data e correzione degli aggiornamenti: migration-10.sql
let hasProposte = false;   // proposte, voti e decisioni: migration-11.sql
let openFocusId = null;

const $ = (s) => document.querySelector(s);
const views = { login: $("#view-login"), whoami: $("#view-whoami"), app: $("#view-app") };
function show(name) {
  Object.entries(views).forEach(([k, el]) => el.classList.toggle("hidden", k !== name));
}
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
}
const esc = (s) => (s ?? "").toString().replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const fmtDate = (d) => d ? new Date(d + "T00:00:00").toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" }) : "—";
const fmtDateShort = (d) => d ? new Date(d + "T00:00:00").toLocaleDateString("it-IT", { day: "numeric", month: "short" }) : "—";
const fmtTs = (ts) => new Date(ts).toLocaleString("it-IT", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const personName = (id) => people.find(p => p.id === id)?.name || "—";
const ddLabel = (d) => d.title || `DD del ${fmtDateShort(d.date)}`;
const audienceLabel = (a) => a === "pz" ? "PZ solo" : "All team";

const icsEsc = (s) => (s ?? "").toString()
  .replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
const icsStamp = () => new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");

// Chi facilita può essere in due: i nomi si leggono come li direbbe una persona
const chiFacilita = (d) => {
  const nomi = [d.presenter_id, hasSecondo ? d.presenter2_id : null]
    .filter(Boolean).map(personName);
  return nomi.length ? nomi.join(" e ") : null;
};

// Evento .ics per aggiungere il DD al proprio calendario (promemoria ore 9:00)
function ddToICS(d) {
  const day = d.date.replace(/-/g, "");
  const next = new Date(d.date + "T00:00:00");
  next.setDate(next.getDate() + 1);
  const dayEnd = `${next.getFullYear()}${String(next.getMonth()+1).padStart(2,"0")}${String(next.getDate()).padStart(2,"0")}`;
  const details = [
    hasAudience ? `Destinatari: ${audienceLabel(d.audience)}` : null,
    d.preparer_id ? `Prepara: ${personName(d.preparer_id)}` : null,
    chiFacilita(d) ? `Facilita: ${chiFacilita(d)}` : null,
    d.manager ? `Manager presente: ${d.manager}` : null,
    d.notes ? `Note: ${d.notes}` : null,
  ].filter(Boolean).join("\n");
  return [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Store Tasks//IT",
    "BEGIN:VEVENT",
    `UID:dd-${d.id}@store-tasks`,
    `DTSTAMP:${icsStamp()}`,
    `DTSTART;VALUE=DATE:${day}`,
    `DTEND;VALUE=DATE:${dayEnd}`,
    `SUMMARY:${icsEsc("DD: " + ddLabel(d))}`,
    details ? `DESCRIPTION:${icsEsc(details)}` : null,
    "BEGIN:VALARM",
    "ACTION:DISPLAY",
    `DESCRIPTION:${icsEsc("Tra 5 giorni DD: " + ddLabel(d))}`,
    "TRIGGER;RELATED=START:-P4DT15H",
    "END:VALARM",
    "END:VEVENT",
    "END:VCALENDAR",
  ].filter(Boolean).join("\r\n");
}

function saveICS(text, filename) {
  const blob = new Blob([text], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  toast("Evento creato: aprilo per salvarlo in Calendario");
}

// ── Login ───────────────────────────────────────────────────
$("#login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("#login-btn");
  btn.disabled = true; btn.textContent = "Accesso…";
  const { error } = await db.auth.signInWithPassword({
    email: SHARED_EMAIL, password: $("#login-password").value,
  });
  btn.disabled = false; btn.textContent = "Entra";
  if (error) { toast("Password errata"); return; }
  await start();
});

// Sul telefono la pagina vecchia resta in cache per giorni: se non
// controllassimo, le modifiche non arriverebbero mai. Il controllo gira
// all'avvio, al rientro in primo piano e col pulsante in testata.
const APP_VERSION = document.querySelector('meta[name=app-version]')?.content || "";
let ultimoControllo = 0;

async function versionePubblicata() {
  try {
    const r = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" });
    const t = await r.text();
    return /<meta name="app-version" content="([^"]*)"/.exec(t)?.[1] || "";
  } catch { return ""; }   // offline: si riprova al giro dopo
}

async function svuotaCache() {
  try {
    if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
  } catch { /* niente cache da svuotare */ }
}

// L'indirizzo cambia a ogni giro: nessuna copia vecchia può rispondere.
async function ricarica() {
  await svuotaCache();
  location.replace(location.pathname + "?v=" + Date.now());
}

async function controllaVersione(forza) {
  if (!forza && Date.now() - ultimoControllo < 60000) return false;
  ultimoControllo = Date.now();
  const v = await versionePubblicata();
  if (!v || v === APP_VERSION) return false;
  toast("Nuova versione, ricarico…");
  setTimeout(ricarica, 800);
  return true;
}

// Aggiorna vuol dire aggiorna: ricarica tutta l'app, non solo i dati.
// (Con un foglio aperto il pulsante non è raggiungibile: il foglio è
// modale e rende inerte il resto, quindi niente da salvaguardare.)
$("#refresh-btn").addEventListener("click", async (e) => {
  e.currentTarget.classList.add("spin");
  toast("Aggiorno…");
  await ricarica();
});

// l'app resta aperta tutto il pomeriggio: ogni tanto si guarda intorno
setInterval(() => {
  if (!document.hidden && !views.app.classList.contains("hidden")) controllaVersione(false);
}, 600000);

$("#whoami-chip").addEventListener("click", () => {
  if (confirm("Vuoi cambiare nome utente?")) {
    localStorage.removeItem("whoami"); me = null;
    showWhoami();
  }
});

async function start() {
  await detectSchema();
  await loadAll();
  if (!me || !people.find(p => p.id === me.id)) { showWhoami(); return; }
  enterApp();
}

function showWhoami() {
  show("whoami");
  const list = $("#who-list");
  list.innerHTML = "";
  people.filter(p => p.active).forEach(p => {
    const b = document.createElement("button");
    b.textContent = p.name;

    list.appendChild(b);

}

function enterApp() {
  $("#whoami-chip").textContent = me.name;
  show("app");

// ── Dati ────────────────────────────────────────────────────
async function detectSchema() {
  const [a, s2, dc, p, f, q, k] = await Promise.all([
    db.from("downloads").select("audience").limit(1),
    db.from("downloads").select("presenter2_id").limit(1),
    db.from("dd_comments").select("id").limit(1),
    db.from("projects").select("id").limit(1),
    db.from("focus").select("id").limit(1),
    db.from("focus_updates").select("happened_on").limit(1),
    db.from("focus_updates").select("kind").limit(1),
  ]);
  hasAudience = !a.error;
  hasSecondo = !s2.error;
  hasDDComm = !dc.error;
  hasProjects = !p.error;
  hasFocus = !f.error;
  hasUpdDate = !q.error;
  hasProposte = !k.error;
}

async function loadAll() {
  const q = [
    ["people", db.from("people").select("*").order("name")],
    ["downloads", db.from("downloads").select("*").order("date")],
    ["log", db.from("activity_log").select("*").order("id", { ascending: false }).limit(80)],
  ];
  if (hasDDComm) q.push(["ddcomm", db.from("dd_comments").select("*").order("id")]);
  if (hasProjects) q.push(
    ["projects", db.from("projects").select("*").order("position")],
    ["slots", db.from("project_slots").select("*").order("date").order("start_time")],
    ["crew", db.from("slot_people").select("*").order("position")],
    ["items", db.from("project_items").select("*").order("position")],
    ["debriefs", db.from("debriefs").select("*").order("id")],
    ["insights", db.from("insights").select("*").order("id")],
    ["replies", db.from("insight_replies").select("*").order("id")],
    ["points", db.from("shift_points").select("*").order("id")],
    ["briefs", db.from("briefs").select("*").order("id")],
  );
  if (hasFocus) q.push(
    ["focus", db.from("focus").select("*").order("created_at")],
    ["fupd", db.from("focus_updates").select("*").order("created_at")],
  );
  if (hasFocus && hasProposte) q.push(
    ["fvotes", db.from("focus_votes").select("*").order("id")],
    ["fcomm", db.from("focus_comments").select("*").order("id")],
  );
  const res = await Promise.all(q.map(x => x[1]));
  const d = {};
  q.forEach((x, i) => d[x[0]] = res[i].data || []);

  people = d.people; downloads = d.downloads; logRows = d.log;
  if (hasDDComm) ddComments = d.ddcomm;
  if (hasProjects) {
    projects = d.projects; slots = d.slots; slotPeople = d.crew; projItems = d.items;
    debriefs = d.debriefs; insights = d.insights; replies = d.replies;
    shiftPoints = d.points; briefs = d.briefs;
  }
  if (hasFocus) {
    focusList = d.focus; focusUpd = d.fupd;
    if (hasProposte) { focusVotes = d.fvotes; focusComments = d.fcomm; }
  }
}

async function log(action) {
  await db.from("activity_log").insert({ actor: me?.name || "?", action });
}

let rtChannel = null, reloadTimer = null;
function subscribeRealtime() {
  if (rtChannel) return;
  rtChannel = db.channel("db-changes")
    .on("postgres_changes", { event: "*", schema: "public" }, () => {
      clearTimeout(reloadTimer);
      reloadTimer = setTimeout(async () => {
        // se qualcuno sta scrivendo in un campo, ridisegnare glielo
        // cancellerebbe: si aspetta il giro dopo
        const el = document.activeElement;
        if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) return;
        await loadAll();
        render();
      }, 400);
    })
    .subscribe();
}
document.addEventListener("visibilitychange", async () => {
  if (document.hidden || views.app.classList.contains("hidden")) return;
  await loadAll();
  render();
  controllaVersione(false);
});

async function refresh() { await loadAll(); render(); }

// ── Navigazione ─────────────────────────────────────────────
const TITLES = { dd: "Daily Download", focus: "Focus", team: "Team", log: "Storico" };

const ICONS = {
  dd: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="4.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`,
  team: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.4"/><path d="M3.2 19.3c.8-3.1 3.1-4.7 5.8-4.7s5 1.6 5.8 4.7"/><circle cx="16.8" cy="9.8" r="2.6"/><path d="M15.6 14.7c2.3.2 4.2 1.6 4.9 4"/></svg>`,
  log: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3.2 2"/></svg>`,
  focus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 3.5 3.5L16 9l4 4.5"/><circle cx="8" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="16" cy="9" r="1.7" fill="currentColor" stroke="none"/><path d="M3 21h18"/></svg>`,
};

// Un tab per ogni progetto, tra Focus e Team.
function renderNav() {
  const items = [
    { id: "dd", label: "DD", ico: ICONS.dd },
    ...(hasFocus ? [{ id: "focus", label: "Focus", ico: ICONS.focus }] : []),
    ...projects.map(p => ({ id: "proj:" + p.id, label: p.name, emo: p.icon || "🎯" })),
    { id: "team", label: "Team", ico: ICONS.team },
    { id: "log", label: "Storico", ico: ICONS.log },
  ];
  const nav = $("#nav");
  nav.classList.toggle("many", items.length > 4);
  nav.innerHTML = items.map(it => `<button data-tab="${it.id}" class="${tab === it.id ? "active" : ""}">
      <span class="ico">${it.emo ? `<span class="emo">${esc(it.emo)}</span>` : it.ico}</span>${esc(it.label)}</button>`).join("");
  nav.querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      tab = b.dataset.tab;
      localStorage.setItem("tab", tab);
      openFocusId = null;
      render();
    };
  });
}

function render() {
  let pr = null;
  if (tab.startsWith("proj:")) {
    pr = projectOf(tab.slice(5));
    if (!pr) tab = "dd"; // progetto archiviato o eliminato altrove
  }
  renderNav();
  $("#tab-title").textContent = pr ? (pr.full_name || pr.name) : TITLES[tab];
  const main = $("#main");
  if (pr) renderProject(main, pr);
  else if (tab === "dd") renderDD(main);
  else if (tab === "focus") renderFocus(main);
  else if (tab === "team") renderTeam(main);
  else renderLog(main);

  main.querySelectorAll("[data-pseg]").forEach(b => b.onclick = () => { pSeg = b.dataset.pseg; render(); });
}

// ── DD (Daily Download) ─────────────────────────────────────
function personSelect(selected, cls, id, escludi) {
  const opts = people.filter(p => (p.active || p.id === selected) && (!escludi || p.id !== escludi || p.id === selected))
    .map(p => `<option value="${p.id}" ${p.id === selected ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  return `<select class="${cls}" data-id="${id}">
    <option value="">— nessuno —</option>${opts}</select>`;
}

const ddCommOf = (id) => ddComments.filter(c => c.download_id === id).sort((a, b) => a.id - b.id);

      <div>
        <div class="row" style="gap:8px">
          <h3>${esc(ddLabel(d))}</h3>
          ${hasAudience ? `<button class="aud-tag ${d.audience === "pz" ? "pz" : ""}" data-act="toggle-aud" data-id="${d.id}"
            title="Tocca per cambiare destinatari">${audienceLabel(d.audience)}</button>` : ""}
        </div>
        <div class="sub">${esc(summary)}</div>
      </div>
      <span class="badge ${done ? "done" : ""}">${done ? "Caricato" : "Da caricare"}</span>
    </div>
    ${!expanded ? "" : `
    <div class="field"><label>Chi lo prepara</label>${personSelect(d.preparer_id, "sel-preparer", d.id)}</div>
    <div class="field"><label>Chi lo facilita</label>${personSelect(d.presenter_id, "sel-presenter", d.id)}</div>
    ${!hasSecondo ? "" : (d.presenter2_id || ddSecondo.has(d.id)
      ? `<div class="field"><label>Insieme a</label>${personSelect(d.presenter2_id, "sel-presenter2", d.id, d.presenter_id)}</div>`
      : `<button type="button" class="ghost small" data-act="add-second" data-id="${d.id}">+ Una seconda persona</button>`)}
    ${d.manager ? `<div class="manager-line">👤 Manager presente: <strong>${esc(d.manager)}</strong></div>` : ""}
    ${d.notes ? `<div class="manager-line">📝 ${esc(d.notes)}</div>` : ""}
    ${!hasDDComm ? "" : `<div class="dd-comm">
      ${ddCommOf(d.id).map(c => `<div class="reply"><b>${esc(c.actor_name)}</b>
        <span class="sub">· ${fmtTs(c.created_at)}</span><br>${esc(c.body)}</div>`).join("")}
      <div class="creply">
        <input type="text" data-ddcin="${d.id}" placeholder="Scrivi un commento" autocomplete="off">
        <button class="ghost small" data-ddcadd="${d.id}">Invia</button>
      </div>
    </div>`}
    <div class="row" style="margin-top:12px">
      <button class="toggle ${d.uploaded ? "on" : ""}" data-act="uploaded" data-id="${d.id}">
        ${d.uploaded ? "✓ Caricato" : "Da caricare"}</button>
      <span style="flex:1"></span>
      <button class="ghost small" data-act="ics" data-id="${d.id}">📅 Calendario</button>
      <button class="ghost small" data-act="edit-dd" data-id="${d.id}">Modifica</button>
    </div>`}
  </div>`;
}

function ddFormFields(d) {
  return `
    <div class="field"><label>Data *</label>
      <input type="date" name="date" value="${d?.date || todayStr()}" required></div>
    <div class="field"><label>Argomento (anche provvisorio) *</label>

            title: fd.get("title").trim(),

            preparer_id: fd.get("preparer_id") || null,
            presenter_id: fd.get("presenter_id") || null,

  main.querySelectorAll("[data-act=toggle-aud]").forEach(b => {

      if (error) { toast("Errore nel salvataggio"); return; }

  });
  main.querySelectorAll("[data-act=ics]").forEach(b => {

      await refresh();
    };
  });
}

// ── Focus Flow ──────────────────────────────────────────────
// Un focus è una cosa che portiamo avanti nel tempo. Un aggiornamento
// è un punto sulla scia: dove i punti smettono, il focus è fermo.
const WEEK_MS = 604800000;
// Un aggiornamento si scrive spesso il giorno dopo: quello che conta è
// quando è successo, e lo teniamo nel momento stesso dell'aggiornamento.
// (happened_on esiste solo se è stata eseguita migration-10, facoltativa.)
const updDate = (u) => u.happened_on || u.created_at;
const giornoISO = (g) => new Date(g + "T12:00:00").toISOString();
const updOf = (fid) => focusUpd.filter(u => u.focus_id === fid)
  .sort((a, b) => String(updDate(a)).localeCompare(String(updDate(b))) || a.id - b.id);
// Un aggiornamento scritto oggi porta la data di oggi a mezzogiorno: prima
// di mezzogiorno la differenza è negativa, e non esiste il silenzio negativo.
const weeksSince = (iso) => Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / WEEK_MS));
// Un punto sulla scia può essere un aggiornamento, una proposta o una
// decisione. Senza migration-11 esiste solo il primo tipo.
const kindOf = (u) => (hasProposte && u.kind) || "agg";
const votesOf = (uid) => focusVotes.filter(v => v.update_id === uid);
const commentsOf = (uid) => focusComments.filter(c => c.update_id === uid).sort((a, b) => a.id - b.id);
const proposteAperte = (fid) => updOf(fid).filter(u => kindOf(u) === "proposta");
const giorniDa = (iso) => Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
const apertaDa = (g) => g <= 0 ? "aperta oggi" : g === 1 ? "aperta da 1 giorno" : `aperta da ${g} giorni`;
function silenceOf(f) {
  const u = updOf(f.id);
  return weeksSince(u.length ? updDate(u[u.length - 1]) : f.created_at);
}
function focusState(f) {
  if (f.status === "concluso") return { k: "con", lab: "concluso" };
  if (f.status === "abbandonato") return { k: "abb", lab: "abbandonato" };
  const s = silenceOf(f);
  if (s >= 5) return { k: "fer", lab: "fermo" };
  if (s >= 2) return { k: "ral", lab: "rallentato" };
  return { k: "att", lab: "attivo" };
}
const FS_ORD = { fer: 0, ral: 1, att: 2, con: 3, abb: 4 };
const FS_COLOR = { att: "var(--accent)", ral: "var(--warn)", fer: "var(--danger)", con: "var(--ok)", abb: "var(--muted)" };
const focusSorted = () => focusList.slice().sort((a, b) =>
  (FS_ORD[focusState(a).k] - FS_ORD[focusState(b).k]) || (silenceOf(b) - silenceOf(a)));

function silenceText(f) {
  if (f.status !== "attivo") return f.status;
  const s = silenceOf(f);
  return s === 0 ? "aggiornato questa settimana"
    : s === 1 ? "1 settimana di silenzio" : `${s} settimane di silenzio`;
}
// dieci settimane: 0 la più vecchia, 9 questa
function stripHtml(f, color) {
  const idx = updOf(f.id).map(u => 9 - weeksSince(updDate(u))).filter(i => i >= 0 && i <= 9);
  const first = idx.length ? Math.min(...idx) : 99;
  const last = idx.length ? Math.max(...idx) : -1;
  let out = "";
  for (let i = 0; i <= 9; i++) {
    const cls = idx.includes(i) ? "on" : i < first ? "pre" : i > last ? "aft" : "";
    out += `<i class="${cls}"></i>`;
  }
  return `<span class="strip" style="--sc:${color}">${out}</span>`;
}

function renderFocus(main) {
  if (!hasFocus) {
    main.innerHTML = `
      <div class="empty-big">
        <div class="glyph">📈</div>
        <h2>Quasi pronto</h2>
        <p>Manca l'ultimo passaggio sul database.<br>Esegui <strong>migration-7.sql</strong> e questa sezione si accende da sola.</p>
      </div>`;
    return;
  }
  if (openFocusId) return renderFocusDetail(main);

  const list = focusSorted();
  const nFermi = list.filter(f => focusState(f).k === "fer").length;
  const nAttivi = list.filter(f => focusState(f).k === "att").length;

  main.innerHTML = `
    <div class="section-head"><h2>Cosa stiamo portando avanti</h2>
      <button class="small" id="add-focus">+ Nuovo</button></div>
    ${list.length ? `<div class="sub" style="margin:0 4px 12px">${nAttivi} in movimento${nFermi ? ` · ${nFermi} fermi da oltre un mese` : ""}</div>` : ""}
    ${list.length ? list.map(f => {
      const st = focusState(f);
      const nd = proposteAperte(f.id).length;
      return `<button type="button" class="f-card2" data-focus="${f.id}">
        <span class="row spread" style="width:100%;align-items:flex-start;gap:10px">
          <span class="f-name2">${esc(f.name)}</span>
          <span class="fstate fs-${st.k}">${st.lab}</span>
        </span>
        ${f.goal ? `<span class="sub">${esc(f.goal)}</span>` : ""}
        <span class="strip-row">${stripHtml(f, FS_COLOR[st.k])}
          <span class="fmetric">${nd ? `${nd} da decidere` : esc(silenceText(f))}</span></span>
      </button>`;
    }).join("") : `<div class="empty">Nessun focus ancora.<br>Aggiungine uno con “+ Nuovo”.</div>`}`;

  $("#add-focus").onclick = () => openFocusForm(null);
  main.querySelectorAll("[data-focus]").forEach(b => {
    b.onclick = () => { openFocusId = b.dataset.focus; render(); };
  });
}

        <button class="small" id="add-upd">+ Aggiornamento</button>
        ${hasProposte ? `<button class="ghost small" id="add-prop">+ Proposta</button>` : ""}
        <button class="ghost small" id="edit-focus">Modifica</button>
      </div>
    </div>
    ${aperte.length ? `
      <div class="area-head" style="margin-top:22px">
        <span>Da decidere</span><span class="ac">${aperte.length}</span></div>
      ${aperte.map(propostaCard).join("")}` : ""}

      ${decise.map(decisioneCard).join("")}` : ""}
    <div class="sub" style="margin:22px 4px 8px">${ups.length} aggiornament${ups.length === 1 ? "o" : "i"} · ${esc(silenceText(f))}</div>
    ${ups.length ? `<div class="feed">${ups.map(u => {
      const quando = updDate(u);
      return `<button type="button" class="fitem" data-upd="${u.id}">
        <span class="fdot2" style="background:${FS_COLOR[st.k]}"></span>
        <span class="ftxt">
          <span class="fwk">${esc(fmtDate(String(quando).slice(0, 10)))}</span>
          <span class="fbody">${esc(u.body)}</span>
          <span class="fauth">${esc(u.actor_name)}</span>
        </span>
        <span class="fchev">›</span>
      </button>`;
    }).join("")}</div>`
      : `<div class="empty">Ancora nessun aggiornamento.<br>Il primo racconta da dove si parte.</div>`}`;

  $("#f-back").onclick = () => { openFocusId = null; render(); };
  $("#add-upd").onclick = () => openUpdForm(f, null);
  if ($("#add-prop")) $("#add-prop").onclick = () => openPropForm(f, null);
  $("#edit-focus").onclick = () => openFocusForm(f);
  main.querySelectorAll("[data-upd]").forEach(b => {
    b.onclick = () => openUpdForm(f, focusUpd.find(u => u.id === Number(b.dataset.upd)));
  });
  const riga = (id) => focusUpd.find(u => String(u.id) === String(id));
  main.querySelectorAll("[data-editp]").forEach(b => {
    b.onclick = () => openPropForm(f, riga(b.dataset.editp));

  main.querySelectorAll("[data-decidi]").forEach(b => {

  main.querySelectorAll("[data-riapri]").forEach(b => {

  main.querySelectorAll("[data-cadd]").forEach(b => {

  main.querySelectorAll("[data-cin]").forEach(i => {

// Una proposta si vota col nome: si vede subito chi manca all'appello.
function votiHtml(u, chiuso) {
  const v = votesOf(u.id);
  const su = v.filter(x => x.value === 1), giu = v.filter(x => x.value === -1);
  const mio = v.find(x => x.actor_name === me?.name)?.value || 0;
  const nomi = (arr) => arr.map(x => x.actor_name).join(", ");
  // A decisione presa il conteggio resta, ma come fatto: niente bottoni
  // che sembrano premibili e non fanno niente.
  return `${chiuso
    ? (su.length || giu.length ? `<div class="tally">👍 ${su.length} · 👎 ${giu.length}</div>` : "")
    : `<div class="votes">
      <button type="button" class="vote up" data-vote="${u.id}" data-val="1"
        aria-pressed="${mio === 1}">👍 ${su.length}</button>
      <button type="button" class="vote down" data-vote="${u.id}" data-val="-1"
        aria-pressed="${mio === -1}">👎 ${giu.length}</button>
    </div>`}
    ${su.length || giu.length ? `<div class="voters">${
      su.length ? `👍 ${esc(nomi(su))}` : ""}${su.length && giu.length ? "<br>" : ""}${
      giu.length ? `👎 ${esc(nomi(giu))}` : ""}</div>` : ""}`;
}

function commentiHtml(u) {
  const cs = commentsOf(u.id);
  return `${cs.map(c => `<div class="reply"><b>${esc(c.actor_name)}</b>
      <span class="sub">· ${fmtTs(c.created_at)}</span><br>${esc(c.body)}</div>`).join("")}
    <div class="creply">
      <input type="text" data-cin="${u.id}" placeholder="Scrivi un commento" autocomplete="off">
      <button class="ghost small" data-cadd="${u.id}">Invia</button>
    </div>`;
}

function decisioneCard(u) {

// Un voto si cambia e si ritira: ributtandoci sopra lo stesso pollice sparisce.
async function vota(u, val) {
  if (!u) return;
  const mio = votesOf(u.id).find(v => v.actor_name === me.name);
  let error = null;
  if (mio && mio.value === val) ({ error } = await db.from("focus_votes").delete().eq("id", mio.id));
  else if (mio) ({ error } = await db.from("focus_votes").update({ value: val }).eq("id", mio.id));
  else ({ error } = await db.from("focus_votes").insert({
    update_id: u.id, actor_id: me.id, actor_name: me.name, value: val,
  }));
  if (error) { toast("Errore nel salvataggio"); return; }
  await refresh();
}

async function commenta(u) {
  if (!u) return;
  const input = $(`[data-cin="${u.id}"]`);
  const body = (input?.value || "").trim();
  if (body.length < 2) { toast("Scrivi il commento"); return; }
  const { error } = await db.from("focus_comments").insert({
    update_id: u.id, body, actor_id: me.id, actor_name: me.name,
  });
  if (error) { toast("Errore nel salvataggio"); return; }
  input.value = "";
  await refresh();
}

function openPropForm(f, u) {
  openDialog(u ? "Modifica proposta" : "Proposta", `

      // e con lei voti e commenti se un giorno diventa proposta.
      if (u && hasProposte) {

        const { error } = await db.from("focus_updates")

        if (error) { toast("Errore nel salvataggio"); return; }

        };

    });

      await log(`ha aggiunto ${name} (${role === "pro" ? "Pro" : "Expert"}) al team`);
      await refresh();
    });

  main.querySelectorAll("[data-act=toggle-role]").forEach(b => {
    b.onclick = async () => {
      const p = people.find(x => x.id === b.dataset.id);
      const role = p.role === "pro" ? "expert" : "pro";

      await log(`ha impostato ${p.name} come ${role === "pro" ? "Pro" : "Expert"}`);
      await refresh();
    };
  });
  main.querySelectorAll("[data-act=del-person]").forEach(b => {
    b.onclick = async () => {
      const p = people.find(x => x.id === b.dataset.id);
      if (!confirm(`Eliminare ${p.name} dal team?\nLe attività già registrate nello Storico restano.`)) return;
      const { error } = await db.from("people").delete().eq("id", p.id);
      if (error) { toast("Errore nell'eliminazione"); return; }
      await log(`ha eliminato ${p.name} dal team`);
      if (me?.id === p.id) {
        localStorage.removeItem("whoami"); me = null;
        await loadAll(); showWhoami(); return;
      }
      await refresh();
    };
  });
}

// Ogni progetto attivo è un tab a sé. Dentro, l'unità di lavoro è
// il gruppo che copre un turno: il brief e il debrief sono suoi.
const ROLES = ["Specialist", "Point", "Brief/Debrief"];
const KINDS = ["osservazione", "idea", "problema", "domanda"];
// Le due liste del debrief: si scrivono, una riga alla volta.
const LISTE = [
  { k: "good",   titolo: "✅ Cosa è andato bene", ph: "es. il Point ha portato le persone al tavolo" },
  { k: "bad",    titolo: "⚠️ Cosa ha ostacolato", ph: "es. troppo rumore vicino alla cassa" },
  { k: "demo",   titolo: "💡 Demo che hanno funzionato", ph: "es. intelligenza visiva sulle scarpe" },
  { k: "phrase", titolo: "🗣 Frasi che hanno fatto ingaggiare", ph: "es. “Che dispositivo utilizzi?”" },
];
const lista = (k) => LISTE.find(x => x.k === k) || LISTE[0];
// I numeri del gruppo, sommati sui debrief di quel turno
const ultimoDebrief = (slotId) => {
  const dbs = debriefsOf(slotId);
  return dbs.length ? dbs[dbs.length - 1] : null;
};
function numeriDi(slotId) {
  const d = ultimoDebrief(slotId);
  return { conn: d?.reached ?? null, conv: d?.conversions ?? null, quanti: d ? 1 : 0 };
}
// Un turno è debriefato quando qualcosa è stato scritto, non quando
// esiste una riga: così lo stato lo governano i campi.
const compilato = (slotId) => {
  const n = numeriDi(slotId);
  return n.conn != null || n.conv != null || LISTE.some(l => pointsOf(slotId, l.k).length);
};

const projectOf = (id) => projects.find(p => p.id === id) || null;
const itemsOf = (pr, kind) => projItems
  .filter(i => i.project_id === pr.id && i.kind === kind && i.active)
  .sort((a, b) => a.position - b.position);
const slotsOf = (pr) => slots.filter(s => s.project_id === pr.id)
  .sort((a, b) => (a.date + (a.start_time || "")).localeCompare(b.date + (b.start_time || "")));
const crewOf = (slotId) => slotPeople.filter(x => x.slot_id === slotId).sort((a, b) => a.position - b.position);
const roleNames = (slotId, role) => crewOf(slotId).filter(x => x.role === role).map(x => x.person_name);
const debriefsOf = (slotId) => debriefs.filter(d => d.slot_id === slotId);
const pointsOf = (slotId, kind) => shiftPoints.filter(x => x.slot_id === slotId && x.kind === kind);
const briefsOf = (slotId) => briefs.filter(b => b.slot_id === slotId);
const projDebriefs = (pr) => debriefs.filter(d => d.project_id === pr.id);
const repliesOf = (insightId) => replies.filter(r => r.insight_id === insightId);

// Il nome del gruppo sono gli specialist: è così che li chiamate.
const groupName = (s) => roleNames(s.id, "Specialist").join(", ") || "Gruppo da assegnare";
const slotHours = (s) => s.start_time ? `${s.start_time}–${s.end_time || ""}`.replace(/–$/, "") : "";
const slotOf = (id) => slots.find(s => s.id === id) || null;
const daysFromToday = (d) => Math.round((new Date(d + "T00:00:00") - new Date(todayStr() + "T00:00:00")) / 86400000);
const projPeriod = (pr) => pr.starts_on ? `${fmtDateShort(pr.starts_on)} – ${fmtDateShort(pr.ends_on)}` : "";

function slotState(s) {
  if (compilato(s.id)) return { cls: "done", label: "Debriefato" };
  const t = todayStr();
  if (s.date < t) return { cls: "", label: "Da debriefare" };
  return { cls: "soft", label: s.date === t ? "Oggi" : "In programma" };
}

function renderProject(main, pr) {
  const seg = `
    <div class="seg" role="group" aria-label="Vista">
      <button type="button" data-pseg="turni" aria-pressed="${pSeg === "turni"}">Turni</button>
      <button type="button" data-pseg="spunti" aria-pressed="${pSeg === "spunti"}">Spunti</button>
    </div>`;
  if (pSeg === "spunti") renderProjectSpunti(main, pr, seg);
  else renderProjectTurni(main, pr, seg);
}

// ── Turni ───────────────────────────────────────────────────
function renderProjectTurni(main, pr, seg) {
  const list = slotsOf(pr), today = todayStr();
  const oggi = list.filter(s => s.date === today);

  // L'elenco comincia da oggi e i giorni già debriefati scendono in
  // fondo, sempre in vista: si correggono con un tocco, senza aprire
  // niente. Un turno passato senza debrief resta in mezzo agli altri,
  // perché è ancora da fare.
  const finito = (s) => s.date < today && compilato(s.id);
  const correnti = list.filter(s => !finito(s));
  const archivio = list.filter(finito).reverse();
  const nTodo = list.filter(s => s.date < today && !compilato(s.id)).length;

  const perGiorno = (elenco) => {
    const groups = [];
    elenco.forEach(s => {
      const g = groups[groups.length - 1];
      if (g && g.date === s.date) g.items.push(s);
      else groups.push({ date: s.date, items: [s] });
    });
    return groups.map(g => `
      <div class="date-head ${g.date === today ? "today" : ""}">
        ${g.date === today ? "Oggi · " : ""}${fmtDate(g.date)}</div>
      ${g.items.map(s => slotCard(pr, s)).join("")}`).join("");
  };

  const cal = perGiorno(correnti);
  const passati = archivio.length ? `
    <div class="area-head" style="margin-top:26px">
      <span>Turni già debriefati</span><span class="ac">${archivio.length}</span></div>
    ${perGiorno(archivio)}` : "";

  const sottotitolo = oggi.length
    ? `Oggi: ${oggi.map(groupName).join(" · ")}`
    : nTodo ? `${nTodo} ${nTodo === 1 ? "gruppo" : "gruppi"} senza debrief`
    : projPeriod(pr);

  main.innerHTML = seg + `
    <div class="menu2">
      <button type="button" class="big" id="go-brief"><span>📋</span>Brief</button>
    </div>
    <div class="sub menu2-sub">${esc(sottotitolo)}</div>

    <div class="section-head" style="margin-top:20px"><h2>Turni</h2>
      <button class="small ghost" id="add-slot">+ Turno</button></div>
    ${cal || `<div class="empty">${archivio.length
      ? "Da oggi in avanti non c'è nessun turno.<br>Aggiungine uno con “+ Turno”."
      : "Nessun turno ancora.<br>Aggiungine uno con “+ Turno”."}</div>`}
    ${passati}`;

  $("#go-brief").onclick = () => pickGroup(pr, "Brief di quale gruppo?", s => openBriefDialog(pr, s));

  $("#add-slot").onclick = () => openDialog("Nuovo turno", slotFields(pr, null),
    async (fd) => {
      const { data, error } = await db.from("project_slots").insert({
        project_id: pr.id,
        date: fd.get("date"),
        start_time: fd.get("start_time") || null,
        end_time: fd.get("end_time") || null,
        note: (fd.get("note") || "").trim() || null,
      }).select().single();
      if (error) { toast("Errore nel salvataggio"); return false; }
      await saveCrew(data.id, fd);
      await log(`ha aggiunto un turno ${pr.name} del ${fmtDateShort(data.date)}`);
      await refresh();
    });

  main.querySelectorAll("[data-slot-toggle]").forEach(el => {
    el.onclick = () => {
      const id = el.dataset.slotToggle;
      openSlot.has(id) ? openSlot.delete(id) : openSlot.add(id);
      render();
    };
  });
  main.querySelectorAll("[data-num]").forEach(inp => {
    inp.onchange = () => salvaNumeri(pr, inp.dataset.id);
  });
  const aggiungiPunto = async (slotId, kind, inp) => {
    const text = inp.value.trim();
    if (text.length < 2) { inp.focus(); return; }
    const { error } = await db.from("shift_points").insert({
      slot_id: slotId, kind, text, actor_id: me.id, actor_name: me.name,
    });
    if (error) { toast("Errore nel salvataggio"); return; }
    inp.value = "";
    await refresh();
  };
  main.querySelectorAll(".pt-in").forEach(inp => {
    inp.onkeydown = (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      aggiungiPunto(inp.dataset.id, inp.dataset.kind, inp);
    };
  });
  main.querySelectorAll("[data-act=add-point]").forEach(b => {
    b.onclick = () => aggiungiPunto(b.dataset.id, b.dataset.kind,
      b.parentElement.querySelector(".pt-in"));
  });
  main.querySelectorAll("[data-act=del-point]").forEach(b => {
    b.onclick = async () => {
      if (!confirm("Togliere questo punto?")) return;
      await db.from("shift_points").delete().eq("id", Number(b.dataset.id));
      await refresh();
    };
  });
  main.querySelectorAll("[data-act=edit-slot]").forEach(b => {
    b.onclick = () => {
      const s = slotOf(b.dataset.id);
      openDialog("Modifica turno", slotFields(pr, s) + `
        <div class="row" style="margin-top:14px">
          <button type="button" class="danger small" id="dlg-del-slot">Elimina questo turno</button>
        </div>`,
        async (fd) => {
          const { error } = await db.from("project_slots").update({
            note: (fd.get("note") || "").trim() || null,
            updated_at: new Date().toISOString(),
          }).eq("id", s.id);
          if (error) { toast("Errore nel salvataggio"); return false; }
          await saveCrew(s.id, fd);
          await log(`ha modificato il turno ${pr.name} del ${fmtDateShort(s.date)}`);
          await refresh();
        },
        (form) => {
          form.querySelector("#dlg-del-slot").onclick = async () => {
            if (!confirm(`Eliminare il turno di ${groupName(s)} del ${fmtDateShort(s.date)}?`)) return;
            await db.from("project_slots").delete().eq("id", s.id);
            await log(`ha eliminato il turno ${pr.name} del ${fmtDateShort(s.date)}`);
            $("#dlg").close();
            await refresh();
          };
        });
    };
  });
}

function slotCard(pr, s) {
  const st = slotState(s);
  const archiviato = s.date < todayStr() && compilato(s.id);
  const point = roleNames(s.id, "Point");
  const sotto = [slotHours(s), point.length ? `Point ${point.join(", ")}` : null]
    .filter(Boolean).join(" · ");
  const aperta = openSlot.has(s.id);
  const bfs = briefsOf(s.id);
  const n = numeriDi(s.id);

  const riepilogo = !aperta && n.quanti
    ? `<div class="row" style="gap:10px;margin-top:8px">
         <span class="pt-count conn">👥 ${n.conn ?? "–"} connessioni</span>
         <span class="pt-count conv">🛍 ${n.conv ?? "–"} conversion</span>
       </div>` : "";

  return `<div class="card${archiviato ? " fatto" : ""}">
    <div class="row spread dd-summary slot-head" data-slot-toggle="${s.id}">
      <div style="min-width:0">
        <h3>${esc(groupName(s))}</h3>
        <div class="sub">${esc(sotto)}</div>
        ${riepilogo}
      </div>
      <span class="badge ${st.cls}">${esc(st.label)}</span>
    </div>
    ${!aperta ? "" : `
      ${ROLES.filter(r => r !== "Specialist").map(r => {
        const n = roleNames(s.id, r);
        return n.length ? `<div class="role-line"><b>${esc(r)}</b><span>${esc(n.join(", "))}</span></div>` : "";
      }).join("")}
      ${s.note ? `<div class="manager-line">📝 ${esc(s.note)}</div>` : ""}
      ${bfs.length ? `<div class="manager-line">📋 Brief fatto da ${esc(bfs.map(b => b.person_name).join(", "))}</div>` : ""}
      <div class="num-grid" style="margin-top:12px">
        <label>Connessioni<input type="number" min="0" inputmode="numeric" placeholder="—"
          data-num="reached" data-id="${s.id}" value="${n.conn ?? ""}"></label>
        <label>Conversion<input type="number" min="0" inputmode="numeric" placeholder="—"
          data-num="conversions" data-id="${s.id}" value="${n.conv ?? ""}"></label>
      </div>
      ${LISTE.map(l => pointBlock(s, l.k)).join("")}
      <div class="row" style="margin-top:14px">
        <span style="flex:1"></span>
        <button class="ghost small" data-act="edit-slot" data-id="${s.id}">Modifica turno</button>
      </div>`}
  </div>`;
}

// Le vecchie demo e frasi, quando erano campi liberi del debrief,
// restano leggibili in coda alla lista che le ha sostituite.
const vecchie = (slotId, kind) => {
  const campo = kind === "demo" ? "best_demo" : kind === "phrase" ? "icebreaker" : null;
  if (!campo) return [];
  return [...new Set(debriefsOf(slotId).map(d => (d[campo] || "").trim()).filter(Boolean))];
};

function pointBlock(s, kind) {
  const list = pointsOf(s.id, kind);
  const storiche = vecchie(s.id, kind);
  return `<div class="pt-block">
    <div class="pt-head">${lista(kind).titolo}</div>
    ${list.map(pt => `<div class="pt-row">
        <span>${esc(pt.text)}</span>
        <button class="pt-x" data-act="del-point" data-id="${pt.id}" title="Togli">×</button>
      </div>`).join("")}
    ${storiche.map(t => `<div class="pt-row"><span>${esc(t)}</span></div>`).join("")}
    <div class="add-row" style="margin-top:8px">
      <input type="text" class="pt-in" placeholder="${lista(kind).ph}" autocomplete="off"
        data-kind="${kind}" data-id="${s.id}">
      <button class="pl-add" data-act="add-point" data-kind="${kind}" data-id="${s.id}">+</button>
    </div>
  </div>`;
}

async function salvaNumeri(pr, slotId) {
  const leggi = (campo) => {
    const el = document.querySelector(`[data-num="${campo}"][data-id="${slotId}"]`);
    const v = (el?.value || "").trim();
    return v === "" ? null : parseInt(v, 10);
  };
  const reached = leggi("reached"), conversions = leggi("conversions");
  const prima = numeriDi(slotId);
  if (reached === prima.conn && conversions === prima.conv) return;

  const { error } = await db.from("debriefs").insert({
    project_id: pr.id, slot_id: slotId,
    author_id: me.id, author_name: me.name,
    reached, conversions,
  });
  if (error) { toast("Errore nel salvataggio"); return; }
  const s = slotOf(slotId);
  await log(`ha segnato i numeri del gruppo ${groupName(s)} del ${fmtDateShort(s.date)}`);
  toast("Numeri salvati");
  await refresh();
}

// ── Scegliere il gruppo ─────────────────────────────────────
// Se c'è un solo turno oggi si salta il passaggio: è quasi sempre quello.
function pickGroup(pr, titolo, onPick) {
  const list = slotsOf(pr);
  if (!list.length) { toast("Nessun turno: aggiungine uno"); return; }
  const oggi = list.filter(s => s.date === todayStr());
  if (oggi.length === 1) return onPick(oggi[0]);

  const vicini = list.slice().sort((a, b) =>
    Math.abs(daysFromToday(a.date)) - Math.abs(daysFromToday(b.date)) ||
    (a.start_time || "").localeCompare(b.start_time || ""));

  openDialog(titolo, `<div class="pick-list">${vicini.map(s => {
      const d = daysFromToday(s.date);
      const quando = d === 0 ? "oggi" : d === -1 ? "ieri" : d === 1 ? "domani" : fmtDateShort(s.date);
      return `<button type="button" class="pick" data-pick="${s.id}">
        <span class="pick-name">${esc(groupName(s))}</span>
        <span class="pick-meta">${esc(quando)} · ${esc(slotHours(s))}</span>
      </button>`;
    }).join("")}</div>`,
    null,
    (form) => {
      form.querySelector("button[type=submit]").style.display = "none";
      form.querySelectorAll("[data-pick]").forEach(b => {
        b.onclick = () => { $("#dlg").close(); onPick(slotOf(b.dataset.pick)); };
      });
    });
}

// ── Brief ───────────────────────────────────────────────────
function openBriefDialog(pr, s) {
  if (!s) return;
  const punti = itemsOf(pr, "brief").map(i => i.label);
  const mio = briefsOf(s.id).find(b => b.person_name === me?.name);

  openDialog(`Brief · ${groupName(s)}`, `
      <p class="sub">${esc(fmtDate(s.date))} · ${esc(slotHours(s))}</p>
      <div class="field"><label>Prima di iniziare</label>
        ${punti.map((p, i) => `<label class="chk">
          <input type="checkbox" name="b${i}" ${mio && (mio.items || []).includes(p) ? "checked" : ""}>
          <span>${esc(p)}</span></label>`).join("")}
      </div>
`,
    async (fd) => {
      const items = punti.filter((p, i) => fd.get("b" + i));
      const { error } = await db.from("briefs").upsert({
        slot_id: s.id, person_id: me.id, person_name: me.name, items,
      }, { onConflict: "slot_id,person_name" });
      if (error) { toast("Errore nel salvataggio"); return false; }
      await log(`ha fatto il brief del gruppo ${groupName(s)} del ${fmtDateShort(s.date)}`);
      toast(`Brief ${items.length}/${punti.length}`);
      openSlot.add(s.id);
      await refresh();
    });
}

// ── Turni: campi e salvataggio ──────────────────────────────
// Nel turno già esistente si cambiano i contenuti: quando è, resta com'è.
function slotFields(pr, s) {
  return `
    ${s ? `<p class="sub">${esc(fmtDate(s.date))} · ${esc(slotHours(s))}</p>` : `
    <div class="field"><label>Data *</label>
      <input type="date" name="date" value="${todayStr()}" required></div>
    <div class="row" style="gap:10px">
      <div class="field" style="flex:1"><label>Dalle</label>
        <input type="time" name="start_time" value="16:00"></div>
      <div class="field" style="flex:1"><label>Alle</label>
        <input type="time" name="end_time" value="18:00"></div>
    </div>`}
    ${ROLES.map(r => `<div class="field"><label>${r}</label>
      <input type="text" name="role_${r}" value="${esc(roleNames(s?.id, r).join(", "))}"
        placeholder="Nomi separati da virgola" autocomplete="off">
    </div>`).join("")}
    <div class="field"><label>Note</label>
      <input type="text" name="note" value="${esc(s?.note || "")}" placeholder="es. brief 16:00-16:15"></div>`;
}

async function saveCrew(slotId, fd) {
  await db.from("slot_people").delete().eq("slot_id", slotId);
  const rows = [];
  ROLES.forEach(r => (fd.get("role_" + r) || "").split(",").map(x => x.trim()).filter(Boolean)
    .forEach((nm, i) => rows.push({
      slot_id: slotId, role: r, person_name: nm,
      person_id: people.find(p => p.name === nm)?.id || null, position: i,
    })));
  if (rows.length) await db.from("slot_people").insert(rows);
}

function chipRow(name, values, current, multi) {
  const sel = multi ? (current || []) : (current ? [current] : []);
  return `<div class="chips" data-chips="${name}" data-multi="${multi ? 1 : 0}">
    ${values.map(v => `<button type="button" class="fchip" data-v="${esc(v)}"
        aria-pressed="${sel.includes(v)}">${esc(v)}</button>`).join("")}
    <input type="hidden" name="${name}" value="${esc(multi ? JSON.stringify(sel) : (current || ""))}">
  </div>`;
}

function wireChips(form) {
  form.querySelectorAll("[data-chips]").forEach(box => {
    const hidden = box.querySelector("input[type=hidden]");
    const multi = box.dataset.multi === "1";
    box.querySelectorAll("button[data-v]").forEach(b => {
      b.onclick = () => {
        if (multi) {
          const cur = JSON.parse(hidden.value || "[]");
          const i = cur.indexOf(b.dataset.v);
          if (i < 0) cur.push(b.dataset.v); else cur.splice(i, 1);
          hidden.value = JSON.stringify(cur);
          b.setAttribute("aria-pressed", i < 0);
        } else {
          const on = b.getAttribute("aria-pressed") === "true";
          box.querySelectorAll("button[data-v]").forEach(x => x.setAttribute("aria-pressed", "false"));
          b.setAttribute("aria-pressed", !on);
          hidden.value = on ? "" : b.dataset.v;
        }
      };
    });
  });
}

// Sul telefono apre il foglio di condivisione; sul computer copia negli
// appunti; se anche quello non si può, il testo si mostra da copiare a mano.
async function condividiTesto(titolo, testo) {
  if (navigator.share) {
    try { await navigator.share({ title: titolo, text: testo }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  try {
    await navigator.clipboard.writeText(testo);
    toast("Riepilogo copiato");
    return;
  } catch { /* niente appunti: sotto lo mostriamo */ }
  openDialog(titolo, `<div class="field">
      <textarea rows="12" readonly style="font-size:.82rem">${esc(testo)}</textarea></div>`,
    null, (form) => { form.querySelector("button[type=submit]").style.display = "none"; });
}

// ── Spunti ──────────────────────────────────────────────────
function renderProjectSpunti(main, pr, seg) {
  const turni = slotsOf(pr);
  const ids = new Set(turni.map(s => s.id));
  const dbs = projDebriefs(pr);
  const ultimi = turni.map(s => ultimoDebrief(s.id)).filter(Boolean);
  const somma = (k) => ultimi.reduce((a, d) => a + (d[k] || 0), 0);
  const conDebrief = turni.filter(s => compilato(s.id)).length;

  const punti = shiftPoints.filter(x => ids.has(x.slot_id));
  const perTipo = (k) => punti.filter(x => x.kind === k).slice().reverse();
  const good = perTipo("good"), bad = perTipo("bad");
  const riga = (pt) => {
    const s = slotOf(pt.slot_id);
    return `<div class="pt-row big">
      <span>${esc(pt.text)}
        <em>${s ? esc(groupName(s)) + " · " + esc(fmtDateShort(s.date)) : ""}</em></span>
    </div>`;
  };

  // demo e frasi: le liste di oggi più i campi liberi di quando lo erano
  const conStoriche = (kind, campo) => [
    ...perTipo(kind),
    ...dbs.filter(d => (d[campo] || "").trim())
      .map(d => ({ text: d[campo].trim(), slot_id: d.slot_id, id: "d" + d.id })).reverse(),
  ];
  const demoTop = conStoriche("demo", "best_demo");
  const frasiTop = conStoriche("phrase", "icebreaker");

  // gli elenchi lunghi restano corti finché non li apri
  const LIMITE = 10;
  const elenco = (list, kind) => {
    const visibili = tuttiPunti[kind] ? list : list.slice(0, LIMITE);
    return `<div class="card" style="padding:6px 12px">${visibili.map(riga).join("")}</div>
      ${list.length > LIMITE ? `<button class="ghost small" data-tutti="${kind}" style="margin:2px 2px 4px">${
        tuttiPunti[kind] ? "Mostra meno" : `Vedi tutti e ${list.length}`}</button>` : ""}`;
  };

  const spunti = insights.filter(i => i.project_id === pr.id)
    .sort((a, b) => (a.resolved - b.resolved) || (b.id - a.id));

  // Il riepilogo da mandare al team: le stesse cose che si leggono qui,
  // in un testo che si incolla ovunque.
  const elencoTesto = (titolo, righe) => righe.length
    ? `\n${titolo}\n` + righe.map(x => {
        const t = slotOf(x.slot_id);
        return `• ${x.text}${t ? ` (${groupName(t)}, ${fmtDateShort(t.date)})` : ""}`;
      }).join("\n") + "\n"
    : "";
  const testo = [
    `${pr.full_name || pr.name}${projPeriod(pr) ? " · " + projPeriod(pr) : ""}`,
    `${conDebrief} gruppi con debrief · ${somma("reached")} connessioni · ${somma("conversions")} conversion`,
    elencoTesto("✅ COSA È ANDATO BENE", good),
    elencoTesto("⚠️ COSA HA OSTACOLATO", bad),
    elencoTesto("💡 DEMO CHE HANNO FUNZIONATO", demoTop),
    elencoTesto("🗣 FRASI CHE HANNO FATTO INGAGGIARE", frasiTop),
    spunti.length ? `\nSPUNTI\n` + spunti.map(i =>
      `• [${i.kind}] ${i.text}${repliesOf(i.id).map(r => `\n   ↳ ${r.author_name}: ${r.text}`).join("")}`).join("\n") : "",
  ].filter(Boolean).join("\n");

  main.innerHTML = seg + `
    <div class="stats">
      <div class="stat"><b>${conDebrief}</b><span>Gruppi</span></div>
      <div class="stat"><b>${somma("reached")}</b><span>Connessioni</span></div>
      <div class="stat"><b>${somma("conversions")}</b><span>Conversion</span></div>
    </div>
    <button class="ghost" id="condividi" style="width:100%;margin-bottom:6px">📤 Condividi il riepilogo</button>

    <div class="area-head"><span>✅ Cosa è andato bene</span><span class="ac">${good.length}</span></div>
    ${good.length ? elenco(good, "good") : `<div class="empty">Ancora niente: esce dai debrief.</div>`}

    <div class="area-head"><span>⚠️ Cosa ha ostacolato</span><span class="ac">${bad.length}</span></div>
    ${bad.length ? elenco(bad, "bad") : ""}

    ${demoTop.length ? `<div class="area-head"><span>💡 Demo che hanno funzionato</span><span class="ac">${demoTop.length}</span></div>
      ${elenco(demoTop, "demo")}` : ""}

    ${frasiTop.length ? `<div class="area-head"><span>🗣 Frasi che hanno fatto ingaggiare</span><span class="ac">${frasiTop.length}</span></div>
      ${elenco(frasiTop, "phrase")}` : ""}

    <div class="section-head" style="margin-top:22px"><h2>Spunti liberi</h2>
      <button class="small" id="add-insight">+ Spunto</button></div>
    ${spunti.length ? spunti.map(insightCard).join("")
      : `<div class="empty">Niente per ora.</div>`}`;

  $("#condividi").onclick = () => condividiTesto(`${pr.full_name || pr.name} · riepilogo`, testo);

  main.querySelectorAll("[data-tutti]").forEach(b => {
    b.onclick = () => { tuttiPunti[b.dataset.tutti] = !tuttiPunti[b.dataset.tutti]; render(); };
  });

  $("#add-insight").onclick = () => openDialog("Nuovo spunto", `
      <div class="field"><label>Che tipo è</label>${chipRow("kind", KINDS, "osservazione", false)}</div>
      <div class="field"><label>Lo spunto</label>
        <textarea name="text" rows="3" required placeholder="es. col cliente indeciso funziona partire dalla fotocamera"></textarea></div>`,
    async (fd) => {
      const text = (fd.get("text") || "").trim();
      if (text.length < 3) { toast("Scrivi lo spunto"); return false; }
      const { error } = await db.from("insights").insert({
        project_id: pr.id, kind: fd.get("kind") || "osservazione", text,
        author_id: me.id, author_name: me.name,
      });
      if (error) { toast("Errore nel salvataggio"); return false; }
      await log(`ha aggiunto uno spunto a ${pr.name}: ${text.slice(0, 60)}`);
      toast("Spunto salvato");
      await refresh();
    }, wireChips);

  main.querySelectorAll("[data-act=reply]").forEach(b => {
    b.onclick = () => {
      const i = insights.find(x => x.id === Number(b.dataset.id));
      openDialog("Rispondi", `
        <p class="sub">${esc(i.text)}</p>
        <div class="field"><label>La tua risposta</label>
          <textarea name="text" rows="3" required></textarea></div>`,
        async (fd) => {
          const text = (fd.get("text") || "").trim();
          if (text.length < 2) { toast("Scrivi la risposta"); return false; }
          const { error } = await db.from("insight_replies").insert({
            insight_id: i.id, text, author_id: me.id, author_name: me.name,
          });
          if (error) { toast("Errore nel salvataggio"); return false; }
          await refresh();
        });
    };
  });
  main.querySelectorAll("[data-act=resolve]").forEach(b => {
    b.onclick = async () => {
      const i = insights.find(x => x.id === Number(b.dataset.id));
      const { error } = await db.from("insights").update({ resolved: !i.resolved }).eq("id", i.id);
      if (error) { toast("Errore nel salvataggio"); return; }
      await refresh();
    };
  });
  main.querySelectorAll("[data-act=del-insight]").forEach(b => {
    b.onclick = async () => {
      if (!confirm("Eliminare questo spunto?")) return;
      await db.from("insights").delete().eq("id", Number(b.dataset.id));
      await refresh();
    };
  });
}

function insightCard(i) {
  const rs = repliesOf(i.id);
  return `<div class="card">
    <div class="row spread">
      <span class="row" style="gap:6px">
        <span class="kind ${esc(i.kind)}">${esc(i.kind)}</span>
        ${i.resolved ? `<span class="badge done">Chiusa</span>` : ""}
      </span>
      <span class="sub">${esc(i.author_name)} · ${fmtTs(i.created_at)}</span>
    </div>
    <div style="margin-top:8px">${esc(i.text)}</div>
    ${rs.map(r => `<div class="reply"><b>${esc(r.author_name)}</b>
      <span class="sub">· ${fmtTs(r.created_at)}</span><br>${esc(r.text)}</div>`).join("")}
    <div class="row" style="margin-top:10px">
      <button class="ghost small" data-act="reply" data-id="${i.id}">Rispondi</button>
      ${i.kind === "domanda" ? `<button class="ghost small" data-act="resolve" data-id="${i.id}">${
        i.resolved ? "↩︎ Riapri" : "✓ Chiudi"}</button>` : ""}
      <span style="flex:1"></span>
      ${i.author_name === me?.name
        ? `<button class="danger small" data-act="del-insight" data-id="${i.id}">Elimina</button>` : ""}
    </div>
  </div>`;
}

// ── Dialog generico ─────────────────────────────────────────
function openDialog(title, fieldsHtml, onSubmit, onOpen) {
  const dlg = $("#dlg"), form = $("#dlg-form");
  // il titolo prende il fuoco: così nessun campo si apre da solo
  form.innerHTML = `<h3 tabindex="-1" autofocus>${title}</h3>${fieldsHtml}
    <div class="dialog-actions">
      <button type="button" class="ghost" id="dlg-cancel">Annulla</button>
      <button type="submit">Salva</button>
    </div>`;
  form.onsubmit = async (e) => {
    e.preventDefault();
    // chi gestisce il salvataggio può restituire false per tenere
    // aperto il foglio senza far perdere quello che è stato scritto
    if (onSubmit && await onSubmit(new FormData(form)) === false) return;
    dlg.close();
  };
  form.querySelector("#dlg-cancel").onclick = () => dlg.close();
  if (onOpen) onOpen(form);
  dlg.showModal();
}

// ── Avvio ───────────────────────────────────────────────────
const { data: { session } } = await db.auth.getSession();
if (session) { await start(); } else { show("login"); }
</script>
</body>
